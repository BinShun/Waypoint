  ]
};

/* `vals` may be a positional array or an object keyed by field id.
   It used to be array-only, and every caller wrote a bare list of nine values
   in the order the spec happened to declare them. That is the shape TRAPS.md
   warns about: the day a field moves or is added, the values silently shift
   one place and Save writes somebody's competitor into their close date —
   no error, no clue. Callers may now pass `{ ed1: ..., ed2: ... }`, which
   cannot drift; the positional form is still accepted so the remaining
   callers keep working while they are converted. */
function edForm(key, vals){
  const kind = String(key).split('|')[0];
  const all = EDIT_SPEC[kind];
  if (!all) return '';
  /* The customer form is drawn one field at a time: a person sees the half of
     the record they can write, and nothing else. Every other kind is drawn
     whole, the way it always was. See `CUST_FIELD_CAP` for why only this one
     is split — it is the only form that carries both halves of §5's bargain. */
  const f = kind === 'cust' ? all.filter(x => canWriteCustField(x.k)) : all;
  if (!f.length) return '';
  const at = (x, i) => (Array.isArray(vals) ? vals[i] : (vals ? vals[x.k] : undefined));
  /* A current value the list does not contain would be replaced by whatever
     option the browser defaults to, so opening the form and pressing Save
     would silently rewrite a field nobody asked to change. Keep the value,
     then offer the choices. */
  const selOpts = (name, cur) => {
    const all = SELS[name]();
    const opts = (cur && !all.includes(cur)) ? [cur].concat(all) : all;
    return opts.map(o => '<option' + (o === cur ? ' selected' : '') + '>' + esc(o) + '</option>').join('');
  };
  const one = (x, i) => '<div id="f-' + x.k + '"' + (x.ta || x.wide ? ' style="grid-column:1/-1"' : '') + '>' +
    '<label class="tiny muted" style="display:block;margin-bottom:4px">' + x.ph + '</label>' +
    (x.sel
      ? '<select id="' + x.k + '" style="' + FLD + ';width:100%">' + selOpts(x.sel, at(x, i)) + '</select>'
      : x.ta
        ? '<textarea id="' + x.k + '" rows="5" style="' + FLD + ';width:100%;min-height:110px;resize:vertical">'
          + esc(at(x, i) ?? '') + '</textarea>'
        : '<input id="' + x.k + '" value="' + esc(at(x, i) ?? '') + '" style="' + FLD + ';width:100%" />') +
    '</div>';
  return '<div class="card" style="margin:var(--s3) var(--s4)">'
    + '<div class="grid g2" style="gap:var(--s3)">' + f.map(one).join('') + '</div>'
    + '<div class="row" style="margin-top:var(--s3);gap:8px"><div class="spacer"></div>'
    + '<button class="btn sm" data-act="edno">Cancel</button>'
    + '<button class="btn sm pri" data-act="edsave" data-ed="' + esc(key) + '">Save</button>'
    + '</div></div>';
}

function saveEdit(key){
  const p = String(key).split('|');
  const kind = p[0];
  const c = cust(p[1]);
  if (!c) return;
  /* The same gate that decided whether the button was drawn. A click can be
     forged; the server is still the rule, but the client must not help. */
  if (!canEditKind(key)) return;
  const v = (k) => ((document.getElementById(k) || {}).value || '').trim();
  const was = p[2];
  /* A win is the one save that deserves more than "Saved" — the toast
     carries the mascot when the theme is on. Message stays the same. */
  let wonNow = false;

  if (kind === 'person'){
    const row = (c.contacts || []).find(x => x.n === was);
    if (!row) return;
    const n = v('ed1');
    if (!n){ toast('A name, at least.'); return; }
    const before = row.n + ' · ' + row.t;
    row.n = n; row.t = v('ed2') || '-'; row.b = v('ed3'); row.s = v('ed4');
    row.em = v('ed5') || ''; row.ph = v('ed6') || '';
    row.li = v('ed7') || '';
    if (pickedPerson === was) pickedPerson = n;
    audit('data', 'Person updated', n + ' - ' + c.name, before, row.n + ' · ' + row.t);
  } else if (kind === 'system'){
    const row = (c.apps || []).find(x => x.n === was);
    if (!row) return;
    const n = v('ed1');
    if (!n){ toast('A name, at least.'); return; }
    const before = row.n + ' · ' + row.v;
    row.n = n; row.v = v('ed2') || '-'; row.stance = v('ed3');
    audit('data', 'System updated', n + ' - ' + c.name, before, row.n + ' · ' + row.v);
  } else if (kind === 'opp'){
    const row = D.opps[was];
    if (!row) return;
    const n = v('ed1');
    if (!n){ toast('Say what it is.'); return; }
    const close = v('ed5');
    if (close && !/^\d{4}-\d{2}-\d{2}$/.test(close)){
      toast('The close date needs to look like 2027-03-31 — or leave it empty.'); return;
    }
    /* A deal worth zero is not a deal, and it is not a harmless blank either:
       it sits in Open pipeline and Weighted as a real row, so the figures the
       team reads every morning are quietly wrong. Refused before anything is
       written, so a rejected save leaves the row exactly as it was. */
    const nv = Number(String(v('ed2')).replace(/[^0-9.]/g, ''));
    if (!nv || nv <= 0){
      const el = document.getElementById('ed2');
      if (el) el.focus();
      toast('Give it a value. Even a rough one — a deal at 0 skews the pipeline for everyone.');
      return;
    }
    const before = row.t + ' · ' + money(row.v);
    row.t = n;
    row.v = nv;
    const stageWas = row.stage;
    const stageNow = v('ed3') || row.stage;
    /* A loss with no reason is a hole, not a record: the pipeline says the deal
       died and nothing says why, so the next person walks into the same wall.
       Refuse it before anything is written. Checked on the value before it is
       assigned, so a refused save leaves the row exactly as it was. */
    if (stageNow === 'Lost' && !String(v('ed10') || '').trim()){
      const why = document.getElementById('ed10');
      if (why){ why.hidden = false; why.focus(); }
      toast('Say why we lost it — a loss with no reason is a hole in the pipeline.');
      return;
    }
    /* The clock restarts only when the stage actually changes. Re-opening the
       form to fix a typo in the value is not the deal moving, and treating it
       as one would make every rescue look like a fresh opportunity. */
    if (row.stage !== stageNow) row.stageAt = todayISO();
    row.stage = stageNow;
    wonNow = stageNow === 'Won' && stageWas !== 'Won';
    row.lost = stageNow === 'Lost' ? String(v('ed10') || '').trim() : '';
    row.p = Math.max(0, Math.min(100, Number(String(v('ed4')).replace(/[^0-9.]/g, '')) || 0));
    /* Close date, competitor, their owner and the description were display-
       only for the product's whole life: the screens showed them (and two
       statistics quietly died on them) while no form could ever set them. */
    row.close = close;
    row.comp = v('ed6') || '—';
    row.cust = v('ed7') || '';
    row.desc = v('ed8') || '';
    row.owner = v('ed9') || row.owner;
    /* A stage change is a fact about the account, so the timeline hears it —
       the same way a meeting or a completed action does. */
    if (row.stage !== stageWas){
      (c.timeline = c.timeline || []).unshift({ d: todayISO(), k:'opp',
        t: n, x: 'Stage: ' + stageWas + ' → ' + row.stage });
    }
    audit('data', 'Opportunity updated', n + ' - ' + c.name, before, row.t + ' · ' + money(row.v));
  } else if (kind === 'interaction'){
    /* The meeting and its timeline entry are one fact in two places, so both
       move together — including when the title or the date changes. */
    const row = (D.interactions || []).find(x => x.id === was);
    if (!row) return;
    const n = v('ed1');
    if (!n){ toast('Say what it was about.'); return; }
    const d = v('ed2');
    if (d && !/^\d{4}-\d{2}-\d{2}$/.test(d)){
      toast('The date needs to look like 2026-09-16 — or leave it empty.'); return;
    }
    const before = row.t + ' · ' + row.d;
    const tl = c.timeline || [];
    const at = tl.findIndex(t => TL_IS_INTERACTION(t.k) && t.t === row.t);
    row.t = n; row.d = d || row.d; row.loc = v('ed3') || '';
    row.att = v('ed4') || '-'; row.sum = v('ed5') || ''; row.out = v('ed6') || '';
    row.k = v('ed7') || row.k || 'Meeting';
    if (at >= 0){ tl[at].t = row.t; tl[at].d = row.d; tl[at].x = row.out; }
    audit('data', 'Interaction updated', n + ' - ' + c.name, before, row.t + ' · ' + row.d);
  } else if (kind === 'step'){
    const row = (D.steps || []).find(x => x.id === was);
    if (!row) return;
    const n = v('ed1');
    if (!n){ toast('Say what was promised.'); return; }
    const due = v('ed3');
    if (due && !/^\d{4}-\d{2}-\d{2}$/.test(due)){
      toast('The date needs to look like 2026-10-05 — or leave it empty.'); return;
    }
    /* §5 again, on the edit path: the Tracker must stay this account's Primary
       BD or Primary SA. Changing the account's owners does not silently move
       the existing follow-ups — an edit that would leave a step tracked by
       somebody no longer on the account is refused, loudly, rather than
       written and forgotten. */
    const track = v('ed5') || stepTrack(row);
    if (!trackOnCustomer(c, track)){
      toast('The Tracker must be this account\u2019s Primary BD (' + (c.owner || 'unset')
        + ') or Primary SA (' + (c.sa || 'unset') + ').');
      return;
    }
    const before = row.t + ' · ' + stepExec(row) + ' · tracked by ' + stepTrack(row);
    row.t = n;
    row.exec = v('ed2') || stepExec(row);
    row.track = track;
    row.due = due;
    row.from = v('ed4') === 'customer' ? 'customer' : 'us';
    /* The old single-owner field is dropped once the row carries both roles,
       so there is exactly one place either answer lives. */
    delete row.o;
    audit('data', 'Action updated', n + ' - ' + c.name, before,
          row.t + ' · ' + row.exec + ' · tracked by ' + row.track);
  } else if (kind === 'cust'){
    const n = v('ed1');
    if (!n){ toast('A name, at least.'); return; }
    const before = c.name + ' · ' + c.owner;
    /* §5, on the write path. The three commercial fields are not drawn for a
       role that cannot write them, and they are not written here either. A
       form is not a rule: somebody who opened the console and typed a value
       into the DOM, or replayed the request, would be writing a field the
       product never offered them. So every assignment below is asked for —
       the offer and the write are decided by the same function.
     *
     * Note what this is NOT. There is no `commercial` dimension on the server,
     * so this is the client refusing to make a request the rule does not want
     * made — a courtesy, not the boundary. Closing the boundary itself needs a
     * server that knows which fields are the money; it does not know today.
     * Written down here because "the SA form no longer shows Owner" reads like
     * the hole is shut, and the hole is one layer down. */
    const w = (k) => (canWriteCustField(k) ? v(k) : '');
    const mayWrite = (k) => canWriteCustField(k);
    c.name = n;
    c.industry = (mayWrite('ed2') ? v('ed2') : '') || c.industry;
    c.hq = (mayWrite('ed3') ? v('ed3') : '') || c.hq;
    /* Stored as a bare domain: every place that uses it puts the scheme back
       on, and one stored form means one thing to compare against. */
    c.site = mayWrite('ed4')
      ? ((v('ed4').replace(/^https?:\/\//i, '').replace(/\/.*$/, '').trim()) || '')
      : (c.site || '');
    c.owner = (mayWrite('ed5') ? v('ed5') : '') || c.owner;
    c.stance = (mayWrite('ed6') ? v('ed6') : '') || c.stance;
    c.health = (mayWrite('ed7') ? v('ed7') : '') || c.health;
    const ppl = Number(String(w('ed8')).replace(/[^0-9]/g, ''));
    if (w('ed8')) c.people = ppl || c.people;
    c.since = (mayWrite('ed9') ? v('ed9') : '') || c.since;
    audit('data', 'Customer updated', n, before, c.name + ' · ' + c.owner);
  } else if (kind === 'pains'){
    const lines = String(v('ed1')).split('\n').map(s => s.trim()).filter(Boolean);
    const before = (c.pains || []).length + ' recorded';
    c.pains = lines;
    audit('data', 'Pain points updated', c.name, before, lines.length + ' recorded');
  } else if (kind === 'brief'){
    const n = v('ed1');
    if (!n){ toast('Say where it stands.'); return; }
    c.brief = n;
    /* A person has now read it and put their name to it. Whatever wrote the
       previous version, this one is theirs — so the "AI draft" mark goes. */
    delete c.briefSrc;
    audit('data', 'Summary updated', c.name, '-', n.slice(0, 60));
  }
  edFor = null;
  render();
  toast('Saved', wonNow ? 'proud' : undefined);
}

/* A save that fails has to say so, or the product lies. Every failure path —
   a signed-out session, a refused write, a server that stopped answering —
   sets SY.note, and until now nothing ever printed it. A workspace that can
   lose an edit while looking calm is worse than one that crashes: at least a
   crash is honest. Shown at the top of every screen, with a way to try again. */
function syncBanner(){
  if (!SY.note) return '';
  return '<div class="card" style="margin-bottom:var(--s4);border-color:var(--risk)">'
    + '<div class="row" style="gap:8px;flex-wrap:wrap">'
    + '<span class="tag t-risk">Not saved</span>'
    + '<span class="tiny">' + esc(SY.note) + '</span>'
    + '<div class="spacer"></div>'
    + '<button class="btn sm" data-act="retry">Retry now</button>'
    + '</div></div>';
}

/* Anything a person has chosen but not submitted has no home in `D`: it is not
   a record yet, so the state that draws the page has never heard of it. That is
   fine until `render()` runs — and `render()` runs every time a save lands,
   including the save this product makes on its own. Two ways that bit:

     - typing a person's name, title and e-mail, pausing, and pressing Save was
       answered with "A name, at least." about a name that had been typed;
     - picking a colleague in the team picker and pressing Add added whoever
       happened to be first in the list. A select that is quietly reset to its
       first option does not fail — it succeeds, with the wrong person.

   So every control's value is carried across the redraw and put back. The
   add/edit form's own fields are only carried while the SAME form is still the
   open one: a different form reuses the same field ids for different questions,
   and an answer meant for the last one must not appear in it. */
function addFormDraft(key){
  const vals = {};
  for (const el of document.querySelectorAll('#page input[id], #page select[id], #page textarea[id]')) {
    vals[el.id] = el.value;
  }
  /* `open` is the form that was open when this snapshot was taken — see above. */
  return { key, open: key, vals };
}
function restoreAddFormDraft(draft){
  const focusId = document.activeElement ? document.activeElement.id : '';
  const sameForm = draft.open && draft.open === (addFor || edFor);
  for (const [id, v] of Object.entries(draft.vals)){
    const el = document.getElementById(id);
    if (!el || v == null) continue;
    if (!sameForm && /^(ad|ed)\d+$/.test(id)) continue;
    /* An empty select is "nothing chosen yet", which is its default and not an
       answer worth restoring. An empty text box somebody just cleared IS an
       answer, and putting the old words back would be the same theft again. */
    if (v === '' && el.tagName === 'SELECT') continue;
    el.value = v;
    /* A <select> only keeps a value its option list knows, and silently falls
       back to the first option otherwise — a classification the user chose
       becoming "Decision maker" is worse than losing it, because it looks
       deliberate. So the choice is added back rather than dropped. */
    if (el.tagName === 'SELECT' && el.value !== v){
      const opt = document.createElement('option');
      opt.value = v;
      opt.textContent = v;
      el.appendChild(opt);
      el.value = v;
    }
  }
  /* The caret goes back where it was — the same courtesy the search boxes get.
     A select has no caret to place, which is why this is allowed to fail. */
  if (/^(ad|ed)\d+$/.test(focusId)){
    const el = document.getElementById(focusId);
    if (el){ el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch { /* not a text field */ } }
  }
}

function render(){
  scheduleSync();
  /* The address bar follows the app. It is safe for this to run on every
     render, including the one a `hashchange` caused: `syncRoute` compares the
     hash it would write with the hash already there and returns early when
     they match, so reading the URL and reflecting it do not chase each other. */
  syncRoute();
  /* Captured before the rebuild, put back after it — see restoreAddFormDraft.
     Both halves are covered: the add form and the edit form are rebuilt by the
     same redraw, and a half-typed correction is the same loss as a half-typed
     new row. */
  const draft = addFormDraft(addFor || edFor || '');
  /* login is a surface of its own — no rail, no top bar, nothing to distract */
  if (view.s === 'login'){
    document.body.classList.add('onlogin');
    document.getElementById('loginRoot').innerHTML = loginScreen();
    return;
  }
  document.body.classList.remove('onlogin');
  document.body.classList.toggle('dense', dense);
  drawWatermark();
  document.body.classList.toggle('picked', !!pickedPerson);
  document.getElementById('loginRoot').innerHTML = '';
  renderNav();
  const p = document.getElementById('page');
  let s = view.s;
  if (s === 'admin' && !can('users')) s = 'today';   /* no back-door by URL */
  p.innerHTML = roleBanner() + '<div id="syncNote">' + syncBanner() + '</div>' +
   (s === 'today' ? screenToday() :
    s === 'calendar' ? screenCalendar() :
    s === 'customers' ? screenCustomers() :
    s === 'customer' ? screenCustomer() :
    s === 'people' ? screenPeople() :
    s === 'opportunities' ? screenOpportunities() :
    s === 'interactions' ? screenInteractions() :
    s === 'insights' ? screenInsights() :
    s === 'products' ? screenProducts() :
    s === 'admin' ? screenAdmin() :
    s === 'aitasks' ? screenAiTasks() : '');
  /* Only when the same form is still the open one. Opening a different
     add-form reuses the same field ids for different questions, and an answer
     typed for the last one must not appear in it.
     `draft.key`, not `draft.tab` — the object is built with `key`, and reading
     a name it does not have silently disabled every restore below. The guard
     looked right and never fired, which is the worst kind of broken: the
     protection existed in the code and not in the product. */
  /* The interactions list is drawn in its own pass, after the page: one search box
     re-renders it without a whole redraw. That pass owns the meeting rows, and
     an open edit form is one of them — so restoring before it runs would put
     the typed words into nodes that are about to be thrown away, and the
     correction would be lost by the very redraw that exists to protect it.
     Restore last, after everything that draws. */
  if (s === 'interactions') drawInteractions();
  /* #80: the task center polls only while it is the screen you are on —
     §23's question is answered live where it is asked, and costs nothing
     on every other screen. */
  if (s === 'aitasks'){ fetchAiTasks(); ensureAiTasksPolling(); }
  restoreAddFormDraft(draft);
  /* The edit form was just rebuilt, so the lost-reason field's visibility has
     to be decided again — the DOM does not remember it. After the restore, so
     a restored stage of "Lost" shows the field it makes required. */
  lostField();
  window.scrollTo(0,0);
}

/* "Why we lost" is only a question when the deal is lost. The stage select and
   the field sit in the same form, so the answer decides whether it is shown:
   a form that waited for Save to discover it was required would be punishing
   somebody after the fact for something it could have said up front. */
function lostField(){
  const sel = document.getElementById('ed3');
  const box = document.getElementById('f-ed10');
  if (!sel || !box) return;
  box.hidden = String(sel.value || '').trim() !== 'Lost';
}

/* the interactions search box re-renders only its own list, so focus never moves */
/* Search re-renders the whole page, so it is debounced — a book of a few
   hundred customers stays smooth while the caret never moves. Selects and
   toggles stay immediate: one click, one render. */
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const debouncedRender = debounce(() => render(), 150);
/* A small book renders instantly — and the verify suites read the DOM
   synchronously. Only a genuinely large book gets the debounce. */
const searchRender = () => (D.customers.length > 100 ? debouncedRender() : render());

/* ============================================================================ */
/*  Capture — one sentence becomes records.                                    */
/*                                                                             */
/*  This used to return a fixed list of seven chips about a company called     */
/*  NusaTel, four of them badged "AI", whatever you typed — and "Save" wrote   */
/*  nothing at all. It was a picture of a feature.                             */
/*                                                                             */
/*  Now the text is actually parsed, by rules that are deterministic and       */
/*  visible: the customer you pick, the catalogue items named, the money       */
/*  mentioned, the deadline words, and each clause that reads as an action.    */
/*  Every chip says where it came from, and Save writes the real records.      */
/*                                                                             */
/*  Rules first, model only where rules run out — and if no model is           */
/*  connected, the screen says so instead of pretending.                       */
/* ============================================================================ */

/* Whether a model is genuinely reachable. Null until the server has been
   asked — and when the answer is no, the screens say so rather than showing a
   badge that implies one answered. */
let aiState = null;

async function refreshAi(){
  try {
    const r = await fetch('/api/ai/status', { credentials: 'same-origin' });
    aiState = await r.json();
  } catch {
    aiState = { configured: false, reason: 'The server could not be asked.' };
  }
}

function aiNote(){
  if (!aiState || aiState.configured) return '';
  return `<div class="note" style="margin-top:var(--s4)">
    <strong>No model connected.</strong> Everything here is read by rules, which is why it is
    predictable — and why it misses anything the rules were not written for. Connect an endpoint
    in <b>Admin → AI &amp; model</b> and this screen will ask it as well.
    ${aiState.reason ? esc(aiState.reason) : ''}</div>`;
}

/* Saving the endpoint really saves it — server-side, and then really asks the
   endpoint whether it answers. "Saved" and "working" are different claims and
   this reports them separately. */
async function saveAiConfig(){
  const base = ((document.getElementById('aiBase') || {}).value || '').trim();
  const model = ((document.getElementById('aiModel') || {}).value || '').trim();
  const key = ((document.getElementById('aiKey') || {}).value || '').trim();
  if (!base || !model){ toast('A base URL and a model name are needed.'); return; }
  if (!key && !(aiState && aiState.hasKey)){ toast('An API key is needed.'); return; }
  try {
    const r = await fetch('/api/ai/config', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ base, model, key })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok){ toast(j.error || 'The server would not save that.'); return; }
    await refreshAi();
    audit('ai', 'Model endpoint saved', 'Workspace AI', '—', base);
    render();
    toast(aiState && aiState.reachable ? 'Saved · the endpoint answered.' : 'Saved · but the endpoint did not answer.');
  } catch { toast('Could not reach the server to save that.'); }
}

/* How much the model is allowed to think. A reasoning model spends its budget
   before it answers, so too small a number does not get a short reply — it
   gets no reply at all, which looks like a broken feature. */
async function saveAiBudget(){
  const tok = Number(((document.getElementById('aiBudget') || {}).value || '').trim());
  const secs = Number(((document.getElementById('aiTimeout') || {}).value || '').trim());
  if (!Number.isFinite(tok) || tok < 256){ toast('A token budget is needed — at least 256.'); return; }
  if (!Number.isFinite(secs) || secs < 5){ toast('A timeout is needed — at least 5 seconds.'); return; }
  try {
    const r = await fetch('/api/ai/budget', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ maxTokens: tok, timeoutMs: Math.round(secs * 1000) })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok){ toast(j.error || 'The server would not save that.'); return; }
    await refreshAi();
    audit('ai', 'Model budget saved', 'Workspace AI', '—', Math.round(tok) + ' tokens · ' + Math.round(secs) + 's');
    render();
    toast('Budget saved · ' + j.maxTokens + ' tokens, ' + Math.round(j.timeoutMs / 1000) + 's.');
  } catch { toast('Could not reach the server to save that.'); }
}

async function disconnectAi(){
  try {
    await fetch('/api/ai/config', { method: 'DELETE', credentials: 'same-origin' });
    await refreshAi();
    audit('ai', 'Model endpoint disconnected', 'Workspace AI', 'Connected', 'Not connected');
    render(); toast('Disconnected · every screen now works from rules.');
  } catch { toast('Could not reach the server.'); }
}

async function testAi(){
  toast('Asking the endpoint…');
  await refreshAi();
  render();
  toast(aiState && aiState.reachable ? 'The endpoint answered in ' + aiState.ms + ' ms.'
    : (aiState && aiState.configured ? 'The endpoint did not answer.' : 'No endpoint is set.'));
}

const CAP_PLACEHOLDER = 'Met their CTO today. They are interested in OceanBase for the billing platform, contract up 2027. John will prepare the architecture proposal by Friday, and I need to follow up with their CTO next week.';

const DAY_NAMES = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];

function capAddDays(iso, n) {
  const d = new Date(iso + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}

/* Deadline words become a real date. "Next week" that stays the string
   "next week" is not a date anybody can be late for. */
function capDue(clause, today) {
  const t = clause.toLowerCase();
  if (/\btoday\b/.test(t)) return { due: today, w: 'today' };
  if (/\btomorrow\b/.test(t)) return { due: capAddDays(today, 1), w: 'tomorrow' };
  if (/\bnext week\b/.test(t)) return { due: capAddDays(today, 7), w: 'in 7d' };
  const iso = t.match(/\b(\d{4}-\d{2}-\d{2})\b/);
  if (iso) return { due: iso[1], w: iso[1] };
  for (let i = 1; i <= 6; i++) {
    if (new RegExp('\\b(on |by |next )?' + DAY_NAMES[i] + '\\b').test(t)) {
      const cur = new Date(today + 'T00:00:00Z').getUTCDay();
      let diff = (i - cur + 7) % 7;
      if (diff === 0) diff = 7;
      return { due: capAddDays(today, diff), w: 'in ' + diff + 'd' };
    }
  }
  const rel = t.match(/\bin (\d+)\s*(day|week|month)s?\b/) || t.match(/\b(\d+)\s*(day|week|month)s?\b/);
  if (rel) {
    const n = Number(rel[1]);
    const mult = /week/.test(rel[2]) ? 7 : /month/.test(rel[2]) ? 30 : 1;
    if (n > 0 && n < 400) return { due: capAddDays(today, n * mult), w: 'in ' + n + ' ' + rel[2] + (n > 1 ? 's' : '') };
  }
  return { due: '', w: '' };
}

/* Money: "RM 1.8m", "1.8 million", "USD 400k". */
function capMoney(text) {
  const m = String(text).match(/(?:rm|myr|usd|\$)\s*([\d.,]+)\s*(billion|bn|million|m\b|k\b)?/i)
    || String(text).match(/\b([\d.,]+)\s*(billion|bn|million)\b/i);
  if (!m) return 0;
  const n = Number(String(m[1]).replace(/,/g, ''));
  if (!Number.isFinite(n)) return 0;
  const unit = (m[2] || '').toLowerCase();
  if (/billion|bn/.test(unit)) return Math.round(n * 1e9);
  if (/million/.test(unit) || /^m/.test(unit)) return Math.round(n * 1e6);
  if (/^k/.test(unit)) return Math.round(n * 1e3);
  return Math.round(n);
}

/* A step is a promise about the future, and people write those two ways:
     "I will send the proposal by Friday"   — announced
     "Send the proposal by Friday"          — instructed
   The second is what somebody types in a hurry, straight after a call, and
   it is the one this pattern used to miss completely: the user had just
   promised something, watched "1 proposal" appear, pressed Save — and no
   follow-up existed anywhere. Missing a record the user believes they
   created is worse than offering one they then delete.
   Only verbs that ARE a commitment are listed. "Runs on Oracle" is a fact,
   not a next step, so describe-verbs are deliberately absent. */
const ACTION_VERBS = 'send|share|prepare|review|confirm|provide|deliver|chase|email|call|' +
  'book|schedule|arrange|check|draft|fix|update|complete|submit|renew|organise|organize|' +
  'ask|ping|visit|present|approve|sign|set up|follow up';
const ACTION_RE = new RegExp(
  '(?:^|(?<=[.;!?]\\s))(?:please\\s+)?(?:' + ACTION_VERBS + ')\\b' +
  '|\\b(?:will|\'ll|shall|need(?:s)? to|must|should|going to|to (?:' + ACTION_VERBS +
  ')|follow(?:ing)? up|by (?:monday|tuesday|wednesday|thursday|friday|saturday|sunday|' +
  'tomorrow|next week|today))\\b', 'i');
const PAIN_RE = /\b(pain|too slow|slow|expensive|cost(?:s|ly|ing)?|contract (?:up|ends?|renewal|expiry)|expiring|expires|no single view|manual(?:ly)?|risk|outage|downtime|legacy|lock-?in|shortage|only \w+ (?:engineers|people)|can'?t scale|difficult)\b/i;
const MEET_RE = /\b(met|meeting|call(?:ed)? with|visited|workshop|sat down|joined)\b/i;

function capSplitClauses(text) {
  return String(text)
    .replace(/\s+/g, ' ')
    .split(/(?<=[.;!?])\s+|\s+and\s+(?=i\b|we\b|they\b|he\b|she\b|[A-Z][a-z]+\b)/i)
    .map(s => s.trim())
    .filter(s => s.length > 3);
}

function capPersonIn(clause, c) {
  const people = [...((c && c.contacts) || []).map(p => p.n), ...(D.team || []).map(p => p.n)];
  for (const p of people) {
    if (!p) continue;
    const last = p.split(' ').slice(-1)[0];
    if (last.length > 2 && new RegExp('\\b' + last.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i').test(clause)) return p;
  }
  return '';
}

/**
 * Turn one sentence into proposals. Deterministic: the same sentence always
 * produces the same chips, which is the only kind of parsing you can audit.
 */
function parseCapture(text, cid) {
  const chips = [];
  const c = cust(cid);
  if (!c) return chips;
  const raw = String(text || '').trim();
  if (!raw) return chips;
  const lower = raw.toLowerCase();
  const seen = new Set();
  const add = (ch) => {
    const key = ch.k + '|' + ch.t;
    if (seen.has(key)) return;
    seen.add(key);
    chips.push({ ...ch, src: 'rule', on: true });
  };

  /* ---- the meeting itself ---- */
  if (MEET_RE.test(lower)) {
    const when = /\byesterday\b/.test(lower) ? 'yesterday' : /\btoday\b/.test(lower) ? 'today' : todayISO();
    const title = capSplitClauses(raw)[0] || ('Meeting · ' + c.name);
    add({ k: 'Meeting', t: 'Meeting · ' + c.name + ' · ' + when,
      d: 'Logged as a meeting on ' + c.name + ', ' + when,
      write: 'interaction', text: title.replace(/\.$/, '').slice(0, 90), when });
  }

  /* ---- what they want, matched against the real catalogue ---- */
  const products = (D.products || []).filter(p => {
    const names = [p.n, p.ab].filter(Boolean);
    return names.some(n => n && n.length > 2 && lower.includes(n.toLowerCase()));
  });

  /* ---- money and the opportunity it belongs to ---- */
  const value = capMoney(raw);
  /* "proposal" is not here on purpose. A proposal is a document you send, not
     a thing you sell: "Send the proposal by Friday" used to open an
     opportunity called "Send the proposal by Friday". */
  const wantsOpp = value > 0 || products.length > 0 || /\bopportunity|deal|tender|poc|bid\b/i.test(lower);
  if (wantsOpp) {
    /* Never name an opportunity after an instruction. If the sentence is a
       to-do, the honest title is the product it is about, or nothing. */
    const lead = capSplitClauses(raw)[0] || '';
    const first = products[0] ? products[0].n
      : ACTION_RE.test(lead) ? 'New opportunity'
      : (raw.split(/[.,]/)[0] || 'New opportunity').slice(0, 60);
    const existing = (c.opps || []).map(opp).filter(Boolean)
      .find(o => products.some(p => (o.t || '').toLowerCase().includes(p.n.toLowerCase())));
    add({ k: 'Opportunity',
      t: first + (value ? ' · RM ' + value.toLocaleString() : '') + (existing ? ' · updates the existing one' : ''),
      d: existing ? 'Updates the existing opportunity, ' + money(existing.v) : 'Creates a new opportunity on ' + c.name,
      write: 'opp', value, products: products.map(p => p.n), existingId: existing ? existing.id : '' });
  }

  /* ---- clauses that read as an action become next steps ---- */
  capSplitClauses(raw).forEach(clause => {
    if (!ACTION_RE.test(clause)) return;
    const named = capPersonIn(clause, c);
    const mine = /\b(i|we|our|us|myself)\b/i.test(clause) || (named && (D.team || []).some(t => t.n === named));
    const theirs = /\b(they|their|them)\b/i.test(clause) || (named && ((c.contacts) || []).some(p => p.n === named));
    const from = (!mine && theirs) ? 'customer' : 'us';
    const owner = named || (from === 'us' ? ((D.me && D.me.name) || 'Teh Bin Shun') : '');
    const { due, w } = capDue(clause, todayISO());
    const what = clause.replace(/^(i|we|they|he|she)\s+/i, '').replace(/\.$/, '').trim();
    if (what.length < 4) return;
    add({ k: 'Next step', t: (owner ? owner + ' — ' : '') + what + (w ? ' · by ' + w : ''),
      d: (from === 'us' ? 'Ours' : 'Theirs') + (due ? ' · due ' + due : ' · no date found'),
      write: 'step', from, owner, due, w, text: what });
  });

  /* ---- clauses that name a problem become pain points ---- */
  capSplitClauses(raw).forEach(clause => {
    if (!PAIN_RE.test(clause)) return;
    if (ACTION_RE.test(clause) && !/\bpain\b/i.test(clause)) return; // an action, not a problem
    const what = clause.replace(/\.$/, '').trim();
    if (what.length < 8) return;
    add({ k: 'Pain point', t: what.slice(0, 90), d: 'Added to ' + c.name + '’s pain points', write: 'pain', text: what });
  });

  return chips;
}

      <button class="btn" id="capBack">Edit the text</button>

      <button class="btn pri" id="capSave"${on.length ? '' : ' disabled style="opacity:.45"'}>Save ${on.length} record${on.length === 1 ? '' : 's'}</button>
    </div>`;

  b.querySelectorAll('[data-drop]').forEach(el => el.onclick = () => {
    capState.chips[+el.dataset.drop].on = false; drawCapture();
  });
  document.getElementById('capBack').onclick = () => { capState.stage = 'write'; drawCapture(); };
  document.getElementById('capSave').onclick = () => { if (on.length) capSave(on); };
}

function runCapture(){
  const text = (document.getElementById('capT') || {}).value || '';
  if (!text.trim()){ toast('Write what happened first.'); return; }
  if (!capState.cid){ toast('Pick the customer this is about.'); return; }
  capState.chips = parseCapture(text, capState.cid);
  capState.stage = 'confirm';
  drawCapture();
}

/* Used by the tour: it must show what really happens, so it really parses. */
function tourCapture(){
  openCapture();
  const t = document.getElementById('capT');
  if (t) t.value = CAP_PLACEHOLDER;
  const c = D.customers[0];

}

/* The save that used to be a toast. */
function capSave(on){
  const c = cust(capState.cid);
  if (!c) return;
  const me = (D.me && D.me.name) || 'Teh Bin Shun';
  let written = 0;

  on.forEach(ch => {
    if (ch.write === 'interaction'){
      const when = ch.when === 'yesterday' ? capAddDays(todayISO(), -1) : todayISO();
      (D.interactions = D.interactions || []).unshift({
        id: 'm' + Date.now(), c: c.id, t: ch.text || ('Meeting · ' + c.name),
        d: when, w: when === todayISO() ? 'Today' : when, loc: '', att: '', ours: me,
        sum: '', out: ''
      });
      (c.timeline = c.timeline || []).unshift({ d: when, k: 'interaction', t: 'Interaction', x: 'Logged from capture.' });
      written++;
    } else if (ch.write === 'step'){
      /* Capture writes the same row shape as every other door into the model:
         an Execution Owner from the sentence, and a Tracker from the account.
         A captured action used to carry one owner and no tracker, which meant
         an action typed in a hurry was the one kind of step nobody was
         answerable for. */
      (D.steps = D.steps || []).push({
        id: 's' + Date.now() + written, c: c.id, t: ch.text || ch.t,
        exec: ch.owner || me, track: c.owner || c.sa || me,
        due: ch.due || '', w: ch.w || '', from: ch.from || 'us', p: 'p1',
        done:'', doneBy:'', doneNote:''
      });
      written++;
    } else if (ch.write === 'pain'){
      (c.pains = c.pains || []).push(ch.text || ch.t);
      written++;
    } else if (ch.write === 'opp'){
      const id = ch.existingId || ('o' + Date.now());
      const existing = D.opps[id];
      if (existing){
        if (ch.value) existing.v = ch.value;
        if (ch.products && ch.products.length) existing.desc = existing.desc || ch.products.join(', ');
      } else {
        (D.opps = D.opps || {})[id] = {
          id, c: c.id, t: ch.products && ch.products.length ? ch.products[0] : 'New opportunity',
          stage: (D.stages || ['Interested'])[0], v: ch.value || 0, p: 10, stageAt: todayISO(), owner: me,
          comp: '-', close: '', cust: '', desc: (ch.products || []).join(', '), soln: ''
        };
        (c.opps = c.opps || []).push(id);
      }
      written++;
    }
  });

  audit('data', 'Captured from a sentence', c.name, '-', written + ' records');
  closeCapture();
  render();
  toast('Saved ' + written + ' record' + (written === 1 ? '' : 's') + ' to ' + c.name + '.');
}

const QUERIES = [
  { q: 'What am I waiting for?', h: 'Deterministic query — no model needed' },
  { q: 'Which opportunities have not progressed recently?', h: 'Deterministic query' },
  { q: 'Show me every recorded pain point', h: 'Cross-record retrieval' },
  { q: 'Prepare me for my next meeting', h: 'Assembles the brief' }
];

function openPal(){
  document.getElementById('pal').classList.add('on');
  const i = document.getElementById('palI');
  i.value = ''; i.focus();
  drawPal();

/* Free text in the palette searches the whole book - the customer, their
   people, their opportunities, every activity, the catalogue - and every
   result jumps to the record it came from. "Where is Rachelle?" is a search,
   not a navigation puzzle. */
function searchAll(q){
  const t = String(q || '').trim().toLowerCase();
  if (!t) return [];
  const hit = (x) => String(x ?? '').toLowerCase().includes(t);
  const out = [];
  const jump = (fn) => () => { closePal(); fn(); render(); };
  for (const c of visibleCustomers()){
    if (hit(c.name + ' ' + (c.industry || '') + ' ' + (c.site || '')))
      out.push({ l:'Customer', t:c.name, x:[c.industry, c.owner && ('owner ' + c.owner)].filter(Boolean).join(' · '),
        go: jump(() => { view = { s:'customer', id:c.id, tab:'brief', cview:'board' }; }) });
    for (const p of (c.contacts || []))
      if (hit(p.n + ' ' + (p.t || '') + ' ' + (p.em || '') + ' ' + (p.ph || '')))
        out.push({ l:'Person', t:p.n, x:c.name + ' · ' + (p.t || ''),
          go: jump(() => { view = { s:'customer', id:c.id, tab:'people', cview:'board' }; pickedPerson = p.n; }) });
    for (const o of (c.opps || []).map(opp).filter(Boolean))
      if (hit(o.t + ' ' + (o.desc || '') + ' ' + (o.comp || '')))
        out.push({ l:'Opportunity', t:o.t, x:c.name + ' · ' + money(o.v) + ' · ' + o.stage,
          go: jump(() => { view = { s:'customer', id:c.id, tab:'opportunities', cview:'board' }; }) });
  }
  for (const m of (D.interactions || []).filter(m => inScope(m.c)))
    if (hit(m.t + ' ' + (m.out || '') + ' ' + (m.att || '') + ' ' + (m.sum || '')))
      out.push({ l:'Activity', t:m.t, x:((cust(m.c) || {}).name || '') + ' · ' + m.d,
        go: jump(() => { view = { s:'interactions', id:null, tab:'brief', cview:'board' }; meetQ = m.t; }) });
  for (const p of (D.products || []))
    if (hit(p.n + ' ' + (p.cat || '') + ' ' + (p.one || '')))
      out.push({ l:'Product', t:p.n, x:p.cat,
        go: jump(() => { view = { s:'products', id:null, tab:'brief', cview:'board' }; }) });
  return out.slice(0, 8);
}
function closePal(){ document.getElementById('pal').classList.remove('on'); }

function drawPal(){

  if (q.trim()){

      (hits.length
