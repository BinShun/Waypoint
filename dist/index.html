          + hits.map((h, i) => `<button class="pal-q" data-hit="${i}">
              <span class="pr-main"><span class="ft">${esc(h.t)}</span><span class="fx">${esc(h.x || '')}</span></span>
              <span class="tag t-grey">${esc(h.l)}</span><span class="pr-c">›</span>
            </button>`).join('')
        : `<div class="empty" style="margin:var(--s3)">Nothing matches “${esc(q)}” in the customers, people,
            opportunities, activities or products you can see.</div>`)
      + `<div class="tiny muted" style="padding:6px var(--s3)">${esc(QUERIES[3].h)}? Press Enter.</div>`;
    document.getElementById('palA').innerHTML = '';
    document.querySelectorAll('[data-hit]').forEach(b => b.onclick = () => hits[+b.dataset.hit].go());
    return;
  }
  document.getElementById('palB').innerHTML =
    `<div class="artline" style="padding:var(--s2) var(--s3) var(--s3)">
       ${ART.copilot}
       <div class="t">Search everything you can see — a customer, a person, an opportunity, an
         activity, a product — or ask one of the questions below. Answers come from <b>your records</b>,
         only the ones you are allowed to open, and every answer carries the <b>citations</b> it came from.
       </div>
     </div>
     <div class="tiny muted" style="padding:2px var(--s3) 6px">Try</div>` +
    QUERIES.map((x,i) => `<button class="pal-q" data-q="${i}">${esc(x.q)}<div class="spacer"></div><span class="tiny muted">${esc(x.h)}</span></button>`).join('');
  document.getElementById('palA').innerHTML = '';
  document.querySelectorAll('[data-q]').forEach(b => b.onclick = () => answer(QUERIES[+b.dataset.q].q));
}

/* #73 — a newer question must never be overwritten by an older one's late
   landing: every answer carries the seq of the ask that started it, and a
   render from a superseded ask stands down. */
let palAnswerSeq = 0;

/* The citations an answer carries, made clickable when they name a record
   the book still holds (§16: "Allow users to open the source Customer /
   Opportunity / MOM / Next Step"). A task's citations arrive as
   "Kind · label (id)"; the deterministic rules cite by label alone, and
   those stay plain text — there is no id to walk. An id the book no longer
   knows (a step that never carried one, a record since deleted) stays
   plain text too: a door that opens nothing is a promise, not a door. */
function palCite(x){
  const s = String(x || '');
  const m = s.match(/^(.+?) · (.*) \(([^()]*)\)$/);
  if (m){
    const [, kind, , id] = m;
    let door = '';
    if ((kind === 'Customer' || kind === 'Timeline') && cust(id)) door = ` data-open="${esc(id)}"`;
    else if (kind === 'Opportunity'){
      const o = opp(id);
      if (o && cust(o.c)) door = ` data-cgo="${esc(o.c)}" data-cgotab="opportunities"`;
    } else if (kind === 'MOM' || kind === 'Next step'){
      const hit = (kind === 'MOM' ? D.interactions : D.steps || []).find((r) => r && r.id === id);
      if (hit && cust(hit.c)) door = ` data-cgo="${esc(hit.c)}" data-cgotab="timeline"`;
    }
    if (door) return `<a class="cite lk"${door}>${esc(s)}</a>`;
  }
  return `<span class="cite">${esc(s)}</span>`;
}

/* One painter for every answer the palette shows — the local rules, the
   server's rules, a finished task, an honest miss — so they all look like
   what they are: one copilot answering from one book. Doors close the
   palette first; the document's own delegation then opens the record. */
function paintPalAnswer(html, cites){
  document.getElementById('palA').innerHTML = `
    <div style="font-size:13.5px;line-height:1.65">${html}</div>
    ${cites && cites.length ? `<div class="tiny muted" style="margin:var(--s3) 0 6px">From ${cites.length} records</div>
      <div>${cites.map(palCite).join('')}</div>` : ''}`;
  document.querySelectorAll('#palA a[data-open], #palA a[data-cgo]')
    .forEach((a) => { a.onclick = () => closePal(); });
}

/* A task's answer arrives behind the response, so the palette polls for it
   the way every task box does. The seq is the guard from above; a task
   that outlives the patience window is not abandoned on the server — the
   ask can be made again, and the server reuses the running task rather
   than starting a second one. */
async function pollPalAnswer(taskId, seq){
  for (let i = 0; i < 30; i++){
    await new Promise((r) => setTimeout(r, 1500));
    if (seq !== palAnswerSeq) return;
    let t = null;
    try {
      const r = await fetch('/api/ai/tasks?since=0', { credentials: 'same-origin' });
      const j = await r.json().catch(() => ({}));
      t = (j.tasks || []).find((x) => x.id === taskId) || null;
    } catch { /* one lost poll is not a lost task — the next tick tries again */ }
    if (!t || t.state === 'queued' || t.state === 'running') continue;
    if (seq !== palAnswerSeq) return;
    if (t.state === 'completed'){
      const res = t.result || {};
      paintPalAnswer(esc(res.answer || 'The model returned an empty answer.'), res.citations || []);
    } else {
      paintPalAnswer(esc(t.error || 'The model could not answer that.'), []);
    }
    return;
  }
  if (seq === palAnswerSeq)
    paintPalAnswer('The answer is taking longer than a minute — it is still running on the server. Ask again shortly and the finished answer is picked up.', []);
}

/* What the palette says when the copilot itself could not be reached: the
   search it can still do on its own, and no claim about anything else. */
function searchFallback(q, why){
  const hits = searchAll(q);
  paintPalAnswer(`${why ? esc(why) + ' ' : ''}${hits.length
    ? `${hits.length === 1 ? 'One record matches' : hits.length + ' records match'} <strong>${esc(q)}</strong> — open the palette again and type it to jump straight there.`
    : `Nothing in the book matches <strong>${esc(q)}</strong>.`}`,
    hits.map((h) => h.l + ' · ' + h.t + (h.x ? ' · ' + h.x : '')).slice(0, 6));
}

async function answer(q){
  const seq = ++palAnswerSeq;
  const t = q.toLowerCase();
  /* id → customer name. This used to be missing here, and the waiting
     branch below crashed on the first "What is waiting on a customer?" —
     three LOCAL `nm`s elsewhere in the file kept the ghost-scan quiet,
     which is why a scan is a net, not a proof: the question itself is now
     asked by a suite, every run. */
  const nm = (id) => ((cust(id) || {}).name) || '';
  let body;
  if (t.includes('waiting')){
    /* Real query: everything that is theirs, soonest first. Nothing typed in. */
    const theirs = D.steps.filter(s => s.from === 'customer' && !stepIsDone(s) && inScope(s.c))
      .sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999'));
    body = theirs.length
      ? {
          a: `${theirs.length} thing${theirs.length === 1 ? '' : 's'} in the customer’s court. The nearest is
             <strong>${esc(stepExec(theirs[0]) || 'Someone')}</strong> at ${esc(nm(theirs[0].c))} —
             ${esc(theirs[0].t)}${theirs[0].due ? ', due ' + esc(theirs[0].due) : ', no date set'}.
             ${theirs[1] ? 'After that, <strong>' + esc(stepExec(theirs[1]) || 'Someone') + '</strong> at ' + esc(nm(theirs[1].c)) + ' owes you ' + esc(theirs[1].t) + '.' : ''}`,
          c: theirs.slice(0, 3).map(s => 'Next step · ' + s.t)
        }
      : { a: 'Nothing is waiting on a customer right now. Every open action is ours.', c: [] };
  } else if (t.includes('progress') || t.includes('stall') || t.includes('moved')){
    const open = Object.values(D.opps).filter(o => inScope(o.c) && D.stages.includes(o.stage));
    const worst = open.slice().sort((a, b) => oppAge(b) - oppAge(a))[0];
    body = worst
      ? {
          a: `${open.length} open opportunit${open.length === 1 ? 'y' : 'ies'}. The one that has sat longest is
             <strong>${esc(worst.t)}</strong> at ${esc(nm(worst.c))} — ${oppAge(worst)} days in
             ${esc(worst.stage)}, ${money(worst.v)}${worst.p <= 25 ? ', and the probability has not moved past ' + worst.p + '%' : ''}.`,
          c: ['Opportunity · ' + worst.t, 'Customer · ' + nm(worst.c)]
        }
      : { a: 'There are no open opportunities in the customers you can see.', c: [] };
  } else if (t.includes('pain') || t.includes('problem')){
    const withPain = visibleCustomers().filter(c => (c.pains || []).length);
    const c0 = withPain.find(c => t.toLowerCase().includes(c.name.toLowerCase()))
      || withPain.sort((a, b) => b.pains.length - a.pains.length)[0];
    body = c0
      ? {
          a: `${esc(c0.name)} — ${c0.pains.length} recorded problem${c0.pains.length === 1 ? '' : 's'}:
             ${c0.pains.map(p => '<strong>' + esc(p) + '</strong>').join('; ')}.
             ${(c0.opps || []).map(opp).filter(Boolean).length
               ? 'The opportunities attached to them: ' + (c0.opps || []).map(opp).filter(Boolean).map(o => esc(o.t) + ' (' + money(o.v) + ')').join(', ') + '.'
               : 'No opportunity has been attached to them yet.'}`,
          c: c0.pains.map(p => 'Pain · ' + p)
        }
      : { a: 'No pain points have been recorded on any customer you can see.', c: [] };
  } else if (t.includes('prepare')){
    closePal(); openPrepare(); return;
  } else {
    /* Everything above this line is a question the product can answer
       from the records, without a model — this branch is everything
       else. It used to answer with a claim: that it could speak about
       customers, opportunities, interactions, people and next steps, and
       draft changes for approval. It did none of those things, and the
       words were the same whatever was typed, so the claim was replaced
       by search — honest, but still not an answer.
       #73 is the answer (§4, §21): one copilot door, POST /api/ai/copilot
       action 'answer'. The gate and the deterministic rules run on the
       server, in the caller's own scope, and a rule hit comes back in
       the same breath — no model is ever consulted (the §19.1 brief in
       capitals). What the rules cannot answer becomes a task behind the
       response, and the palette polls for it the way every task box
       does. No model configured is not a spinner to hang: it comes back
       as an honest miss, and the palette says what it can do without
       one. The search fallback survives for the one failure that is
       nobody's policy — the endpoint could not be reached at all. */
    paintPalAnswer('Asking the copilot…', []);
    try {
      const r = await fetch('/api/ai/copilot', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'answer', question: q })
      });
      const j = await r.json().catch(() => ({}));
      if (seq !== palAnswerSeq) return;
      if (r.ok && j.ok && j.kind === 'rule'){
        paintPalAnswer(esc(j.answer || ''), j.citations || []); return;
      }
      if (r.ok && j.ok && j.kind === 'task' && j.task && j.task.id){
        paintPalAnswer('Asking the model — the answer lands here, no refresh needed.', []);
        pollPalAnswer(j.task.id, seq); return;
      }
      if (r.ok && j.ok && j.kind === 'unmatched'){
        /* The honest miss (§19.2): no model, and the rules did not
           recognise the question. Say that, offer the search that needs
           no model, and point at where the fix is made — never a
           pretended answer. */
        const hits = searchAll(q);
        paintPalAnswer(`No model endpoint is configured, so a question the rules cannot answer is not answered — the admin screen is where that is set.${hits.length
          ? ' ' + (hits.length === 1 ? 'One record matches' : hits.length + ' records match') + ' <strong>' + esc(q) + '</strong>, though.'
          : ''}`,
          hits.map((h) => h.l + ' · ' + h.t + (h.x ? ' · ' + h.x : '')).slice(0, 6));
        return;
      }
      throw new Error((j && j.error) || 'unreachable');
    } catch {
      if (seq !== palAnswerSeq) return;
      searchFallback(q, 'The copilot could not be reached just now.');
      return;
    }
  }
  if (seq !== palAnswerSeq) return;
  paintPalAnswer(body.a, body.c);
}

/* --------------------------------------------------------- prepare (A5) */
/*                                                                          */
/*  Three sheets used to open with a violet "AI" badge over a paragraph      */
/*  written by hand once, in 2026, about one customer. It was the same       */
/*  paragraph for every opportunity, and no model had ever been asked        */
/*  anything. That is the worst kind of bug in a system of record: not a     */
/*  crash, a claim.                                                          */
/*                                                                          */
/*  Now the split is explicit and visible:                                   */
/*    Rule  — facts computed from the records, identical every time.         */
/*    AI    — a real call, made only when you press for it, that says so     */
/*            when it fails and never substitutes invented text.             */
/*  And a customer marked confidential is never sent to a model at all.      */
/* ------------------------------------------------------------------------- */

const SYS_BRIEF = 'You are helping a Tencent Cloud account team prepare. Be specific, be brief, and only use the facts given. If the facts do not support a conclusion, say so rather than inventing one.';

async function askModel(prompt, system){
  const r = await fetch('/api/ai/complete', {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prompt, system: system || SYS_BRIEF })
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.ok) {
    const e = new Error(j.error || 'The model could not be reached.');
    e.code = j.code || 'unreachable';
    throw e;
  }
  return j.text;
}

/* The box is only offered when a model is both set and answering. Otherwise
   the screen shows why — it does not quietly drop the subject. */
function modelAskBox(mountId, label){
  if (!(aiState && aiState.configured && aiState.reachable)) return aiNote();
  return `<div class="card" style="background:var(--violet-50);border-color:var(--violet-line)" id="${mountId}">
    <div class="row">${mascot('box', 'm-box')}<span class="ai-mark model">AI</span><div class="spacer"></div>
      <span class="tiny muted">${esc(aiState.model)}</span></div>
    <div class="row" style="margin-top:8px">
      <span class="tiny muted">Only the facts on this screen are sent. Asked when you press, never stored.</span>
      <div class="spacer"></div>
      <button class="btn sm" id="${mountId}Go">${esc(label)}</button>
    </div>
  </div>`;
}

function wireModelBox(mountId, prompt, label, after){
  const b = document.getElementById(mountId + 'Go');
  if (b) b.onclick = () => modelRun(mountId, prompt, label, after);
}

async function modelRun(mountId, prompt, label, after){
  const host = document.getElementById(mountId);
  if (!host) return;
  host.innerHTML = `<div class="row"><span class="ai-mark model">AI</span>
    <span class="tiny muted" style="margin-left:8px">Asking ${esc((aiState && aiState.model) || 'the model')}…</span>
    <div class="spacer"></div>${corgiWorking()}</div>`;
  let text;
  try {
    text = await askModel(prompt);
    host.innerHTML = `
      <div class="row"><span class="ai-mark model">AI</span><div class="spacer"></div>
        <span class="tiny muted">${esc((aiState && aiState.model) || '')} · just now</span></div>
      <p style="margin:8px 0 0;font-size:13.5px">${esc(text)}</p>
      <div class="row" style="margin-top:8px"><button class="btn sm" id="${mountId}Go">Ask again</button></div>`;
    if (after) after(text);
  } catch (e) {
    host.innerHTML = `
      <div class="row"><span class="ai-mark model">AI</span><div class="spacer"></div>
        <span class="tag t-risk">Unavailable</span></div>
      <p class="tiny muted" style="margin:8px 0 0">${esc(e.message || 'The model could not be reached.')}
        Nothing was invented in its place.</p>
      <div class="row" style="margin-top:8px"><button class="btn sm" id="${mountId}Go">Try again</button></div>`;
  }
  const b = document.getElementById(mountId + 'Go');
  if (b) b.onclick = () => modelRun(mountId, prompt, label, after);
}

/* ============================================================================ */
/*  AI task boxes (§21–§23) — the ask becomes a task, the box shows the state  */
/* ============================================================================ */
/* The synchronous boxes above (modelRun) hold a line open for as long as the
   model takes. These hold nothing open: an ask POSTs once, becomes a task,
   and a per-box poller watches the task table until the state is terminal.
   The person can navigate anywhere and come back — the task table is the
   durable state, and this registry is only the screen's memory of which box
   to redraw when its screen is shown again. §21's promise is literal:
   "The system is working. You do not need to refresh the page."
   Buttons ride the document click delegation ([data-tb]) like every other
   control in this file — no per-mount wiring to forget. */
const aiTasks = new Map();   /* mountId -> {id, state, result, error, retryable, at} */

/* #68 — the focus-week list (§5). Each item names its records — the
   customer is a door into the book, not decoration — states the fact the
   book computed, and, when the model offered one, shows its suggested
   action with a Create Next Step button. That button only ever opens a
   confirm sheet; no answer writes anything. */
function focusWeekHtml(st, items){
  if (!items.length) return `<div class="empty" style="padding:var(--s4)">
    Nothing needs you — no overdue step, no deal gone quiet, nothing waiting on a customer.</div>`;
  return `<p class="tiny" style="margin:10px 0 0;font-weight:600">This week</p>
    ${items.map((it, i) => `
    <div style="border-top:1px solid var(--line);padding:10px 0">
      <div style="font-size:13.5px;font-weight:500"><a class="lk" data-open="${esc(it.customerId)}">${esc(it.customer)}</a>${it.oppTitle ? ' — ' + esc(it.oppTitle) : ''}</div>
      <div class="tiny muted" style="margin-top:3px">${esc(it.note)}</div>
      ${it.suggested ? `
      <div class="row" style="margin-top:6px;flex-wrap:wrap;gap:6px;align-items:center">
        <span class="tiny"><b>Suggested action:</b> ${esc(it.suggested)}</span>
        <button class="btn sm" data-tb-step="${esc(st.mount)}" data-tb-step-i="${i}">Create Next Step</button>
      </div>` : ''}
    </div>`).join('')}`;
}

/* #69/#70 — the shared facts zone: the caller's own records, one section
   per heading, and every line that names a record is a door into it (§16).
   The links ride the existing doors — a customer opens its record, an
   opportunity opens the account's opportunity tab, a meeting or a step
   opens its timeline (the same promise calItem makes for a calendar
   row). */
function factsHtml(secs, cid){
  const refAttr = (ref) => !ref ? '' : ref.kind === 'customer'
    ? ` data-open="${esc(cid)}"`
    : ` data-cgo="${esc(cid)}" data-cgotab="${ref.kind === 'opp' ? 'opportunities' : 'timeline'}"`;
  return `
    <p class="tiny" style="margin:10px 0 0;font-weight:600">From your records</p>
    ${(secs || []).map((sec) => `
    <div style="border-top:1px solid var(--line);padding:8px 0 2px">
      <div class="tiny" style="font-weight:600;opacity:.75">${esc(sec.title)}</div>
      ${(sec.lines || []).map((l) => `
      <div class="tiny" style="margin-top:4px">
        ${l.ref ? `<a class="lk"${refAttr(l.ref)}>${esc(l.ref.label)}</a><span class="muted"> — ${esc(l.text)}</span>`
          : `<span class="muted">${esc(l.text)}</span>`}
      </div>`).join('')}
    </div>`).join('')}`;
}

/* #69 — the customer brief (§6, Test 2). Two zones, visibly apart: the
   facts are the caller's own records; the briefing and the attention list
   below are the model's organising of those facts — labelled as its own
   thing, never woven into the facts (§11: facts and suggestions stay
   separable). */
function briefHtml(st, res){
  return `${factsHtml(res.facts, res.customerId || '')}
    ${res.brief ? `
    <p class="tiny" style="margin:12px 0 0;font-weight:600">Briefing</p>
    <p style="margin:6px 0 0;font-size:13.5px;white-space:pre-wrap">${esc(res.brief)}</p>` : ''}
    ${res.attention ? `
    <p class="tiny" style="margin:10px 0 0;font-weight:600">Needs attention</p>
    <p style="margin:6px 0 0;font-size:13.5px;white-space:pre-wrap">${esc(res.attention)}</p>` : ''}`;
}

/* #70 — the opportunity analysis (§7, Test 3). The same two zones: the
   facts above, then the model's coaching in the insight panel's shape —
   moves with their why (§11: an attention item explains itself), gaps,
   and what to prepare. Every move stays a suggestion; nothing here
   writes, and the Create path is #72's to unify. */
function analyzeHtml(st, res){
  const KIND_L = { opportunity:'Opportunity', 'follow-up':'Follow-up', follow_up:'Follow-up', task:'Task', meeting:'Meeting',
    proposal:'Proposal', sa:'Engage SA', product:'Product', validate:'Validate', prepare:'Prepare' };
  const mv = Array.isArray(res.moves) ? res.moves : [];
  const rk = Array.isArray(res.risks) ? res.risks : [];
  return `${factsHtml(res.facts, res.customerId || '')}
    ${rk.length ? `
    <p class="tiny" style="margin:12px 0 0;font-weight:600">What the records flag — and why</p>
    ${rk.map((r) => `
    <div class="row" style="padding:8px 0;border-top:1px solid var(--line);align-items:flex-start;flex-wrap:wrap;gap:6px">
      <span class="tag t-warn" style="flex:0 0 auto">${esc(KIND_L[r.kind] || r.kind || 'Watch')}</span>
      <span style="flex:1;min-width:180px;font-size:13.5px">${esc(r.what)}</span>
      <span class="tiny muted" style="flex:1 1 100%">why: ${esc(r.why)}</span>
    </div>`).join('')}` : ''}
    <p class="tiny" style="margin:12px 0 0;font-weight:600">What the model suggests</p>
    ${mv.length ? mv.map((m) => `
    <div class="row" style="padding:8px 0;border-top:1px solid var(--line);align-items:flex-start;flex-wrap:wrap;gap:6px">
      <span class="tag t-blue" style="flex:0 0 auto">${esc(KIND_L[m.kind] || m.kind || 'Follow-up')}</span>
      <span style="flex:1;min-width:180px;font-size:13.5px">${esc(m.what)}</span>
      ${m.why ? `<span class="tiny muted" style="flex:1 1 100%">why: ${esc(m.why)}</span>` : ''}
    </div>`).join('') : `<p class="tiny muted" style="margin:6px 0 0">The model proposed no move from these facts.</p>`}
    ${(res.gaps || []).length ? `
    <p class="tiny" style="margin:10px 0 0;font-weight:600">Not followed up on / missing</p>
    ${(res.gaps || []).map((g) => `<div class="row" style="padding:4px 0;gap:6px">
      <span class="tag t-warn" style="flex:0 0 auto">Gap</span>
      <span class="tiny" style="flex:1">${esc(g)}</span></div>`).join('')}` : ''}
    ${(res.prepare || []).length ? `
    <p class="tiny" style="margin:10px 0 0;font-weight:600">Before the next meeting</p>
    ${(res.prepare || []).map((g) => `<div class="row" style="padding:4px 0;gap:6px">
      <span class="tag t-ok" style="flex:0 0 auto">Prepare</span>
      <span class="tiny" style="flex:1">${esc(g)}</span></div>`).join('')}` : ''}`;
}

/* #74 — the controlled product recommendation (§13, §27, Test 6). What the
   model picked from the Reference, rewritten in the Reference's own words:
   the one-liner under a name is read from the catalogue at render time,
   never from the model's paraphrase of it, and a Product SA shows only
   where the catalogue records one. Nothing here attaches a product to the
   opportunity or contacts anyone — the recommendation is a thing a person
   reads, and the choice stays theirs. */
function productsHtml(st, res){
  const ps = Array.isArray(res.products) ? res.products : [];
  return `<p class="tiny" style="margin:12px 0 0;font-weight:600">Products the Reference can support</p>
    ${ps.length ? ps.map((r) => {
      const ref = (D.products || []).find((x) => x.n === r.p);
      return `
      <div style="padding:8px 0;border-top:1px solid var(--line)">
        <div class="row" style="flex-wrap:wrap;gap:6px;align-items:center">
          <span class="tag t-blue">${esc(ref ? ref.cat : '')}</span>
          <b style="font-size:13.5px">${esc(r.p)}</b>
          ${r.sa ? `<span class="tag t-grey" title="The Product SA recorded in the Reference — nobody is contacted for you">SA · ${esc(r.sa)}</span>` : ''}
        </div>
        ${ref && ref.one ? `<div class="tiny muted" style="margin-top:4px">${esc(ref.one)}</div>` : ''}
        ${r.why ? `<div class="tiny" style="margin-top:4px">why: ${esc(r.why)}</div>` : ''}
        ${r.support ? `<div class="tiny muted" style="margin-top:2px">from your records: ${esc(r.support)}</div>` : ''}
      </div>`;
    }).join('') : `<p class="tiny muted" style="margin:6px 0 0">The model proposed no product the Reference holds.</p>`}
    <p class="tiny muted" style="margin-top:8px">Nothing is attached by this and no SA is contacted — the choice is yours.</p>`;
}

function taskBoxStateHtml(st){
  if (!st) return '';
  if (st.state === 'queued' || st.state === 'processing') return `
    <div class="row" style="flex-wrap:wrap;gap:8px"><span class="ai-mark model">AI</span>
      <span class="tag ${st.state === 'queued' ? 't-warn' : 't-violet'}">${st.state === 'queued' ? 'Queued' : 'Working'}</span>
      <span class="tiny muted">AI is working… You do not need to refresh the page.</span></div>`;
  if (st.state === 'completed') {
    const res = st.result || {};
    const text = String(res.answer || res.summary || '');
    const list = Array.isArray(res.items) ? res.items : null;
    const facts = Array.isArray(res.facts) ? res.facts : null;
    const moves = Array.isArray(res.moves) ? res.moves : null;
    const prods = Array.isArray(res.products) ? res.products : null;
    return `
    <div class="row"><span class="ai-mark model">AI</span><div class="spacer"></div>
      <span class="tiny muted">${esc(res.model || (aiState && aiState.model) || 'the model')} · done</span></div>
    ${moves ? analyzeHtml(st, res) : facts ? briefHtml(st, res) : prods ? productsHtml(st, res) : list ? focusWeekHtml(st, list) : text ? `<p style="margin:8px 0 0;font-size:13.5px;white-space:pre-wrap">${esc(text)}</p>` : ''}
    ${Array.isArray(res.citations) && res.citations.length ? `
      <div class="row" style="margin-top:8px;flex-wrap:wrap;gap:6px">${res.citations.map((x) =>
        `<span class="tag t-grey" title="The records this answer was built on">${esc(String(x))}</span>`).join('')}</div>` : ''}
    <div class="row" style="margin-top:8px"><button class="btn sm" data-tb-again="${esc(st.mount)}">Ask again</button></div>`;
  }
  if (st.state === 'failed') return `
    <div class="row"><span class="ai-mark model">AI</span><div class="spacer"></div>
      <span class="tag t-risk">Failed</span></div>
    <p class="tiny muted" style="margin:8px 0 0">${esc(st.error || 'The task failed.')} Nothing was invented in its place.</p>
    ${st.retryable ? `<div class="row" style="margin-top:8px"><button class="btn sm" data-tb-retry="${esc(st.mount)}">Retry</button></div>` : ''}`;
  return '';
}

function taskAskBox(mountId, label, hint, ask = {}, variants = []){
  if (!(aiState && aiState.configured && aiState.reachable)) return aiNote();
  const st = aiTasks.get(mountId);
  const body = taskBoxStateHtml(st && st.state !== 'idle' ? st : null);
  return `<div class="card" style="background:var(--violet-50);border-color:var(--violet-line)" id="${mountId}">
    ${body || `
    <div class="row"><span class="ai-mark model">AI</span><div class="spacer"></div>
      <span class="tiny muted">${esc(aiState.model)}</span></div>
    <div class="row" style="margin-top:8px;flex-wrap:wrap;gap:8px">
      <span class="tiny muted">${esc(hint || 'Only the records on this screen are sent. Every answer names the records it leaned on.')}</span>
      <div class="spacer"></div>
      <button class="btn sm" data-tb="${esc(mountId)}" data-tb-act="${esc(ask.action || '')}"
        data-tb-target="${esc(ask.targetId || '')}" data-tb-question="${esc(ask.question || '')}">${esc(label)}</button>
    </div>
    ${variants.length ? `
    <div class="row" style="margin-top:8px;flex-wrap:wrap;gap:6px">
      <span class="tiny muted">or focus it:</span>
      ${variants.map((v) => `<button class="btn sm" data-tb-var="${esc(mountId)}" data-tb-act="${esc(ask.action || '')}"
        data-tb-target="${esc(ask.targetId || '')}" data-tb-var-q="${esc(v.question || '')}">${esc(v.label)}</button>`).join('')}
    </div>` : ''}`}
  </div>`;
}

function paintTaskBox(mountId){
  const host = document.getElementById(mountId);
  if (!host) return;   /* navigated away — the registry keeps the state, the box will redraw when its screen comes back */
  const st = aiTasks.get(mountId);
  if (!st) return;
  st.mount = mountId;
  const card = host.closest('.card') || host;
  card.innerHTML = taskBoxStateHtml(st) || '';
}

async function runTaskAsk(mountId, ask){
  const running = aiTasks.get(mountId);
  if (running && (running.state === 'queued' || running.state === 'processing')) {
    /* Test 12: a second press while one runs re-shows the state and asks
       nothing — the server's dedupe is the backstop, not the plan. */
    paintTaskBox(mountId);
    return;
  }
  aiTasks.set(mountId, { id: '', state: 'queued', result: null, error: '', retryable: false, at: Date.now(), mount: mountId, ask });
  paintTaskBox(mountId);
  try {
    const r = await fetch('/api/ai/copilot', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(ask),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.error || 'The ask was refused.');
    if (j.kind === 'rule') {
      aiTasks.set(mountId, { id: '', state: 'completed',
        result: { answer: j.answer, citations: j.citations }, at: Date.now(), mount: mountId, ask });
      paintTaskBox(mountId);
      return;
    }
    if (j.kind !== 'task' || !j.task) throw new Error('The ask did not become a task.');
    aiTasks.set(mountId, { id: j.task.id, state: j.task.state || 'queued',
      result: null, error: '', retryable: false, at: Date.now(), mount: mountId, ask });
    paintTaskBox(mountId);
    pollTask(mountId);
  } catch (e) {
    aiTasks.set(mountId, { id: '', state: 'failed', result: null,
      error: e.message || 'The ask failed.', retryable: true, at: Date.now(), mount: mountId, ask });
    paintTaskBox(mountId);
  }
}

async function retryTaskAsk(mountId){
  const st = aiTasks.get(mountId);
  if (!st || !st.id) return;
  try {
    const r = await fetch('/api/ai/tasks/' + encodeURIComponent(st.id) + '/retry', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' }, body: '{}',
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.error || 'The retry was refused.');
    st.state = 'queued'; st.error = ''; st.result = null; st.retryable = false;
    aiTasks.set(mountId, st);
    paintTaskBox(mountId);
    pollTask(mountId);
  } catch (e) {
    st.error = e.message || 'The retry failed.'; st.retryable = true;
    aiTasks.set(mountId, st);
    paintTaskBox(mountId);
  }
}

/* #68/#72 — the one confirm sheet every AI-suggested next step goes through
   (§26: Understand → Suggest → Human Confirm → Execute). focus-week's
   Create Next Step and the insights panel's Create button both land here;
   the sheet pre-fills the step text from the suggestion and the account
   team from the customer, and the Create button walks the exact path a
   hand-typed step walks — the same fields, the same tracker check, the
   same timeline entry, the same audit line, syncSave and the server's
   integrity rules and all — so a step created from a suggestion and one
   typed by hand are indistinguishable to the book. Only the audit note
   remembers where the suggestion came from. */
function confirmStepSheet(c, pre, source, cb){
  if (!can('log')){ toast('Your role cannot record work.'); return; }
  const veil = document.getElementById('capVeil');
  veil.classList.add('on');
  document.querySelector('#capVeil .sheet-h').innerHTML = `
    <strong style="font-size:14.5px">Create a next step</strong>
    <span class="tiny muted">${esc(c.name)}</span><div class="spacer"></div>
    <button class="btn sm" id="capClose4">Close</button>`;
  document.getElementById('capClose4').onclick = closeCapture;
  const me = (D.me && D.me.name) || '';
  document.getElementById('capBody').innerHTML = `
    <p class="tiny muted" style="margin-top:0">Suggested by the model. Nothing is written until you create it,
      and amounts and probability are never written this way at all.</p>
    <div class="row" style="margin-bottom:10px;flex-wrap:wrap;gap:6px"><span class="tiny" style="width:120px">Next step</span>
      <input id="scText" style="${FLD}" value="${esc(pre.t || '')}" maxlength="140"></div>
    <div class="row" style="margin-bottom:10px;flex-wrap:wrap;gap:6px"><span class="tiny" style="width:120px">Customer</span>
      <input value="${esc(c.name)}" disabled style="${FLD};opacity:.7"></div>
    <div class="row" style="margin-bottom:10px;flex-wrap:wrap;gap:6px"><span class="tiny" style="width:120px">Tracked by</span>
      <input id="scTrack" value="${esc((pre.track || c.owner || c.sa || '').trim())}" maxlength="80"
        placeholder="Primary BD or SA on the account" style="${FLD}">
      <span class="tiny muted" style="flex-basis:100%">The tracker must be the customer's Primary BD or Primary SA — the server checks it on save.</span></div>
    <div class="row" style="margin-bottom:10px;flex-wrap:wrap;gap:6px"><span class="tiny" style="width:120px">Execution owner</span>
      <input id="scExec" value="${esc(pre.exec || me)}" maxlength="80" style="${FLD}"></div>
    <div class="row" style="margin-bottom:10px;flex-wrap:wrap;gap:6px"><span class="tiny" style="width:120px">Due (optional)</span>
      <input id="scDue" type="date" value="${esc(pre.due || '')}" style="${FLD}"></div>
    <div class="sheet-f" style="margin:var(--s4) calc(-1 * var(--s5)) calc(-1 * var(--s5))">
      <button class="btn" id="scCancel">Cancel</button>
      <div class="spacer"></div>
      <button class="btn pri" id="scCreate">Create step</button>
    </div>`;
  document.getElementById('scCancel').onclick = closeCapture;
  const textEl = document.getElementById('scText');
  const create = document.getElementById('scCreate');
  const sync = () => { create.disabled = !textEl.value.trim(); create.style.opacity = textEl.value.trim() ? '' : '.45'; };
  textEl.oninput = sync; sync();
  create.onclick = () => {
    const t = textEl.value.trim();
    if (!t) return;
    const exec = document.getElementById('scExec').value.trim() || me;
    const track = document.getElementById('scTrack').value.trim();
    /* The same gate a hand-typed step meets: the tracker is the account's
       Primary BD or SA, checked here first and by the server on save. */
    if (!trackOnCustomer(c, track)){
      toast('The Tracker must be this account\u2019s Primary BD (' + (c.owner || 'unset')
        + ') or Primary SA (' + (c.sa || 'unset') + ').');
      return;
    }
    const due = document.getElementById('scDue').value || '';
    (D.steps = D.steps || []).push({
      id: 's' + Date.now(), c: c.id, t,
      exec, track,
      due, w: '', from: 'us', p: 'p1',
      ...(pre.kind ? { kind: pre.kind } : {}),
      done:'', doneBy:'', doneNote:'' });
    /* The same memory a hand-typed step leaves (Scenario 3): the promise
       itself belongs in the account's timeline, not only in the open list. */
    (c.timeline = c.timeline || []).unshift({ d: todayISO(), k: 'step', t,
      x: exec + (track && track !== exec ? ' · tracked by ' + track : '')
         + (due ? ' · due ' + due : '') });
    /* The same audit line a hand-typed step writes — only the note says
       where the suggestion came from (§26: the user confirmed, the app
       executed through the normal workflow). */
    audit('data', 'Action added', t + ' - ' + c.name, '-',
      exec + ' (tracked by ' + track + ')' + (source ? ' — ' + source : ''));
    closeCapture(); render(); syncSave();
    if (cb) cb();
    toast('Next step created on ' + c.name + '.');
  };
}

function openStepConfirm(mountId, i){
  const st = aiTasks.get(mountId);
  const item = st && st.result && Array.isArray(st.result.items) ? st.result.items[i] : null;
  if (!item) return;
  const c = cust(item.customerId);
  if (!c){ toast('That customer is no longer in the book.'); return; }
  confirmStepSheet(c, { t: item.suggested || '' }, 'confirmed from a copilot suggestion');
}

async function pollTask(mountId){
  const st = aiTasks.get(mountId);
  if (!st || !st.id) return;  try {
    const r = await fetch('/api/ai/tasks?since=0', { credentials: 'same-origin' });
    const j = await r.json().catch(() => ({}));
    const t = (j.tasks || []).find((x) => x.id === st.id);
    if (t && (t.state === 'completed' || t.state === 'failed')) {
      st.state = t.state; st.result = t.result || null;
      st.error = t.error || ''; st.retryable = !!t.retryable;
      aiTasks.set(mountId, st);
      paintTaskBox(mountId);
      return;   /* terminal — the chain stops here */
    }
    if (t && t.state !== st.state) {
      st.state = t.state; aiTasks.set(mountId, st); paintTaskBox(mountId);
    }
  } catch { /* a lost poll is not a lost task — the next tick tries again */ }
  setTimeout(() => { pollTask(mountId); }, 1200);
}

/* ===================================================================== #80
   The lightweight AI Task Center (§23). It answers one question and does not
   try to be a task-management system: "Is my AI request still running, and
   is the result ready?" Three zones — Active, Completed, Failed — fed by the
   same /api/ai/tasks the boxes poll, so the center never claims a state the
   server does not hold. The full result stays where it was asked for: a
   completed row here says it is ready and when, and #66's cache hands it
   back the moment the same ask is made from the same screen, at no cost.
   ===================================================================== */
let aiTaskList = [];   /* the last pull of this session's tasks, newest first */
let aiTasksTimer = null;

async function fetchAiTasks(){
  try {
    const r = await fetch('/api/ai/tasks?since=0', { credentials: 'same-origin' });
    if (!r.ok) return;
    const j = await r.json();
    if (!j || !Array.isArray(j.tasks)) return;
    aiTaskList = j.tasks;
  } catch { /* the server is not answering; the last list still stands */ }
  renderNav();   /* the badge follows the pull, not the page redraw */
  if (view.s === 'aitasks') drawAiTasksScreen();
}

function ensureAiTasksPolling(){
  if (aiTasksTimer) clearInterval(aiTasksTimer);
  aiTasksTimer = setInterval(() => {
    if (view.s !== 'aitasks'){ clearInterval(aiTasksTimer); aiTasksTimer = null; return; }
    fetchAiTasks();
  }, 2500);
}

/* What each action is called when a person reads it. The task rows carry the
   machine's names; the center carries the person's. */
const AI_ACTION_LABELS = {
  'answer': 'Copilot answer',
  'focus-week': 'This week\'s focus',
  'brief-customer': 'Customer briefing',
  'analyze-opp': 'Opportunity analysis',
  'suggest-products': 'Product suggestions',
};

/* The record an ask was about, read from the book the ask was scoped to. */
function aiTaskTargetLabel(t){
  const a = String(t.action || '');
  const id = String(t.targetId || '');
  if (a === 'brief-customer'){ const c = cust(id); return c ? c.name : ''; }
  if (a === 'analyze-opp' || a === 'suggest-products'){
    const o = opp(id);
    if (!o) return '';
    const c = cust(o.c);
    return o.t + (c ? ' · ' + c.name : '');
  }
  if (a === 'answer') return String(t.question || '').slice(0, 90);
  return '';
}

function screenAiTasks(){
  return `
  <div class="phead">
    <div><h1>AI Tasks</h1>
      <p class="sub">Is my AI request still running, and is the result ready? — nothing here is a queue to manage</p></div>
  </div>
  <div id="aiTasksBody">${aiTasksRowsHtml()}</div>`;
}

function aiTasksRowsHtml(){
  const list = aiTaskList;
  if (!list.length) return `
    <div class="card"><div class="empty">Nothing is running and nothing has finished.
      Ask from any customer, any opportunity or the palette (⌘K) — every ask appears here while it works.</div></div>`;
  const active = list.filter(t => t.state === 'queued' || t.state === 'processing');
  const done = list.filter(t => t.state === 'completed');
  const failed = list.filter(t => t.state === 'failed');
  const label = (t) => AI_ACTION_LABELS[t.action] || t.action || 'AI task';
  const zone = (title, rows, hint) => rows.length ? `
    <div class="card" style="margin-bottom:var(--s4)">
      <div class="row" style="margin-bottom:var(--s2)"><h3 style="margin:0">${title}</h3>
        <div class="spacer"></div><span class="tiny muted">${hint}</span></div>
      ${rows.map((t) => {
        const target = aiTaskTargetLabel(t);
        const when = t.doneAt ? fmtDay(String(t.doneAt).slice(0, 10)) + ' ' + String(t.doneAt).slice(11, 16) : '';
        if (t.state === 'queued' || t.state === 'processing') return `
          <div class="row" style="padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:6px">
            <span class="ai-mark model">AI</span>
            <b style="font-size:13px">${esc(label(t))}</b>
            ${target ? `<span class="tiny" style="flex:1;min-width:140px">${esc(target)}</span>` : '<span style="flex:1"></span>'}
            <span class="tag ${t.state === 'queued' ? 't-warn' : 't-violet'}">${t.state === 'queued' ? 'Queued' : 'Working'}</span>
          </div>`;
        if (t.state === 'completed'){
          const res = (t.result && typeof t.result === 'object') ? t.result : {};
          /* The counts are built outside the string: a plural written with
             parentheses inside a literal ("move(s)") survives the dead-code
             scan as a call it is not. */
          const nMv = Array.isArray(res.moves) ? res.moves.length : 0;
          const nPr = Array.isArray(res.products) ? res.products.length : 0;
          const bit = String(res.answer || res.summary || res.brief
            || (nMv ? nMv + ' suggested move' + (nMv === 1 ? '' : 's') : '')
            || (nPr ? nPr + ' product suggestion' + (nPr === 1 ? '' : 's') : '')
            || 'The result is ready.').slice(0, 140);
          return `
          <div class="row" style="padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:6px">
            <b style="font-size:13px">${esc(label(t))}</b>
            ${target ? `<span class="tiny" style="flex:1;min-width:140px">${esc(target)}</span>` : '<span style="flex:1"></span>'}
            <span class="tag t-ok">done ${esc(when)}</span>
          </div>
          <div class="tiny muted" style="padding:0 0 9px;border-bottom:1px solid var(--line)">${esc(bit)}
            — the full result is where you asked for it; asking again from the same screen returns it at once, at no cost.</div>`;
        }
        return `
        <div style="padding:9px 0;border-bottom:1px solid var(--line)">
          <div class="row" style="flex-wrap:wrap;gap:6px">
            <b style="font-size:13px">${esc(label(t))}</b>
            ${target ? `<span class="tiny" style="flex:1;min-width:140px">${esc(target)}</span>` : '<span style="flex:1"></span>'}
            <span class="tag t-risk">Failed</span>
          </div>
          <div class="tiny muted" style="margin-top:4px">${esc(t.error || 'The task failed.')} Nothing was invented in its place.</div>
          ${t.retryable ? `<button class="btn sm" data-act="aitry" data-id="${esc(t.id)}" style="margin-top:6px">Retry</button>` : ''}
        </div>`;
      }).join('')}
    </div>` : '';
  return zone('Running', active, 'You do not need to refresh the page.')
    + zone('Failed', failed, '')
    + zone('Finished', done, '')
    || '<div class="card"><div class="empty">No tasks.</div></div>';
}

async function retryAiTask(id){
  try {
    const r = await fetch('/api/ai/tasks/' + encodeURIComponent(id) + '/retry', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' }, body: '{}',
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.error || 'The retry was refused.');
    toast('The task is queued again.');
  } catch (e) { toast(e.message || 'The retry failed.'); }
  fetchAiTasks();
}

/* What a rule can say about an opportunity, without a model. Every line here
   is recomputed from the records, which is why it can be trusted. */
function oppFacts(o){
  const c = cust(o.c) || { name: '?', contacts: [] };
  const meets = D.interactions.filter(m => m.c === o.c).sort((a, b) => b.d.localeCompare(a.d));
  const last = meets[0] || null;
  const daysSince = last ? Math.max(0, dayGap(last.d)) : null;
  const steps = (D.steps || []).filter(s => s.c === o.c && !stepIsDone(s));
  const overdue = steps.filter(stepOverdue);
  const contacts = (c.contacts || []);
  const withUs = contacts.filter(p => p.s === 'With us').length;
  const against = contacts.filter(p => p.s === 'Against us').length;
  const lines = [
    { t: `${oppAge(o)} day${oppAge(o) === 1 ? '' : 's'} in ${o.stage}`, tag: 't-warn' },
    daysSince === null ? { t: 'No meeting has ever been logged', tag: 't-risk' }
      : { t: daysSince === 0 ? 'Met today' : `Last contact ${daysSince} day${daysSince === 1 ? '' : 's'} ago (${last.d})`, tag: daysSince > 21 ? 't-risk' : 't-grey' },
    { t: overdue.length ? `${overdue.length} open action${overdue.length === 1 ? '' : 's'} overdue` : 'No overdue actions', tag: overdue.length ? 't-risk' : 't-ok' },
    { t: `${withUs} with us · ${against} against us`, tag: against > withUs ? 't-risk' : 't-grey' },
    { t: `${money(o.v)} · ${o.p}%`, tag: 't-grey' }
  ];
  const brief = [
    `Opportunity: ${o.t}`,
    `Customer: ${c.name}`,
    `Stage: ${o.stage}, ${oppAge(o)} days in it`,
    `Value: RM ${o.v}, probability ${o.p}%`,
    last ? `Last meeting: ${last.d} (${daysSince} days ago) — ${last.t}` : 'No meeting logged',
    last && last.out ? `Meeting outcome: ${last.out}` : '',
    steps.length ? `Open actions: ${steps.map(s => `${s.t} (${s.from === 'us' ? 'ours' : 'theirs'}, due ${s.due || 'no date'})`).join('; ')}` : 'No open actions',
    contacts.length ? `People: ${contacts.map(p => `${p.n} — ${p.t} — ${p.s}`).join('; ')}` : 'No contacts recorded',
    (c.pains || []).length ? `Known problems: ${c.pains.join('; ')}` : ''
  ].filter(Boolean).join('\n');
  return { last, daysSince, steps, overdue, withUs, against, lines, brief };
}

function factRows(lines){
  return lines.map(l => `<div class="row" style="padding:10px var(--s4);border-bottom:1px solid var(--line)">
      <span style="flex:1;font-size:13px">${esc(l.t)}</span><span class="tag ${l.tag}">Rule</span></div>`).join('');
}

/* Rows are proposed from the meeting note by the same rules Capture uses.
   Amount and probability stay locked — a model never touches money. Stage is
   only ever suggested by a model, and only applied if it names one of ours. */
function openDiff(id){
  const o = opp(id), c = cust(o.c);
  const veil = document.getElementById('capVeil');
  veil.classList.add('on');
  document.querySelector('#capVeil .sheet-h').innerHTML = `
    <strong style="font-size:14.5px">Update from a meeting</strong>
    <span class="tiny muted">${esc(o.t)}</span><div class="spacer"></div>
    <button class="btn sm" id="capClose3">Close</button>`;
  document.getElementById('capClose3').onclick = closeCapture;

  const meets = D.interactions.filter(m => m.c === o.c).sort((a, b) => b.d.localeCompare(a.d));
  const m = meets[0];
  if (!m){
    document.getElementById('capBody').innerHTML = `
      <div class="empty">Nothing to compare against — no meeting has been logged on
        ${esc(c.name)} yet. Log one and this screen reads it.</div>`;
    return;
  }

  const note = [m.sum, m.out].filter(Boolean).join('. ');
  const proposed = parseCapture(note, o.c).filter(ch => ch.write === 'step');

  const rows = [
    ...proposed.map(ch => ({
      f: 'Next step', old: '—', nw: ch.text + (ch.due ? ' · due ' + ch.due : ''),
      why: 'Read from the ' + m.d + ' meeting note.', ok: true, write: ch
    })),
    { f: 'Probability', old: o.p + '%', nw: '', why: 'Money and probability are never written by a rule or a model. Edit them yourself.', locked: true },
    { f: 'Amount', old: money(o.v), nw: '', why: 'Never writable by a rule or a model.', locked: true }
  ];

  let stageRow = null;

  const draw = () => {
    const keep = rows.filter(r => r.ok && !r.locked).length + (stageRow && stageRow.ok ? 1 : 0);
    document.getElementById('capBody').innerHTML = `
      <p class="tiny muted" style="margin-top:0">Proposed from the <b>${esc(m.d)}</b> meeting on
        ${esc(c.name)} · ${esc(m.t)}. Nothing is written until you apply.</p>
      <div id="dfStage"></div>
      <table class="diff">
        <tr><th>Field</th><th>From</th><th>To</th><th style="width:40px"></th></tr>
        ${rows.map((r, i) => `<tr>
          <td class="k">${esc(r.f)}</td>
          <td class="old">${esc(r.old)}</td>
          <td>${r.locked ? '<span class="tiny muted">locked — never automatic</span>'
              : `<span class="new">${esc(r.nw)}</span><div class="why">${esc(r.why)}</div>`}</td>
          <td>${r.locked ? '' : `<button class="mini ${r.ok ? 'on' : ''}" data-tog="${i}">${r.ok ? 'Keep' : 'Skip'}</button>`}</td>
        </tr>`).join('')}
        ${stageRow ? `<tr>
          <td class="k">Stage</td><td class="old">${esc(o.stage)}</td>
          <td><span class="new">${esc(stageRow.nw)}</span><div class="why">${esc(stageRow.why)}</div></td>
          <td><button class="mini ${stageRow.ok ? 'on' : ''}" data-tog="stage">${stageRow.ok ? 'Keep' : 'Skip'}</button></td>
        </tr>` : ''}
      </table>
      ${rows.filter(r => !r.locked).length === 0 && !stageRow
        ? '<div class="empty">That meeting note did not contain anything a rule could turn into a change.</div>' : ''}
      <div class="sheet-f" style="margin:var(--s4) calc(-1 * var(--s5)) calc(-1 * var(--s5))">
        <button class="btn" id="dfCancel">Cancel</button>
        <div class="spacer"></div>
        <button class="btn pri" id="dfApply"${keep ? '' : ' disabled style="opacity:.45"'}>Apply ${keep} change${keep === 1 ? '' : 's'}</button>
      </div>`;

    document.getElementById('dfCancel').onclick = closeCapture;
    document.getElementById('dfApply').onclick = () => {
      const chosen = rows.filter(r => r.ok && !r.locked);
      let n = 0;
      chosen.forEach(r => {
        if (r.write && r.write.write === 'step'){
          (D.steps = D.steps || []).push({
            id: 's' + Date.now() + n, c: o.c, t: r.write.text, o: r.write.owner || ((D.me && D.me.name) || 'Teh Bin Shun'),
            due: r.write.due || '', w: r.write.w || '', from: r.write.from || 'us', p: 'p1'
          });
          n++;
        }
      });
      if (stageRow && stageRow.ok && stageRow.stage && stageRow.stage !== o.stage){
        audit('opp', 'Stage changed', o.t, o.stage, stageRow.stage);
        o.stage = stageRow.stage;
        n++;
      }
      if (!n){ closeCapture(); return; }
      /* "change(s)" reads fine and breaks a gate: `verify:dead` looks for
         `name(` in the code it has stripped of strings, and a parenthesised
         plural in prose is indistinguishable from a call to a function that
         does not exist. The gate is right to refuse it — so write it out. */
      audit('data', 'Applied a meeting update', o.t, '—',
        n + (n === 1 ? ' change' : ' changes'));
      closeCapture(); render(); syncSave();
      toast(n + ' change' + (n === 1 ? '' : 's') + ' applied to ' + o.t + '.');
    };
    document.querySelectorAll('[data-tog]').forEach(b => b.onclick = () => {
      const k = b.dataset.tog;
      if (k === 'stage'){ stageRow.ok = !stageRow.ok; } else { rows[+k].ok = !rows[+k].ok; }
      draw();
    });
    wireStage();
  };

  /* Stage genuinely needs judgement, so it only ever comes from a model — and
     only counts if the model names one of our own stages. */
  function wireStage(){
    if (c.confidential){
      const host = document.getElementById('dfStage');
      if (host && !host.dataset.done){
        host.dataset.done = '1';
        host.innerHTML = `<div class="note" style="margin:0 var(--s4) var(--s3)"><strong>Confidential.</strong>
          ${esc(c.name)} is never sent to a model, so no stage is suggested.</div>`;
      }
      return;
    }
    const host = document.getElementById('dfStage');
    if (!host || stageRow) return;
    host.innerHTML = (aiState && aiState.configured && aiState.reachable)
      ? `<div class="row" style="margin:0 var(--s4) var(--s3)">
           <span class="ai-mark model">AI</span>
           <span class="tiny muted" style="margin-left:8px">A stage change is a judgement — only a model proposes one.</span>
           <div class="spacer"></div>
           <button class="btn sm" id="dfStageGo">Suggest a stage</button>
         </div>`
      : (aiNote() || '');
    const b = document.getElementById('dfStageGo');
    if (b) b.onclick = async () => {
      host.innerHTML = `<div class="row" style="margin:0 var(--s4) var(--s3)"><span class="ai-mark model">AI</span>
        <span class="tiny muted" style="margin-left:8px">Asking…</span></div>`;
      try {
        const text = await askModel(
          `Given this meeting outcome, which stage should the opportunity move to?\n\n` +
          `Stages, in order: ${D.stages.join(' | ')}\nCurrent stage: ${o.stage}\n\n` +
          `Meeting ${m.d}:\n${note}\n\n` +
          `Answer with the stage name and nothing else.`
        );
        const hit = D.stages.find(s => s.toLowerCase() === text.trim().toLowerCase())
          || D.stages.find(s => text.toLowerCase().includes(s.toLowerCase()));
        if (hit){
          stageRow = { f: 'Stage', old: o.stage, nw: hit, stage: hit, why: 'Suggested by the model, from the meeting note.', ok: true };
        } else {
          host.innerHTML = `<div class="note" style="margin:0 var(--s4) var(--s3)">
            <strong>The model did not name one of our stages.</strong> It said:
            “${esc(text.slice(0, 200))}”. Nothing was applied — change the stage yourself if you agree.</div>`;
          return;
        }
      } catch (e) {
        host.innerHTML = `<div class="note" style="margin:0 var(--s4) var(--s3)">
          <strong>No stage was suggested.</strong> ${esc(e.message || 'The model could not be reached.')}
          Nothing was invented in its place.</div>`;
        return;
      }
      draw();
    };
  }

  draw();
}

/* ============================================================================ */
/*  New customer — filled from public sources, confirmed by a person.          */
/*  The valuable half is not the logo; it is "what they do" and "what they     */
/*  run", because those change what you sell. Every field carries a source,    */
/*  every field can be declined, and nothing is written until Create.          */
/* ============================================================================ */
/* ============================================================================ */
/*  New customer — filled from public sources, confirmed by a person.          */
/*                                                                             */
/*  This used to be a constant: a made-up logistics company with a made-up     */
/*  headcount, shown as if it had just been fetched. It never made a request.  */
/*  Now it does.                                                               */
/*                                                                             */
/*  The server searches Wikidata for the real organisation, takes the website  */
/*  that organisation publishes, then reads that website's own title,          */
/*  description, logo and social links. Industry, HQ, headcount and founding   */
/*  year come from the public record — never from a guess. Anything the        */
/*  sources do not publish is reported as not found; we do not fill gaps.      */
/*                                                                             */
/*  Every field carries its source, every field can be declined, and nothing   */
/*  is written until Create. Confidential customers skip the lookup entirely:  */
/*  then nothing about them ever leaves the server.                            */
/* ============================================================================ */

let ncState = { stage:'ask', q:'', off:new Set(), result:null, error:null, choices:null };

function openNewCustomer(){
  ncState = { stage:'ask', q:'', off:new Set(), result:null, error:null, choices:null };
  document.querySelector('#capVeil .sheet-h').innerHTML = `
    <strong style="font-size:14.5px">New customer</strong>
    <span class="tiny muted">looked up from public sources — you confirm every field</span>
    <div class="spacer"></div>
    <button class="btn sm" id="capClose5">Close</button>`;
  document.getElementById('capClose5').onclick = closeCapture;
  document.getElementById('capVeil').classList.add('on');
  drawNewCustomer();
}

/* The name we would write down: the public record's name first, then whatever
   their own page calls itself, then the domain, then what was typed. */
function ncName(){
  const r = ncState.result;
  if (r){
    if (r.matched && r.matched.name) return r.matched.name;
    if (r.site && r.site.title) return r.site.title.split(/\s*[|–—]\s*/)[0].trim() || r.domain;
    return r.domain;
  }
  return (ncState.q || '').trim();
}

/* Only fields that were actually found. A field we could not source is not
   offered at all — an empty field invites you to fill it, a wrong one invites
   you to repeat it in front of the customer. */
function ncFields(){
  const r = ncState.result;
  if (!r) return [];
  const out = [];
  if (r.site && r.site.intro)
    out.push({ k:'What they do', v:r.site.intro, src:r.domain, note:null });
  if (r.facts.industry)
    out.push({ k:'Industry', v:r.facts.industry.value, src:r.facts.industry.source, note:null });
  if (r.facts.hq)
    out.push({ k:'HQ', v:r.facts.hq.value, src:r.facts.hq.source, note:null });
  if (r.facts.employees)
    out.push({ k:'Size', v:r.facts.employees.value.toLocaleString() + (r.facts.employees.value === 1 ? ' person' : ' people'),
      src:r.facts.employees.source + (r.facts.employees.asOf ? ' · ' + r.facts.employees.asOf : ''), note:null });
  if (r.facts.founded)
    out.push({ k:'Founded', v:r.facts.founded.value, src:r.facts.founded.source, note:null });
  return out;
}

/* What we looked for and did not find, said out loud. "Not published" is a
   fact about the company; silence is a gap the reader fills themselves. */
function ncMissing(){
  const r = ncState.result;
  if (!r) return [];
  const miss = [];
  if (!r.facts.employees) miss.push('headcount');
  if (!r.facts.hq) miss.push('HQ');
  if (!r.facts.industry) miss.push('industry');
  if (!(r.site && r.site.intro)) miss.push('a description from their own site');
  if (!r.socials.length) miss.push('official social profiles');
  return miss;
}

/* Two steps, because a name can mean several companies. Step one asks the
   public record WHO it could mean and shows the shortlist; step two reads the
   one company the person picked. A lookup that guessed on their behalf is how
   a wrong customer gets created with a straight face. */
async function runLookup(){
  const q = (ncState.q || '').trim();
  if (!q){ toast('Type a company name or their website.'); return; }
  ncState.stage = 'looking';
  ncState.error = null;
  drawNewCustomer();

  let ch = null;
  try {
    const res = await fetch('/api/company-lookup/choices?q=' + encodeURIComponent(q), { credentials:'same-origin' });
    ch = await res.json();
  } catch { ch = null; }
  const list = (ch && ch.ok && Array.isArray(ch.choices)) ? ch.choices : [];

  /* Several organisations share the name — the choice is the person's to make. */
  if (list.length > 1){
    ncState.choices = list;
    ncState.stage = 'choose';
    drawNewCustomer();
    return;
  }
  /* One candidate (or a bare website, which needs no candidate): read it. */
  return runPinned(list.length === 1 ? list[0].id : null);
}

async function runPinned(id){
  ncState.stage = 'looking';
  ncState.error = null;
  drawNewCustomer();

  const url = '/api/company-lookup?q=' + encodeURIComponent((ncState.q || '').trim())
    + (id ? '&id=' + encodeURIComponent(id) : '');
  let j = null;
  try {
    const res = await fetch(url, { credentials:'same-origin' });
    j = await res.json();
  } catch {
    j = { ok:false, code:'unreachable',
      error:'Could not reach the server.',
      hint:'The lookup runs on the server. Check the connection and try again.' };
  }
  if (!j || !j.ok){
    ncState.stage = 'error';
    ncState.error = j || { ok:false, code:'unreachable', error:'The lookup failed.', hint:null };
    drawNewCustomer();
    return;
  }
  ncState.stage = 'found';
  ncState.result = j;
  ncState.off = new Set();
  drawNewCustomer();
}

function createCustomer(enriched){
  const name = ncName() || 'New customer';
  if (D.customers.some(x => x.name.toLowerCase() === name.toLowerCase())){
    toast(name + ' is already in the workspace.');
    return;
  }
  /* "Create without a lookup" has to mean it. The looked-up result used to
     still be read here, so a confidential customer created that way came out
     with the domain, the headcount and the industry the lookup had just
     fetched — the one path that promises nothing is taken is the path that
     must not take anything. */
  const r = enriched ? ncState.result : null;
  const f = (k) => (r && (ncFields().find(x => x.k === k && !ncState.off.has(k)) || {}).v) || '';
  const headcount = (r && r.facts.employees && !ncState.off.has('Size')) ? r.facts.employees.value : 0;
  const logoUrl = (r && r.site && (r.site.ogImage || r.site.logo)) || '';

  const c = {
    id: 'c' + Date.now(),
    name,
    industry: f('Industry') || 'Unclassified',
    hq: f('HQ') || '',
    stance: 'Undecided',
    health: 'Watch',
    owner: (D.me && D.me.name) || 'Teh Bin Shun',
    since: todayISO().slice(0, 7),
    site: (r && r.domain) || '',
    logo: logoUrl,
    people: headcount,
    brief: enriched ? (f('What they do') || 'No description yet.') : 'No description yet.',
    pains: [], contacts: [], apps: [], opps: [],
    /* Nobody is on this customer yet. Membership is a decision somebody makes
       — Admin, or whoever owns the account — not a list we copy in. */
    team: [],
    demo: false,
    unverified: !!enriched,
    /* Dropped here as well as on display: the server no longer offers them,
       but a record written yesterday still can, and one place that says "we do
       not keep these" is one place too few. */
    links: enriched && r ? (r.socials || [])
      .filter(s => !DROPPED_SOCIALS.includes(s.label))
      .map(s => ({ n:s.label, u:s.url, src:r.domain })) : [],
    sources: enriched && r ? (r.sources || []) : [],
    timeline: []   /* the timeline is the story with the customer; record-keeping lives in the audit */
  };
  D.customers.push(c);
  audit('data', 'Customer created', c.name, '-', enriched ? 'from public sources' : 'no lookup');
  closeCapture();
  view = { s: 'customer', id: c.id, tab: 'brief', cview: 'board' };
  render();
  toast(enriched ? 'Customer created · ' + ncFields().length + ' fields marked Unverified.' : 'Customer created — no lookup, nothing left the server.');
  /* The two things a fresh account needs, without anybody having to ask:
     who they are (the model drafts the company brief from the record) and
     what is happening around them (news from their name and domain). They
     run one after the other — both share a busy flag — land on this tab with
     their own loading states, and the buttons stay for a re-run. Confidential
     customers and a dead endpoint ask for nothing. */
  if (aiReady(c)) aiCompanyBrief(c.id).then(() => aiCollectNews(c.id));
}

/* --------------------------------------------------------- toast */
/* One argument, and that is a rule rather than a taste.
   A second argument used to draw a button — "Undo", on two screens — that was
   never wired to anything. This function builds an element, shows it and drops
   it four seconds later; nothing ever attached a handler, so the button sat
   there looking like an offer and did nothing when pressed. A control that
   cannot be acted on is worse than no control at all: the person believes the
   thing they are about to lose is recoverable, and it is not.
   So the label is gone, not disabled. Real undo, when it is built, arrives
   with its handler attached — and `verify:dead` fails the build if a call
   ever hands this function an action again. */
function toast(msg, mascotId){
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;' +
    'padding:10px 16px;border-radius:10px;font-size:13px;z-index:99;box-shadow:var(--e3);display:flex;gap:14px;align-items:center';
  t.innerHTML = (mascotId && corgiOn()
      ? '<img class="mascot m-proud" src="' + CORGI[mascotId] + '" alt="" aria-hidden="true">' : '')
    + `<span>${esc(msg)}</span>`;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4200);
}

/* ============================================================================ */
document.addEventListener('click', async (e) => {
  /* a click anywhere outside the menu closes it; inside, the start buttons work */
  if (!e.target.closest('#tMenu') && !e.target.closest('#tourOpen')){
    document.getElementById('tMenu').classList.remove('on');
  }
  const tstart = e.target.closest('[data-tour-start]');
  if (tstart){ startTour(tstart.dataset.tourStart); return; }
  const tdis = e.target.closest('[data-tour-dismiss]');
  if (tdis){ markTourSeen(); render(); return; }

  const go = e.target.closest('[data-go]');
  if (go){ view = { s: go.dataset.go, id: null, tab: 'brief', cview: 'board' }; render(); return; }

  const mg = e.target.closest('[data-mg]');
  if (mg){
    const k = mg.dataset.mg;
    if (openMonths.has(k)) openMonths.delete(k); else openMonths.add(k);
    drawInteractions();
    return;
  }

  const op = e.target.closest('[data-open]');
  if (op){ view = { s: 'customer', id: op.dataset.open, tab: 'brief', cview: 'board' }; render(); return; }

  /* A calendar entry is a door, not a picture (§19): it opens the account
     the record belongs to, on the tab that holds the record. */
  const cgo = e.target.closest('[data-cgo]');
  if (cgo){ view = { s: 'customer', id: cgo.dataset.cgo, tab: cgo.dataset.cgotab || 'timeline', cview: 'board' }; render(); return; }

  /* The month on screen moves without leaving a trace in the URL — the
     same rule the search boxes live by. */
  const cal = e.target.closest('[data-cal]');
  if (cal){
    const w = cal.dataset.cal;
    if (w === 'today') calMonth = null;
    else {
      const [y, m] = calYm().split('-').map(Number);
      const d = new Date(y, m - 1 + (w === 'prev' ? -1 : 1), 1);
      calMonth = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    }
    render();
    return;
  }

  /* AI task boxes (§21–§23): the button names its box; the box's registry
     entry carries the state across screens. Ask-again resets the box and
     re-asks; Retry re-queues the same task id the server still holds. */
  const tgo = e.target.closest('[data-tb]');
  if (tgo) {
    runTaskAsk(tgo.dataset.tb, {
      action: tgo.dataset.tbAct || '',
      targetId: tgo.dataset.tbTarget || '',
      question: tgo.dataset.tbQuestion || '',
    });
    return;
  }
  /* #69 — a variant chip asks the same action with its own focus: the
     question is the only thing that changes, and it rides to the task row. */
  const tvar = e.target.closest('[data-tb-var]');
  if (tvar) {
    runTaskAsk(tvar.dataset.tbVar, {
      action: tvar.dataset.tbAct || '',
      targetId: tvar.dataset.tbTarget || '',
      question: tvar.dataset.tbVarQ || '',
    });
    return;
  }
  const tagain = e.target.closest('[data-tb-again]');
  if (tagain) {
    const m = tagain.dataset.tbAgain;
    const prev = aiTasks.get(m);
    aiTasks.delete(m);
    if (prev && prev.ask) runTaskAsk(m, prev.ask);
    return;
  }
  const tretry = e.target.closest('[data-tb-retry]');
  if (tretry) { retryTaskAsk(tretry.dataset.tbRetry); return; }

  /* #68 — a suggested action's Create Next Step button: opens the confirm
     sheet, writes nothing by itself. */
  const tstep = e.target.closest('[data-tb-step]');
  if (tstep) { openStepConfirm(tstep.dataset.tbStep, Number(tstep.dataset.tbStepI)); return; }

  const tb = e.target.closest('[data-tab]');
  if (tb){ view.tab = tb.dataset.tab; render(); return; }

  /* Classification: four words, one click, and the log keeps both sides. */
  const cl = e.target.closest('[data-cls]');
  if (cl){ setClass(cl.dataset.cls, cl.dataset.pn); return; }

  const cv = e.target.closest('[data-cv]');
  if (cv){ view.cview = cv.dataset.cv; render(); return; }

  /* a count in the strip is a view, not a decoration */
  const sc = e.target.closest('[data-scope]');
  if (sc){ peopleScope = sc.dataset.scope; render(); return; }

  /* A signal is not true until a human opens the source and says so. Two
     different acts: Confirm (I read it, it is real) and Not relevant (it is
     real but not ours to act on). Dismissal is a human call and it sticks. */
  const wv = e.target.closest('[data-wv]');
  if (wv){
    const w = (D.watch || []).find(x => x.id === wv.dataset.wv);
    if (w){
      w.st = 'confirmed'; w.conf = 'confirmed'; w.confBy = (D.me && D.me.name) || '';
      audit('data', 'Signal confirmed against its source', (w.h || w.t || '') + ' · ' + ((cust(w.c) || {}).name || ''),
            'Unverified', 'Confirmed');
      syncSave();
      toast('Confirmed · ' + (w.h || w.t || 'the signal') + ' is now marked checked.');
    }
    render(); return;
  }
  const wh = e.target.closest('[data-wh]');
  if (wh){
    const w = (D.watch || []).find(x => x.id === wh.dataset.wh);
    if (w){
      w.st = 'hidden'; w.hiddenBy = (D.me && D.me.name) || '';
      audit('data', 'Signal marked not relevant', (w.h || w.t || '') + ' · ' + ((cust(w.c) || {}).name || ''),
            w.st === 'confirmed' ? 'Confirmed' : 'Unverified', 'Not relevant');
      syncSave();
      toast('Marked not relevant · it is off the list for everybody.');
    }
    render(); return;
  }

  /* look through somebody else's eyes */
  const asw = e.target.closest('[data-as]');
  /* The lens belongs to an Admin. A BD pressing this in the console still
     only changes what they SEE — the server keeps refusing the act — but
     offering it at all would be promising something the role does not have. */
  if (asw){ if (guest || !isAdminSession()) return; asRole = asw.dataset.as; render(); return; }

  /* the matrix is editable — an Admin adjusts what each role may do */
  const cp = e.target.closest('[data-cap]');
  if (cp){ const [r, k] = cp.dataset.cap.split(':'); toggleCap(r, k); return; }

  /* admin tabs + the audit filters */
  const at = e.target.closest('[data-atab]');
  if (at){ adminTab = at.dataset.atab; render(); return; }
  const ak = e.target.closest('[data-ak]');
  if (ak){ auditKind = ak.dataset.ak; render(); return; }

  /* product reference — claim or release a product */
  const pa = e.target.closest('[data-pa]');
  if (pa){ openAssign(pa.dataset.pa); return; }
  const pw = e.target.closest('[data-pw]');
  if (pw){ toast('Opening WeCom to ' + pw.dataset.pw + ' — the fastest route to a real answer.'); return; }

  /* master–detail: pick a person, keep the list */
  const psel = e.target.closest('[data-sel]');
  if (psel){ pickedPerson = psel.dataset.sel; render(); return; }

  /* scoped find jumps you to the tab that holds the answer, then gets out
     of the way — a find that leaves you in the results is a dead end */
  const jp = e.target.closest('[data-jump]');
  if (jp){ view.tab = jp.dataset.jump; custQ = ''; render(); return; }

  /* months collapse, they never disappear */
  const tl = e.target.closest('[data-tl]');
  if (tl){
    const k = tl.dataset.tl;
    if (tlOpen.has(k)) tlOpen.delete(k); else tlOpen.add(k);
    render(); return;
  }

  const ac = e.target.closest('[data-act]');
  if (ac){
    const a = ac.dataset.act;
    if (a === 'map'){ showMap = !showMap; render(); return; }
    if (a === 'dense'){ dense = !dense; render(); return; }
    if (a === 'showall'){ showAllPeople = true; render(); return; }

/* Enter submits whichever form the person is typing in — signing in, adding a
   record, editing one, changing a password, saving a setting. Reaching for the
   mouse after every field is friction the keyboard should not charge. The
   button is looked up at press time inside the form the input belongs to, so
   re-renders cannot break it, and inputs with their own Enter behaviour (the
   command palette, the lookup box) are left alone. */
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const t = e.target;
  if (!t || t.tagName !== 'INPUT' || t.id === 'palI' || t.id === 'ncQ') return;
  const ty = String(t.type || 'text').toLowerCase();
  if (ty === 'checkbox' || ty === 'radio' || ty === 'button' || ty === 'submit') return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  /* Nearest container first: the capture veil holds its own save button, the
     page holds the settings ones, and the login screen lives outside the page
     entirely — so the first container that actually offers a save control
     wins, and an input with no form attached does nothing. */
  const btn = [t.closest('#capVeil'), document.getElementById('page'), document]
    .map((s) => s && s.querySelector(
      '[data-act="addsave"],[data-act="edsave"],[data-act="changepw"],[data-act="filesave"],' +
      '[data-act="saveuser"],[data-act="savemodel"],[data-act="savebudget"],[data-act="wasave"],' +
      '[data-act="delcustgo"],[data-act="signin"]'))
    .find((b) => b && !b.disabled);
  if (btn){ e.preventDefault(); btn.click(); }
});
document.addEventListener('keydown', (e) => {
  /* while a walkthrough is playing the keys belong to it */
  if (tour.id){
    if (e.key === 'Escape') tourStop();
    if (e.key === 'ArrowRight'){ clearTimeout(tour.timer); tourGoto(tour.i + 1); }
    if (e.key === 'ArrowLeft'){ clearTimeout(tour.timer); tourGoto(tour.i - 1); }
    if (e.key === ' '){ e.preventDefault(); document.getElementById('tPlay').click(); }
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); openPal(); }
  if (e.key === 'Escape'){ closePal(); closeCapture(); }
});
document.getElementById('pal').addEventListener('click', (e) => { if (e.target.id === 'pal') closePal(); });
