<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231554C0'/%3E%3Cpath d='M7 10l4.5 10L16 10l4.5 9L25 10' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='10' r='2.8' fill='white'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" />
<title>Waypoint — customer workbench</title>
<style>
/* ============================================================================
   v9 — the design system. One set of tokens, used by everything below.
   ========================================================================== */
:root{
  /* canvas & surfaces */
  --bg:#EEF1F6; --surface:#FFFFFF; --surface-2:#F6F8FA; --surface-3:#EFF2F6;
  --surface-brand:#F3F7FD; --surface-dark:#0A111D;
  /* brand blue ramp. `--blue` stays: it is the single entry point 42 existing
     rules already read from, and `--blue-500` likewise for its two. */
  --blue:#1554C0;
  --blue-25:#F7FAFE; --blue-50:#EEF4FD; --blue-100:#DDE9FA; --blue-200:#BFD4F3;
  --blue-300:#7FA9E8; --blue-400:#4E85DE; --blue-500:#2A6BE0;
  --blue-600:#2563D9; --blue-700:#1554C0; --blue-800:#12489F; --blue-900:#0F3E8C;
  /* semantic */
  --ok:#0E7A5A; --ok-600:#0B6B4E; --ok-50:#E7F5EF; --ok-100:#C4E7D8;
  --warn:#9A6207; --warn-600:#8A5606; --warn-50:#FCF3E4; --warn-100:#F0DDB4;
  --risk:#B4232A; --risk-600:#A61E24; --risk-50:#FCEDEE; --risk-100:#F2C6C9;
  --violet:#4B5BD6; --violet-600:#3A47B8; --violet-50:#EEF0FB; --violet-line:#DCE0F6;
  --info:#2563D9; --info-50:#EEF4FD;
  /* stage ramp — one hue, deepening. The pipeline reads as a channel getting
     deeper, not as four unrelated colours. */
  --stage-1:#7FA9E8; --stage-1-t:#EEF4FD; --stage-1-ink:#1D4FA8;
  --stage-2:#4E85DE; --stage-2-t:#E7F0FC; --stage-2-ink:#1A56C4;
  --stage-3:#2563D9; --stage-3-t:#E3EDFB; --stage-3-ink:#12489F;
  --stage-4:#12489F; --stage-4-t:#DFE9FA; --stage-4-ink:#0F3E8C;
  /* ink. `--ink-3` moved down one step: 3.79:1 on white was below AA for the
     muted text it carries, 4.60:1 is not. */
  --ink:#10151C; --ink-2:#4A5461; --ink-3:#6B7686; --ink-0:#A9B1BC;
  --ink-on-dark:#E7ECF3; --ink-on-dark-2:#A9BCD8;
  /* line */
  --line:#E3E8EF; --line-2:#CDD5E0; --line-strong:#B6C0CE; --line-tinted:#D5E2F7;
  /* rail */
  --rail-bg:#F4F6F9; --rail-line:#E3E8EF; --rail-ink:#333C4E; --rail-ink-dim:#717E91;
  --r-card:16px; --r-ctl:12px; --r-chip:999px;
  --e1:0 1px 2px rgba(16,24,40,.03), 0 1px 3px rgba(16,24,40,.04);
  --e2:0 8px 24px rgba(16,24,40,.06), 0 2px 6px rgba(16,24,40,.04);
  --e3:0 24px 64px rgba(16,24,40,.1);
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:72px;
  --font:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --font-display:"Sora",var(--font);
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --rail:216px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--font);
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background-color:var(--bg);
  /* A quiet, designed canvas: one faint brand glow at the top left that falls
     to the flat base, so cards read as cards instead of floating on a dead
     flat grey. No texture, no noise, no pattern — just depth. The violet glow
     that used to sit at the top right is gone on purpose: violet is now the
     channel reserved for model output, and spending it on the background
     would spend the meaning too. */
  background-image:radial-gradient(1100px 460px at 12% -8%, rgba(37,99,217,.075), transparent 62%)}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:var(--blue-100)}

/* ----------------------------------------------------------------- shell */
#app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
.rail{background:var(--rail-bg);border-right:1px solid var(--rail-line);
  padding:var(--s5) var(--s3);position:sticky;top:0;height:100vh;overflow-y:auto;
  /* flex column so the theme switch in .rail-foot can pin to the bottom
     with margin-top:auto when the nav runs short */
  display:flex;flex-direction:column}
.rail::-webkit-scrollbar{width:8px}
.rail::-webkit-scrollbar-thumb{background:#2A3850;border-radius:4px}
.brand{display:flex;align-items:center;gap:10px;padding:0 var(--s2) var(--s5)}
.brand-m{width:28px;height:28px;border-radius:8px;background:linear-gradient(160deg,#2A6BE0,#1554C0);
  display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;letter-spacing:-.02em;
  box-shadow:0 4px 10px rgba(21,84,192,.45)}
..brand-t{font-family:var(--font-display);font-size:14.5px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.grp{font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--rail-ink-dim);padding:var(--s4) var(--s2) var(--s2)}
.nav{display:flex;align-items:center;gap:10px;padding:9px var(--s2);border-radius:var(--r-ctl);
  color:var(--rail-ink);font-size:13.5px;font-weight:500;border:none;background:none;width:100%;
  text-align:left;margin-bottom:1px;transition:background .12s,color .12s,box-shadow .12s}
.nav:hover{background:rgba(0,0,0,.04);color:var(--ink)}
.nav.on{background:var(--surface);color:var(--blue);font-weight:600;box-shadow:0 2px 6px rgba(16,24,40,.04)}
.nav .g{width:16px;height:16px;flex:0 0 16px;opacity:.8}
.nav .c{margin-left:auto;font-size:11px;font-weight:600;color:var(--rail-ink-dim);font-variant-numeric:tabular-nums}
.nav.on .c{color:var(--blue-200)}

/* ----------------------------------------------------------------- topbar */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);
  backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s6);
  box-shadow:0 1px 4px rgba(16,24,40,.02)}
.cmd{display:flex;align-items:center;gap:9px;flex:1;max-width:520px;
  background:var(--surface-3);border:1px solid transparent;border-radius:var(--r-ctl);
  padding:7px var(--s3);color:var(--ink-3);font-size:13px;transition:.15s ease-out}
.cmd:hover{border-color:var(--line-2);background:var(--surface)}
.cmd .kbd{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--ink-0);
  border:1px solid var(--line-2);border-radius:4px;padding:1px 5px}
.me{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2)}
.av{width:28px;height:28px;border-radius:50%;background:var(--blue-100);color:var(--blue);
  display:grid;place-items:center;font-size:11px;font-weight:700}

/* ----------------------------------------------------------------- page */
.page{padding:var(--s6) var(--s6) var(--s8);max-width:1360px;margin:0 auto}
.phead{display:flex;align-items:flex-end;gap:var(--s4);margin-bottom:var(--s5)}
h1{font-family:var(--font-display);font-size:27px;line-height:1.12;letter-spacing:-.025em;font-weight:700;margin:0}
h2{font-family:var(--font-display);font-size:17px;font-weight:700;margin:0 0 var(--s3);letter-spacing:-.015em}
h3{font-size:13.5px;font-weight:600;margin:0 0 var(--s2);letter-spacing:-.005em}
.sub{color:var(--ink-3);font-size:12.5px;margin:2px 0 0}
.spacer{flex:1}

/* ----------------------------------------------------------------- primitives */
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--surface);
  border:1px solid var(--line-2);border-radius:var(--r-ctl);padding:6px 13px;
  font-size:13px;font-weight:500;color:var(--ink);transition:.12s ease-out;
  box-shadow:0 1px 2px rgba(16,24,40,.04)}
.btn:hover{background:var(--surface-2);border-color:#B9C2CF}
.btn.pri{background:linear-gradient(180deg,#2465D6,#1554C0);border-color:#12489F;color:#fff;
  font-weight:600;box-shadow:0 1px 2px rgba(12,64,150,.35), inset 0 1px 0 rgba(255,255,255,.14)}
.btn.pri:hover{background:linear-gradient(180deg,#2E70E4,#1A5CCB)}
.btn.sm{padding:4px 11px;font-size:12px}
.btn.ai{background:var(--violet-50);border-color:var(--violet-line);color:var(--violet);font-weight:600}
.btn.ai:hover{background:#E3E6F9}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
  padding:var(--s4);box-shadow:var(--e1)}
.grid{display:grid;gap:var(--s4)}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}
.row{display:flex;align-items:center;gap:var(--s2)}
.muted{color:var(--ink-3)}
.tiny{font-size:11.5px}
.mono{font-variant-numeric:tabular-nums;font-family:var(--font-mono)}

/* ---- Brief tab -----------------------------------------------------------
   Three bands, deliberately unequal. The identity band carries no card
   chrome so it reads as part of the page header, not as one more box in a
   column of boxes; the work band gives the only time-bound block on the
   page the wide column; the outside band is uneven because a news row
   carries more than a watch row does.
   Sizes are set by what each block holds, not by a shared grid. */
.bf-hero{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(0,1fr);gap:var(--s7);
  padding:var(--s1) 0 var(--s6);border-bottom:1px solid var(--line);margin-bottom:var(--s5)}
.bf-col{min-width:0}
.bf-h{font-family:var(--font-display);font-size:15px;font-weight:600;letter-spacing:-.01em;margin:0}
.bf-who{font-size:15px;line-height:1.7;color:var(--ink);margin:0;max-width:78ch}
.bf-fit{font-size:13.5px;line-height:1.65;color:var(--ink-2);margin:0;max-width:78ch}
.bf-label{font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--ink-3);margin-bottom:5px}
.bf-hr{height:1px;background:var(--line);margin:var(--s4) 0}
.bf-money{font-family:var(--font-display);font-size:30px;font-weight:700;letter-spacing:-.025em;
  line-height:1.06;font-variant-numeric:tabular-nums}
.bf-kv{display:grid;grid-template-columns:74px minmax(0,1fr);gap:10px var(--s3);align-items:baseline}
.bf-kv .k{font-size:11.5px;color:var(--ink-3)}
.bf-kv .v{font-size:13px;font-weight:500;color:var(--ink);min-width:0;overflow-wrap:anywhere}
.bf-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--r-chip);padding:3px 5px 3px 3px;font-size:12px}
.bf-chipx{border:none;background:none;color:var(--ink-3);cursor:pointer;font-size:14px;
  line-height:1;padding:0 3px;border-radius:50%}
.bf-chipx:hover{color:var(--risk)}
.bf-body{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:var(--s5);align-items:start}
.bf-body-main,.bf-body-side{display:flex;flex-direction:column;gap:var(--s4);min-width:0}
.bf-sec{padding:var(--s5)}
.bf-sec + .bf-sec{border-top:1px solid var(--line)}
/* watchCard — flush card shell, wrapped header row, and the collapsed
   one-line empty state (an empty block collapses instead of holding height). */
.card-flush{padding:0}
.row-wrap{flex-wrap:wrap}
.bf-sec-head{padding-bottom:var(--s3)}
.bf-sec-head h3{margin:0}
.wkw-empty{padding:var(--s3) var(--s4)}
.wkw-empty h3{margin:0}
.bf-outside{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:var(--s5);
  align-items:start;margin-top:var(--s5)}
.bf-outside > .card{margin-bottom:0}
@media(max-width:1080px){
  .bf-hero{grid-template-columns:1fr;gap:var(--s5)}
  .bf-body,.bf-outside{grid-template-columns:1fr}
}

/* figures */
.fig{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
  padding:var(--s4) var(--s5);box-shadow:var(--e1)}
.fig .v{font-family:var(--font-display);font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.fig .l{font-size:12.5px;color:var(--ink-2);margin-top:4px;font-weight:500}
.fig .n{font-size:11.5px;color:var(--ink-3);margin-top:2px}

/* focus band — Today's headline. One number that owns the screen, the three
   pipeline figures beside it, and a bar that splits the headline into
   overdue / waiting on / no date. Replaces four equal cards: a day's work
   is one number with a shape, not a quarter of a grid. */
.fb{display:grid;grid-template-columns:auto 1fr;column-gap:var(--s6);row-gap:var(--s4);align-items:center}
.fb-main{padding-right:var(--s6);border-right:1px solid var(--line)}
.fb-v{font-family:var(--font-display);font-size:46px;font-weight:700;letter-spacing:-.03em;
  line-height:1;font-variant-numeric:tabular-nums}
.fb-l{font-size:13px;font-weight:600;color:var(--ink-2);margin-top:6px;white-space:nowrap}
.fb-cells{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s5)}
.fb-cells .fig{background:none;border:none;box-shadow:none;padding:0;border-radius:0}
.fb-bar{grid-column:1 / -1}
.fb-track{height:8px;border-radius:var(--r-chip);background:var(--surface-3);
  overflow:hidden;display:flex}
.fb-seg{height:100%}
.fb-seg.r{background:var(--risk)}.fb-seg.w{background:var(--warn)}.fb-seg.n{background:var(--ink-0)}
.fb-legend{display:flex;gap:var(--s5);margin-top:8px;flex-wrap:wrap}
.fb-li{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--ink-2)}
.fb-li .dot{width:7px;height:7px;flex:none}
@media(max-width:1080px){
  .fb{grid-template-columns:1fr}
  .fb-main{border-right:none;border-bottom:1px solid var(--line);padding:0 0 var(--s4)}
  .fb-v{font-size:36px}
}

/* badges / chips */
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:var(--r-chip);
  padding:2.5px 9px;font-size:11.5px;font-weight:600;letter-spacing:.01em;white-space:nowrap;
  border:1px solid transparent}
.t-with{background:var(--ok-50);color:var(--ok);border-color:#BFE3D4}
.t-und{background:var(--surface-3);color:var(--ink-2);border-color:var(--line)}
.t-against{background:var(--risk-50);color:var(--risk);border-color:#F2C6C9}
.t-blue{background:var(--blue-50);color:var(--blue);border-color:#C9D9F4}
.t-warn{background:var(--warn-50);color:var(--warn);border-color:#F0DDB4}
.t-risk{background:var(--risk-50);color:var(--risk);border-color:#F2C6C9}
.t-ok{background:var(--ok-50);color:var(--ok);border-color:#BFE3D4}
.t-grey{background:var(--surface-3);color:var(--ink-2);border-color:var(--line)}
.t-violet{background:var(--violet-50);color:var(--violet);border-color:var(--violet-line)}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}

/* filter chips */
.fchip{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-chip);
  padding:4px 12px;font-size:12.5px;color:var(--ink-2)}
.fchip:hover{border-color:var(--ink-0)}
.fchip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-3);padding:0 12px 8px;border-bottom:1px solid var(--line-2)}
td{padding:11px 12px;border-bottom:1px solid var(--line);color:var(--ink-2)}
tr.lnk td{cursor:pointer}
/* A row you can click gets a trace of the brand, not just a grey wash — the
   hover is the only affordance telling you it is clickable. */
tr.lnk:hover td{background:var(--blue-25)}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:var(--s5)}
.tab{padding:9px 14px;font-size:13.5px;color:var(--ink-3);border:none;background:none;
  border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}

/* segments */
.seg{display:inline-flex;background:var(--surface-3);border-radius:var(--r-ctl);padding:2px}
.seg button{border:none;background:none;padding:4px 12px;font-size:12.5px;
  border-radius:6px;color:var(--ink-3);font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--e1)}

/* ----------------------------------------------------------------- AI */
.ai-mark{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:3px}
.ai-mark.rule{background:var(--blue-50);color:var(--blue)}
.ai-mark.model{background:var(--violet-50);color:var(--violet)}
/* One AI surface per opportunity, not two floating cards. The two ask boxes
   keep their own ids and buttons — the tests pin both — they just stop
   looking like two separate billboards. */
.ai-cluster{background:var(--violet-50);border:1px solid var(--violet-line);
  border-radius:var(--r-ctl);margin:var(--s3) 0;overflow:hidden}
.ai-cluster .card{background:transparent;border:none;border-radius:0;
  box-shadow:none;margin:0;padding:9px 12px}
.ai-cluster .card + .card{border-top:1px dashed var(--violet-line)}
.ai-cluster .card + .card > .row:first-child .tiny.muted{display:none}
.ai-cluster .card > .row:first-child .tiny.muted,
.ai-cluster .card > .row .tiny.muted:first-child{
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pchip{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line-2);
  background:var(--surface);border-radius:var(--r-card);padding:10px var(--s3);margin-bottom:var(--s2)}
.pchip .x{margin-left:auto;border:none;background:none;color:var(--ink-0);font-size:15px;line-height:1;padding:0 2px}
.pchip .x:hover{color:var(--ink)}
.pchip .t{font-size:13px;font-weight:500}
/* A company's own description is one long unbroken string. Without this it
   pushes past the right edge of the row instead of wrapping inside it. */
.pchip .d{font-size:12px;color:var(--ink-3);min-width:0;overflow-wrap:anywhere}
.pchip>*{min-width:0}
.cite{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:11.5px;
  color:var(--blue);font-weight:500;margin:0 5px 5px 0}
.cite:hover{background:var(--blue-50)}

/* overlay */
.veil{position:fixed;inset:0;background:rgba(16,21,28,.36);z-index:60;
  display:none;align-items:center;justify-content:center;padding:var(--s5)}
.veil.on{display:flex}
.sheet{background:var(--surface);width:min(720px,100%);border-radius:16px;
  box-shadow:var(--e3);max-height:88vh;overflow-y:auto;
  transform:translateY(10px) scale(.99);opacity:0;transition:.2s cubic-bezier(.2,.8,.2,1)}
.veil.on .sheet{transform:none;opacity:1}
.sheet-h{display:flex;align-items:center;gap:var(--s2);padding:var(--s4) var(--s5);
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.sheet-b{padding:var(--s5)}
.sheet-f{display:flex;gap:var(--s2);padding:var(--s4) var(--s5);border-top:1px solid var(--line);
  position:sticky;bottom:0;background:var(--surface);justify-content:flex-end}
textarea{width:100%;border:1px solid var(--line-2);border-radius:var(--r-ctl);
  padding:11px var(--s3);font-size:13.5px;resize:vertical;min-height:92px;outline:none;line-height:1.6;
  background:var(--surface)}
textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-50)}
input:focus{border-color:var(--blue)!important;box-shadow:0 0 0 3px var(--blue-50);outline:none}
.search:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-50)}
.search input:focus{box-shadow:none}
/* add-form field: a label so nothing has to be guessed from a placeholder,
   wide fields take the whole row so long text is readable while typing */
.afield{display:flex;flex-direction:column;gap:5px;flex:1;min-width:210px;text-align:left}
.afield-wide{flex:1 1 100%}
.afield>span{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.afield>input,.afield>select,.afield>textarea{width:100%;border:1px solid var(--line-2);
  border-radius:var(--r-ctl);padding:8px 11px;font-size:13.5px;background:var(--surface);
  color:var(--ink);outline:none;font-family:inherit}
.afield>textarea{min-height:96px;line-height:1.55;resize:vertical}

/* command palette */
.pal{position:fixed;top:16vh;left:50%;transform:translateX(-50%);width:min(620px,92vw);
  background:var(--surface);border-radius:14px;box-shadow:var(--e3);z-index:80;display:none;overflow:hidden}
.pal.on{display:block}
.pal-i{width:100%;border:none;outline:none;padding:var(--s4) var(--s5);font-size:15px;
  border-bottom:1px solid var(--line)}
.pal-b{max-height:52vh;overflow-y:auto;padding:var(--s3) var(--s3) var(--s4)}
.pal-a{padding:var(--s4) var(--s5)}
.pal-q{display:flex;gap:9px;align-items:center;padding:8px var(--s3);border-radius:var(--r-ctl);
  font-size:13px;color:var(--ink-2);width:100%;text-align:left;border:none;background:none}
.pal-q:hover{background:var(--surface-3)}

/* diff review */
.diff{width:100%;border-collapse:collapse;font-size:13px}
.diff th{text-transform:none;letter-spacing:0;font-size:11px}
.diff td{padding:10px 12px;vertical-align:middle}
.diff .k{width:150px;color:var(--ink);font-weight:600;white-space:nowrap}
.diff .old{color:var(--ink-3);text-decoration:line-through}
.diff .new{color:var(--ink);font-weight:500}
.diff .why{color:var(--ink-3);font-size:11.5px}
.mini{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;
  padding:3px 8px;font-size:12px;font-weight:600}
.mini.on{background:var(--ok);border-color:var(--ok);color:#fff}

/* stage columns */
.board{display:flex;gap:var(--s3);align-items:flex-start;flex-wrap:wrap}
/* A stage with nothing in it still gets named — you need to see where a card
   will land — but it stops renting the same width as a live column. The class
   is `.col-none`, NOT `.empty`: that name is the page-level empty state
   (centred, heavily padded) and it hijacks any column that borrows it. */
.col{flex:1 1 230px;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-card);padding:var(--s3)}
.col-none{flex:0 1 150px;min-width:130px}
.col-h{display:flex;align-items:baseline;gap:7px;margin-bottom:var(--s3);padding:0 2px}
.col-h .n{font-size:13px;font-weight:600}
.col-h .c{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.col-t{margin-left:auto;font-size:12px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
/* empty stage column: header + one quiet line, nothing taller */
.col-empty{padding:0 2px;font-size:11.5px;color:var(--ink-3)}
.opp{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:11px var(--s3);margin-bottom:var(--s2);box-shadow:var(--e1)}
.opp:hover{border-color:var(--line-2)}
.opp .t{font-size:13px;font-weight:600;letter-spacing:-.005em}
.opp .m{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.opp .f{display:flex;align-items:center;gap:7px;margin-top:9px}
/* opportunity card assets: mark + identity, owner chip, anchored money */
.opp-h{display:flex;align-items:flex-start;gap:8px}
.opp-id{flex:1;min-width:0}
.opp-own{display:inline-flex;align-items:center;gap:6px;margin-top:8px;
  font-size:11px;font-weight:600;color:var(--ink-2);line-height:1}
.opp-own .av{width:18px;height:18px;font-size:9px;flex:0 0 18px}
.opp .amt{font-size:15px;font-weight:600;letter-spacing:-.01em}
.rail-dots{display:flex;gap:3px;margin-top:9px}
.rail-dots i{width:22px;height:6px;border-radius:var(--r-chip);background:var(--line-2)}
.rail-dots i.on{background:var(--blue)}
/* parked empty state: one slim row, not a full card */
.parked-empty{background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-ctl);padding:9px var(--s4);font-size:12.5px;color:var(--ink-3)}

/* misc */
.empty{text-align:center;padding:var(--s7) var(--s5);color:var(--ink-3);font-size:13px}
.hr{height:1px;background:var(--line);margin:var(--s5) 0}
.kv{display:grid;grid-template-columns:120px 1fr;gap:7px var(--s4);font-size:13px}
.kv .k{color:var(--ink-3)}
/* A domain longer than the column must wrap, not march over the edge. */
.kv>*{min-width:0;overflow-wrap:anywhere}
.note{border-left:3px solid var(--blue-500);background:var(--blue-50);padding:10px var(--s4);
  border-radius:0 8px 8px 0;font-size:12.5px;margin:var(--s3) 0}
/* month group — collapsed by default, current month open */
.mg{display:flex;align-items:center;gap:9px;width:100%;border:none;background:none;
  padding:var(--s4) var(--s1) var(--s2);text-align:left}
.mg .l{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.mg .n{font-size:11px;font-weight:600;color:var(--ink-0);font-variant-numeric:tabular-nums}
.mg .tw{font-size:11px;color:var(--ink-0);transition:transform .15s ease-out}
.mg.open .tw{transform:rotate(90deg)}
.mg:hover .l{color:var(--ink)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-2);
  border-radius:var(--r-ctl);padding:7px var(--s3);width:280px}
.search input{border:none;outline:none;background:none;flex:1;font-size:13px}
.search input::placeholder{color:var(--ink-0)}
.pick{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-ctl);
  padding:6px 10px;font-size:13px;max-width:240px}

/* --------------------------------------------- guided walkthrough ("demo") */
.tour{position:fixed;inset:0;z-index:90;display:none}
.tour.on{display:block}
.t-block{position:fixed;inset:0}
.t-spot{position:fixed;z-index:91;border-radius:12px;pointer-events:none;opacity:0;
  box-shadow:0 0 0 9999px rgba(16,21,28,.46),0 0 0 1px var(--blue-100);
  outline:1.5px solid var(--blue);outline-offset:4px;
  transition:left .5s cubic-bezier(.2,.8,.2,1),top .5s cubic-bezier(.2,.8,.2,1),
    width .5s cubic-bezier(.2,.8,.2,1),height .5s cubic-bezier(.2,.8,.2,1),opacity .25s ease-out}
.t-cur{position:fixed;z-index:93;width:20px;height:20px;border-radius:50%;pointer-events:none;
  border:1.5px solid var(--blue);background:rgba(42,107,224,.16);opacity:0;
  transform:translate(-50%,-50%);
  transition:left .5s cubic-bezier(.2,.8,.2,1),top .5s cubic-bezier(.2,.8,.2,1),opacity .3s ease-out}
.t-cur.on{opacity:1}
.t-cur::after{content:"";position:absolute;inset:-7px;border-radius:50%;
  border:1.5px solid var(--blue);animation:tping 1.7s ease-out infinite}
@keyframes tping{0%{transform:scale(.55);opacity:.55}70%{transform:scale(1.3);opacity:0}100%{opacity:0}}
.t-card{position:fixed;z-index:94;left:50%;bottom:26px;transform:translateX(-50%);
  width:min(580px,92vw);background:var(--surface);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--e3);padding:var(--s4) var(--s5) var(--s3)}
.t-head{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--ink-3)}
.t-head .n{font-weight:600;color:var(--ink-2)}
.t-x{margin-left:auto;border:none;background:none;color:var(--ink-3);font-size:12px}
.t-x:hover{color:var(--ink)}
.t-text{font-size:14px;line-height:1.55;margin-top:9px;color:var(--ink);transition:opacity .18s ease-out}
.t-text.out{opacity:0}
.t-bar{height:2px;background:var(--surface-3);border-radius:2px;margin-top:var(--s3);overflow:hidden}
.t-bar i{display:block;height:100%;width:0;background:var(--blue)}
.t-ctl{display:flex;align-items:center;gap:8px;margin-top:11px}
.t-dots{display:flex;gap:5px;align-items:center}
.t-dots b{width:5px;height:5px;border-radius:50%;background:var(--line-2)}
.t-dots b.on{background:var(--blue)}
/* tour menu */
.tmenu{position:fixed;z-index:95;top:54px;right:var(--s6);width:308px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--e3);padding:var(--s2);display:none}
.tmenu.on{display:block}
.tm-i{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:none;
  background:none;padding:9px 10px;border-radius:8px}
.tm-i:hover{background:var(--surface-3)}
.tm-i .n{font-size:13px;font-weight:500;color:var(--ink)}
.tm-i .d{font-size:11.5px;color:var(--ink-3);line-height:1.45;margin-top:1px}
.tm-i .m{margin-left:auto;font-size:11px;color:var(--ink-0);white-space:nowrap;font-variant-numeric:tabular-nums}
.tm-f{font-size:11.5px;color:var(--ink-3);padding:4px 10px 6px}
.glink{border:none;background:none;color:var(--blue);font-size:12.5px;font-weight:500;padding:0 0 2px}
.glink:hover{text-decoration:underline}
/* illustrations — every one explains a flow, a rule or a state */
.art{display:block;flex:0 0 auto}
.artline{display:flex;align-items:center;gap:var(--s4);margin-bottom:var(--s4)}
.artline .t{font-size:12.5px;color:var(--ink-3);line-height:1.5}
.artline .t b{color:var(--ink-2);font-weight:600}

/* customer marks — a trademark is the one place colour may be arbitrary,
   because it is their identity, not our taxonomy. Fallback is initials. */
.logo{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  border:1px solid var(--line);border-radius:7px;background:var(--surface);overflow:hidden}
.logo svg{width:64%;height:64%;display:block}
.monogram{display:inline-grid;place-items:center;flex:0 0 auto;border:1px solid var(--line);
  border-radius:7px;background:var(--surface-3);color:var(--ink-2);
  font-size:10px;font-weight:700;letter-spacing:.02em}
.src{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:11px;color:var(--ink-3);font-weight:500}

/* ================================================================== login */
/*  Two surfaces: a dark brand surface that carries the idea (signal →
    relationship → action), and a light working surface with the form.
    The mark is the same Route W; nothing here is a new visual language. */
#loginRoot:empty{display:none}
body.onlogin #app{display:none}
.lg{display:grid;grid-template-columns:1.05fr .95fr;min-height:100vh;background:var(--surface)}
.lg-hero{position:relative;overflow:hidden;background:var(--surface-dark);color:#fff;
  display:flex;flex-direction:column;padding:var(--s7) var(--s6) var(--s6)}
.lg-hero::before{content:"";position:absolute;inset:0;
  background:radial-gradient(880px 520px at 20% 16%,rgba(42,107,224,.34),transparent 62%),
             radial-gradient(700px 440px at 88% 84%,rgba(75,91,214,.24),transparent 60%)}
.lg-hero::after{content:"";position:absolute;inset:0;opacity:.55;
  background-image:radial-gradient(rgba(255,255,255,.13) 1px,transparent 1px);
  background-size:26px 26px;-webkit-mask-image:radial-gradient(720px 520px at 32% 42%,#000,transparent);
  mask-image:radial-gradient(720px 520px at 32% 42%,#000,transparent)}
.lg-hero>*{position:relative;z-index:1}
.lg-brand{display:flex;align-items:center;gap:11px}
.lg-tile{width:36px;height:36px;border-radius:10px;background:#fff;color:var(--blue);
  display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.32)}
.lg-word{font-size:16.5px;font-weight:600;letter-spacing:-.012em}
.lg-word i{font-style:normal;color:#8FA6C8;font-weight:500}
.lg-net{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin:var(--s5) 0}
.lg-net svg{width:100%;height:auto;max-height:400px;animation:lgdrift 18s ease-in-out infinite}
.lg-copy{margin-top:auto}
.lg-kick{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:#7C90AE;margin:0 0 12px}
.lg-h{font-size:27px;line-height:1.26;font-weight:600;letter-spacing:-.02em;margin:0 0 10px;max-width:15ch}
.lg-p{font-size:13.5px;color:var(--ink-on-dark-2);margin:0;max-width:44ch;line-height:1.62}
.lg-form{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:var(--s6) var(--s5);gap:var(--s5)}
.lg-card{width:100%;max-width:352px}
.lg-card h1{font-size:22px;margin:0 0 5px;letter-spacing:-.015em}
.lg-sub{color:var(--ink-3);font-size:12.5px;margin:0 0 var(--s5)}
.f{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin:0 0 5px}
.inp{width:100%;border:1px solid var(--line-2);border-radius:var(--r-ctl);padding:10px var(--s3);
  font-size:13.5px;outline:none;background:var(--surface);margin-bottom:var(--s3)}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-50)}
.lg-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);margin:2px 0 var(--s4)}
.lg-go{width:100%;justify-content:center;padding:10px 14px;font-size:13.5px}
/* #C0392B was a different red from the one every other error in the app used.
   Same channel, one red — a sign-in error is the same kind of thing as a
   failed save. */
.lg-err{margin:8px 0 0;font-size:12.5px;color:var(--risk-600);line-height:1.45}
.lg-foot{font-size:11.5px;color:var(--ink-0);text-align:center;max-width:352px;line-height:1.6}
.lg-foot button{border:none;background:none;color:var(--blue);font-size:11.5px;padding:0}
.lg-foot button:hover{text-decoration:underline}
.lg-mob{display:none}
@keyframes lgdrift{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-9px,0)}}
@keyframes lgin{from{opacity:0;transform:scale(.66)}to{opacity:1;transform:scale(1)}}
@keyframes lgpulse{0%,100%{opacity:.6}50%{opacity:1}}
.lg-n{animation:lgin .9s cubic-bezier(.2,.8,.2,1) backwards}
.lg-big{animation:lgpulse 6s ease-in-out infinite}
@media(max-width:980px){
  .lg{grid-template-columns:1fr}
  .lg-hero{padding:var(--s5) var(--s4) var(--s4);min-height:210px}
  .lg-net{margin:var(--s4) 0 0}
  .lg-net svg{max-height:190px}
  .lg-copy{display:none}
  .lg-mob{display:flex}
  .lg-form{padding:var(--s5) var(--s4) var(--s6)}
}
@media(prefers-color-scheme:dark){
  .lg{background:#0B0F16}
  .lg-form{color:#E7ECF3}
  .lg-card h1{color:#F2F5F9}
  .lg-sub{color:#8B97A8}
  .f{color:#9AA6B6}
  .inp{background:#141A23;border-color:#2A3341;color:#E7ECF3}
  .inp:focus{border-color:var(--blue-500);box-shadow:0 0 0 3px rgba(42,107,224,.22)}
  .lg-row{color:#8B97A8}
  .lg-form .btn{background:#141A23;border-color:#2A3341;color:#E7ECF3}
  .lg-form .btn:hover{background:#1B222C}
  .lg-form .btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
  .lg-foot{color:#6B7787}
}
@media(prefers-reduced-motion:reduce){
  .lg-net svg,.lg-n,.lg-big{animation:none}
}

/* ----------------------------------------------------------------- mobile */
#navBtn{display:none}
#navBack{display:none;position:fixed;inset:0;background:rgba(16,21,28,.42);z-index:65}
@media(max-width:880px){
  #app{grid-template-columns:1fr}
  #navBtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;
    border:1px solid var(--line-2);border-radius:var(--r-ctl);background:var(--surface);flex:0 0 34px}
  .rail{position:fixed;top:0;left:0;bottom:0;z-index:70;transform:translateX(-100%);
    transition:transform .26s cubic-bezier(.2,.8,.2,1);box-shadow:var(--e3);height:100vh}
  body.nav-open .rail{transform:none}
  body.nav-open #navBack{display:block}
  .top{padding:10px var(--s4);gap:var(--s2)}
  .top .cmd{max-width:none;font-size:12.5px;padding:6px var(--s2)}
  .top .cmd .kbd{display:none}
  .me .conn{display:none}
  .page{padding:var(--s4) var(--s4) var(--s8);max-width:none}
  h1{font-size:22px}
  .phead{flex-wrap:wrap;align-items:flex-start;gap:var(--s2)}
  .g4,.g3,.g2{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .fig .v{font-size:24px}
  .btn.sm{min-height:34px;padding:6px 12px}
  .search{width:auto;flex:1;min-width:140px}
  .pick{max-width:none;flex:1}
  table{font-size:12.5px}
  .artline{flex-direction:column;align-items:flex-start;gap:var(--s2)}
  .kv{grid-template-columns:1fr;gap:2px var(--s3)}
  .kv .k{margin-top:6px}
  .tmenu{left:12px;right:12px;width:auto}
  .t-card{width:calc(100% - 24px);bottom:12px;padding:var(--s3) var(--s4) 10px}
  .t-ctl .btn{min-height:34px}
  .t-text{font-size:13.5px}
  .pd-wrap{grid-template-columns:1fr}
  body.picked .plist{display:none}
  .pr-m.opt{display:none}
  .strip{gap:var(--s3)}
}

/* =================================================== scale — long lists ===
   A long list is not tamed with more filters. It is tamed with order, a
   summary you can read, grouping, density and a cap — in that order. The
   ordering rule below is deterministic: a rule, not a model. Nobody has to
   trust it, because anybody can read it off the row. */
.strip{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;padding:9px var(--s4);
  border:1px solid var(--line);border-radius:var(--r-ctl) var(--r-ctl) 0 0;background:var(--surface-2)}
.sstat{display:flex;align-items:baseline;gap:6px;border:none;background:none;padding:3px 0;white-space:nowrap}
.sstat .n{font-size:13.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.sstat .l{font-size:12px;color:var(--ink-3)}
.sstat:hover .l{color:var(--ink-2)}
.sstat.on .n{color:var(--blue)}
.sstat.on .l{color:var(--blue);font-weight:500}
.grp-h{display:flex;align-items:center;gap:8px;padding:var(--s3) var(--s4) 5px;font-size:11px;
  font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.grp-h .n{color:var(--ink-0);letter-spacing:0}
.grp-h .why{text-transform:none;letter-spacing:0;font-weight:400;font-size:11.5px;color:var(--ink-0)}
.pr{display:flex;align-items:center;gap:var(--s3);width:100%;border:none;background:none;
  padding:11px var(--s4);border-bottom:1px solid var(--line);text-align:left}
.pr:hover{background:var(--surface-2)}
.pr.on{background:var(--blue-100);box-shadow:inset 2px 0 0 var(--blue)}
.pr-main{flex:1;min-width:0}
.pr-n{display:block;font-size:13.5px;font-weight:600;color:var(--ink)}
.pr-t{display:block;font-size:12px;color:var(--ink-3);margin-top:1px}
.pr-m{flex:0 0 auto;font-size:12px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.pr-c{flex:0 0 auto;color:var(--ink-0);font-size:15px}
body.dense .pr{padding:6px var(--s4)}
body.dense .pr-n{font-size:13px;display:inline}
body.dense .pr-t{display:inline;margin-left:8px}
body.dense .pr-m.opt{display:none}
body.dense .opt{display:none}
.pd-wrap{display:grid;grid-template-columns:1.35fr 1fr;gap:var(--s5);align-items:start}
.pd-back{display:none}
body.picked .pd-back{display:inline-flex}
.lk{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-2);background:var(--surface);
  border-radius:var(--r-chip);padding:3px 9px;font-size:12px;color:var(--ink-2);text-decoration:none}
.lk:hover{border-color:var(--blue-100);color:var(--blue)}
.more{display:flex;align-items:center;gap:8px;padding:10px var(--s4);border-top:1px solid var(--line);
  font-size:12.5px;color:var(--ink-3);width:100%;border-left:none;border-right:none;border-bottom:none;background:none}
.more:hover{color:var(--blue)}
.soc{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface-2);
  border-radius:999px;padding:2px 8px;font-size:11px;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.soc:hover{border-color:var(--blue);color:var(--blue)}
.find-row{display:flex;align-items:center;gap:var(--s3);width:100%;border:none;background:none;
  padding:10px var(--s4);border-bottom:1px solid var(--line);text-align:left}
.find-row:hover{background:var(--surface-2)}

   A screenshot cannot be stopped from inside a web page — the operating
   system and a phone camera both outrank us. What we can do is make any
   copy that leaves carry the name of the person who took it, and remove
   every button that makes leaving easy. So: no export for anybody but
   Admin, no printing, and a watermark with who and when on every screen. */

   test, print or copy ever sees a corgi. Images carry only a height; the
   poses have different aspect ratios and the width follows. */
.mascot{display:inline-block;user-select:none;pointer-events:none}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

.battery .btrack{position:absolute;inset:2px;overflow:hidden;border-radius:2px}

@keyframes charge{0%{width:12%;background:#E05B4B}45%{width:55%;background:#F2A93B}

/* the AI card — thinking out of the box */
.m-box{height:46px;width:auto;flex:none}

.m-proud{height:26px;width:auto;flex:none}
.m-guard{height:24px;width:auto;vertical-align:-7px;margin-right:7px}
/* the rail footer: the switch, labelled by the butt. Always rendered —

.rail-foot{margin-top:auto;padding-top:var(--s4)}

const todayISO = () => { const n = new Date(), p = (x) => String(x).padStart(2, '0');

/* ============================================================================ */
/*  The address bar — the page you are on, written where a browser keeps it    */
/*                                                                             */
/*  Until now the URL never changed. Every screen lived in one variable, so a  */
/*  reload put you back on Today, a second tab could not hold a second         */
/*  customer, and "have a look at this account" could only be said by         */
/*  describing the route to it out loud.                                       */
/*                                                                             */
/*  The rule that shapes everything below:                                      */
/*    · the URL records WHERE YOU ARE — screen, record, tab, list-vs-board.    */
/*      It is a place, and a place has an address.                             */
/*    · the URL does NOT record what you have TYPED — search boxes, half-      */
/*      filled forms, which months you collapsed. Those are the state of a     */
/*      conversation with the page, not a location in it, and a URL that       */
/*      grows a query parameter for every keystroke is one nobody can share    */
/*      or read. Filters that survive a reload are a fine idea and a different */
/*      one; they are deliberately not smuggled in here.                       */
/*                                                                             */
/*  `history.replaceState`, never `pushState`: this app is one long-lived      */
/*  surface, and pushing a history entry for every tab press would bury the    */
/*  page the user arrived from under a hundred presses of Back — the browser   */
/*  button would stop meaning "where I came from" and start meaning "the last  */
/*  thing I clicked", which is a worse deal than no history at all.            */
/*  Back and Forward still work; they move between places the user actually    */
/*  navigated to by leaving, which is what the button promises.                */
/* ============================================================================ */

/* The screens that exist. Anything else in the URL is a typo, and a typo is
   answered by ignoring it rather than by a 404 — the app has no 404 page and
   inventing one for a mistyped hash would be giving a wrong address more
   ceremony than a right one. */
const ROUTE_SCREENS = ['today','calendar','customers','customer','people','opportunities','interactions','products','insights','aitasks','admin'];
/* The customer page is the only one with tabs, and the two list screens are the
   only ones with a layout. Keeping the vocabulary closed means an unknown tab
   cannot become a sixth tab that no renderer is written for. */
const ROUTE_TABS   = ['brief','people','systems','opportunities','timeline','files'];
const ROUTE_CVIEWS = ['board','list'];

/* Which layout belongs to which screen — so `#/opportunities` and a customer's
   own Opportunities tab do not fight over one setting. */
const SCREEN_CVIEW = { customers:'board', opportunities:'board', customer:'board' };

/* The screen is called `customer` inside the app and `customers/<id>` in the
   URL. The internal name is a key in a switch; the URL is a thing a person
   reads, sends, and types from memory, and "#/customers/c123" is the address
   of a record IN the customers collection. Renaming the internal key to match
   would touch every renderer and every suite for a cosmetic gain, so the two
   names are translated at the one boundary that exists: here. */
const ROUTE_PATH = { customer: 'customers' };

function viewToHash(v){
  /* Not signed in is not a place to come back to. The sign-in screen has no
     address because there is nothing behind it worth sharing. */
  if (!v || !v.s || v.s === 'login') return '';
  let h = '#/' + (ROUTE_PATH[v.s] || v.s);
  /* A record id rides in the path — `#/customers/c123`, not `?id=c123` —
     because it names the thing the page is about, not a setting on it. */
  if (v.s === 'customer' && v.id) h += '/' + encodeURIComponent(v.id);
  const q = [];
  if (v.s === 'customer' && ROUTE_TABS.includes(v.tab) && v.tab !== 'brief') q.push('tab=' + v.tab);
  if (SCREEN_CVIEW[v.s] && ROUTE_CVIEWS.includes(v.cview) && v.cview !== 'board') q.push('view=' + v.cview);
  return q.length ? h + '?' + q.join('&') : h;
}

function hashToView(hash){
  const raw = String(hash || '').replace(/^#\/?/, '');
  if (!raw) return null;
  const [path, query] = raw.split('?');
  const seg = path.split('/').filter(Boolean).map(s => { try { return decodeURIComponent(s); } catch { return s; } });
  /* The path word is translated back to the internal screen name in the same
     breath. `customers` with no id is the list; `customers/c123` is the record —
     one word, two screens, decided by whether an id follows it. */
  let s = seg[0];
  if (s === 'customers' && seg[1]) s = 'customer';
  if (!ROUTE_SCREENS.includes(s)) return null;
  /* A customer page with no customer is not a smaller version of the customer
     page — it is the customer list. Fall back to the list rather than render a
     detail screen with nothing in it. */
  if (s === 'customer' && !seg[1]) return { s: 'customers', id: null, tab: 'brief', cview: 'board' };
  const v = { s, id: s === 'customer' ? seg[1] : null, tab: 'brief', cview: SCREEN_CVIEW[s] || 'board' };
  /* URLSearchParams, not a hand-rolled split: a value with a space or an
     ampersand in it round-trips correctly, and `decodeURIComponent` alone
     would leave `+` as a plus sign. */
  const q = new URLSearchParams(query || '');
  const tb = q.get('tab'), cv = q.get('view');
  if (s === 'customer' && ROUTE_TABS.includes(tb)) v.tab = tb;
  if (SCREEN_CVIEW[s] && ROUTE_CVIEWS.includes(cv)) v.cview = cv;
  return v;
}

/* The one flag the mirror needs. Without it the two directions chase each
   other: `hashchange` writes `view`, the render that follows writes `view`
   back to the hash, and a URL that no longer matches the one the user pasted
   is read as a new navigation. It is raised while the tour is playing, whose
   dozen screen changes are the tour's movements rather than the user's. The
   echo the other way needs no flag: `syncRoute` compares before it writes. */
let routeSilent = true;   /* the app is driving the screen; leave the URL alone */

/* Write the current view into the address bar.
   Silent while signed out and while the tour is playing. Both are `routeSilent`,
   raised at the one place each begins and lowered where it ends. Signing out
   needs no special case here — `viewToHash` answers '' for the sign-in screen,
   so the mirror clears the hash in the ordinary way. */
function syncRoute(){
  if (routeSilent) return;
  try {
    const h = viewToHash(view);
    const cur = location.hash || '';
    /* Compared, not trusted: this runs on every render, and a `render` caused
       by a `hashchange` would otherwise write back the hash it just read.
       Identical means nothing to do, which is what stops the two-way loop. */
    if (h === cur) return;
    /* `replaceState` cannot move the URL on an opaque origin — a copy opened
       from the filesystem has no history to write into. The hash assignment
       always works and fires its own `hashchange`, so the failure path is a
       working path rather than a dead end. */
    try { history.replaceState(null, '', h || location.pathname + location.search); }
    catch { if (h) location.hash = h; }
  } catch { /* no location: the app still renders, it just keeps no address */ }
}

/* Read the address bar and move the app to what it names. Used on boot and on
   every hashchange — the same function both times, so a reload and a pasted
   link cannot drift apart. Returns false when the hash names nothing. */
function navigateFromHash(){
  const h = (typeof location !== 'undefined' && location.hash) || '';
  const v = hashToView(h);
  if (!v) return false;
  /* An Admin screen is unreachable by URL for a role that cannot open it —
     the same guard the renderer applies, applied before the state is set, so
     the address bar cannot become a way around the role. */
  if (v.s === 'admin' && typeof can === 'function' && !can('users')) return false;
  /* A customer id that is not in this workspace is not a location. Whoever is
     signed in may simply not be on that account, and rendering an empty
     customer page would look like the record had lost its contents. */
  if (v.s === 'customer' && typeof inScope === 'function' && !inScope(v.id)) return false;
  view = v;
  /* The customer page's own sub-state the URL does not carry. A hash naming a
     person's tab should not leave the previous customer's person selected. */
  pickedPerson = null;
  return true;
}

  bd:      { allCustomers:0, create:1, edit:1, del:0, commercial:1, technical:0, log:1,
             people:1, opp:1, export:0, users:0 },
  sa:      { allCustomers:0, create:0, edit:1, del:0, commercial:0, technical:1, log:1,
             people:1, opp:1, export:0, users:0 }
};

let asRole = 'admin';        /* Admin looking through someone else's eyes */
/* Nobody has signed in. "Look around" is not a session: it shows the sample
   workspace read-only, so the controls it offers are only the ones that
   actually do something without a session — which is to say, none of the
   write, export, user or model ones. */
let guest = false;

/* What the SERVER said you are. `asRole` is a lens the wearer can change;
   this one cannot be changed from the browser at all. It is the difference
   between "looking through someone's eyes" and "being someone else":
   only a real Admin ever gets the lens, and only an Admin gets it back. */
let sessionRole = '';
/* True once the server has told us who is signed in. Until then `D.me` is the
   name baked into this file, which is nobody in particular. */
let meFromSession = false;
const isAdminSession = () => sessionRole === 'admin';

/* The role you signed in with is the role you have.
   `asRole` used to default to 'admin' and only a guest was ever downgraded,
   so every signed-in BD, SA and Manager held Admin's powers on screen while
   the server was refusing them the same act. A permission the browser checks
   is a preference; the server's answer is the rule — so make them agree. */
function adoptRole(){
  const r = String((D.me && D.me.role) || '').toLowerCase();
  if (!CAPS[r]) return asRole;
  if (!sessionRole) sessionRole = r;
  asRole = r;
  return r;
}

const can = (cap) => !guest && !!(CAPS[asRole] || {})[cap];

/* Who is on which customer is a fact about the CUSTOMER, not a second list
   that has to be kept in step with it: two lists means two answers, and the
   wrong one is the one the user believes. `c.team` holds our people, `c.owner`
   the person who brought the account in. Everything here reads those two; the
   admin's editor writes to `c.team`. One writer, one answer, and it is the
   answer that gets saved to the server.

   This used to be a hardcoded map with one person's name in it, so every
   signed-in colleague was scoped as if they were that person — a BD opening
   their own book saw somebody else's customers, and a colleague put on an
   account by its owner saw nothing at all. */
const meName = () => (D.me && D.me.name) || '';
const teamIds  = (n) => !n ? [] : D.customers.filter(c => (c.team || []).includes(n)).map(c => c.id);
const withPerson = (n) => !n ? [] : D.customers.filter(c => (c.team || []).includes(n)
                                  || c.owner === n || (c.owners || []).includes(n)).map(c => c.id);
/* Put somebody on a customer, or take them off. The only writer. */
const setOn = (n, cid, on) => {
  const c = cust(cid); if (!c || !n) return;
  const t = new Set(c.team || []);
  if (on) t.add(n); else t.delete(n);
  c.team = [...t];
};

const myIds = () => (can('allCustomers') ? D.customers.map(c => c.id) : withPerson(meName()));
const visibleCustomers = () => D.customers.filter(c => myIds().includes(c.id));
const inScope = (cid) => myIds().includes(cid);

/* Kelvin's classification, 16 Sep 2026: decision maker · influencer · user ·
   blocker. Four words the team already says out loud, so nothing has to be
   translated in a meeting. The ORDER is the ranking: who needs you first.
   A blocker is urgent; a user is not — a user is who you protect the deal
   with. Classification is a closed list of four, so it is chips. */
const BANDS = ['Decision maker', 'Blocker', 'Influencer', 'User'];
const RISK = { 'Against us': 0, 'Undecided': 1, 'With us': 2 };
const bandOf = (p) => (BANDS.indexOf(p.b) >= 0 ? p.b : 'Influences');
const dayGap = (d) => Math.round((new Date(todayISO()) - new Date(d)) / 864e5);

/* How long an opportunity has been sitting in the stage it is in — the same
   number, read the same way, on both sides of the wire.

   The server already owns `age`: `stampStage` records when a deal entered its
   stage (and only when the stage actually moves), `deriveOppAges` turns that
   date into a number on the way out AND on the way to the file, and a row with
   no date falls back to when it was last touched. That machinery is correct and
   this function does not replace it.

   What was wrong was the WRITE side. The client had no notion of `stageAt` at
   all, so every opportunity it created, moved or captured arrived at the server
   with no such date — and a row whose stage cannot be dated is a row whose age
   the server has to guess from `updatedAt` on every single read. Recording the
   date when the client moves the stage is what makes the server's own rule
   work. Read through here so a screen never has to know whether the number in
   hand came from the server or was computed a moment ago. */
const oppAge = (o) => (o && o.stageAt ? Math.max(0, dayGap(o.stageAt)) : ((o && typeof o.age === 'number') ? o.age : 0));

/* ---------------------------------------------------------- who does what
   A Next Step is a business action, and an action has two different people on
   it, because doing the work and being answerable for it are different jobs:

     exec   — the Execution Owner. Who actually does it. This can be anyone
              relevant: the Primary BD, the Primary SA, a Product SA, or a
              supporting person who is not on the account team at all.
     track  — the Tracker. Who follows up until it is closed. This one is NOT
              free: §5 of the brief requires it to be the customer's Primary
              BD or Primary SA, and the server enforces exactly that. The
              reason is simple — a step whose follow-up sits with somebody who
              is not on the account is a step nobody is answerable for.

   The row used to carry a single `o`, which meant "the person who does it",
   and nothing else. That is how Scenario 3 (a Product SA executes, the
   Primary SA tracks) became impossible to record: one field cannot hold a
   relationship between two people.
   `stepExec` still reads the old `o` so a row written before this change is
   not lost — it is read as the execution owner, which is what it always was. */
const stepExec = (s) => (s && (s.exec || s.o)) || '';
const stepTrack = (s) => (s && (s.track || s.exec || s.o)) || '';
/* §5: the Tracker must be the customer's Primary BD or Primary SA. This is the
   client's copy of a rule the server also holds — the browser check exists so
   somebody is told at the form, not so the rule can be enforced here. Both
   names are trimmed and compared case-insensitively, because these are typed
   names the roster also stores as names, and "jason lim" is the same person. */
function trackOnCustomer(c, who){
  const n = (x) => String(x || '').trim().toLowerCase();
  const w = n(who);
  if (!c || !w) return false;
  return n(c.owner) === w || n(c.sa) === w;
}
/* A step is only "done" when it carries a completion date. Reading `s.done`
   as a truthy value would treat the empty string the seed and the forms write
   as complete, which would empty every list on the screen. */
const stepIsDone = (s) => !!(s && String(s.done || '').trim());
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAY_LONG = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const fmtDay = (d) => { const p = String(d).split('-'); return (+p[2]) + ' ' + MON[+p[1] - 1]; };
const fmtMon = (k) => MON[+k.slice(5, 7) - 1] + ' ' + k.slice(0, 4);

/* Overdue-ness is a fact about a date, not about the letters in a label.
   Reading it out of "4d" breaks the moment the same thing is written another
   way — "in 3d", "tomorrow", or a plain date — and then a late step quietly
   stops counting. One computed number, used everywhere. */
function stepDays(s){
  if (!s) return null;
  if (s.due) return Math.round((new Date(s.due + 'T00:00:00') - new Date(todayISO() + 'T00:00:00')) / 864e5);
  const m = /^(\d+)d$/.exec(String(s.w || ''));       /* "4d" means four days late */
  return m ? -Number(m[1]) : null;
}
/* A finished action nags nobody. Every "what needs you" list reads through
   these two, so one guard here is one guard everywhere. */
const stepOverdue = (s) => !stepIsDone(s) && (() => { const d = stepDays(s); return d != null && d < 0; })();
const stepSoon = (s) => !stepIsDone(s) && (() => { const d = stepDays(s); return d != null && d >= 0 && d <= 7; })();
function stepWhen(s){
  const d = stepDays(s);
  if (d == null) return s.w || 'no date';
  if (d === 0) return 'today';
  if (d === 1) return 'tomorrow';
  return d > 0 ? 'in ' + d + 'd' : Math.abs(d) + 'd';
}
/* A meeting's "when" is the same problem: it was stored as words, so it went
   stale overnight. It is one subtraction away from always being true. */
function meetWhen(m){
  if (!m || !m.d) return m && m.w ? m.w : '';
  const d = Math.round((new Date(m.d + 'T00:00:00') - new Date(todayISO() + 'T00:00:00')) / 864e5);
  if (d === 0) return 'Today';
  if (d === 1) return 'Tomorrow';
  if (d === -1) return 'Yesterday';
  if (d < 0) return Math.abs(d) + ' days ago';
  return 'in ' + d + ' days';
}
const NAME_PRE = /^(Dr|Ir|Kapt|Captain|Mr|Ms|Mrs|Haji|Hajah|Datuk|Dato|Datin|Tuan|Puan)\.?(\s*\(R\))?\s*/i;
/* We never invent a profile URL and we never scrape — both are worse than a
   search the user can see. LinkedIn has no open API for “give me this
   person’s profile”, so the product opens the search and gets out of the way. */
const liPeople  = (q) => 'https://www.linkedin.com/search/results/people/?keywords='   + encodeURIComponent(q);
const liCompany = (q) => 'https://www.linkedin.com/search/results/companies/?keywords=' + encodeURIComponent(q);
/* A full name finds almost nobody on LinkedIn — "Rachelle Binti Abdullah" is a
   profile field, not what people type. The search that works is the short
   form: the given name plus the company. Kelvin, 17 Sep 2026. */
const givenName = (n) => n.replace(NAME_PRE, '').trim().split(/\s+/)[0] || n.trim();
const liPersonQ = (p, c) => givenName(p.n) + ' ' + (c ? c.name : '');

/* ------------------------------------------------- the timeline's own kinds --
   A timeline entry is a fact that happened ("we met them on the 15th"), and
   its `k` says which KIND of fact — meeting, note, opportunity. §17 renamed
   the interaction collection and the entry it writes, so entries are now
   written as `k:'interaction'`. Entries written before the rename still say
   `meeting` and are NOT rewritten on read: this is display, and a record of
   what happened should read the same in a year as it did the day it was made.

   One predicate, because there were four separate `k === 'meeting'` tests and
   a rename that updates three of them is a rename that half-works. */
const TL_IS_INTERACTION = (k) => k === 'interaction' || k === 'meeting';
/* The label and the colour for each kind of entry, side by side, because a
   table nobody updates in one place is a table that drifts. Both fell behind
   the writers: `done` (an action finished — written by `stepdone`) and
   `customer` (the account opened — written by the seed) were being written
   into the record and were absent here, so the chip printed the raw key and
   the history of an account opened with "customer" and closed with "done".
   A kind still missing from this table is not an error, but it must not print
   its own lowercase key: it is capitalised instead, which is presentable
   enough to read and still visible enough to fix. */
const TL_KIND_L = { interaction:'Interaction', meeting:'Interaction', note:'Note',
                    opp:'Opportunity', step:'Action', done:'Done', customer:'Account' };
/* Blue is "we spoke", amber is "we owe this", green is "it moved or it
   landed", grey is context you filed. The colour is part of the reading —
   a wall of grey chips makes a year of work look like one year of notes. */
const TL_KIND_C = { interaction:'t-blue', meeting:'t-blue', note:'t-grey',
                    opp:'t-ok', step:'t-warn', done:'t-ok', customer:'t-grey' };
const tlKindLabel = (k) => TL_KIND_L[k]
  || String(k || 'event').replace(/^./, (ch) => ch.toUpperCase());
const tlKindClass = (k) => TL_KIND_C[k] || 't-grey';
/* The chip already names the kind, so a title that opens with the same word
   — "Action: …", "Done: …", "Opportunity created: …" — is the kind said
   twice in a row, and twice is one more than a reader needs. The record keeps
   its own text: this is display, and it costs nothing on disk. Only prefixes
   followed by a colon are taken off, so "Customer created" (which is the
   whole of its title) is left alone rather than emptied. */
const tlTitle = (t) => String(t || '')
  .replace(/^(Action|Done|Opportunity created|Opportunity)\s*:\s*/, '');

/* One line of context: the reason to care about this customer today. */
function custContext(c){
  return {
    lm: c.timeline.filter(t => TL_IS_INTERACTION(t.k))[0] || null,
    ns: D.steps.filter(s => s.c === c.id && !stepIsDone(s))[0] || null,
    to: oppsOf(c.id).slice().sort((a, b) => b.v - a.v)[0] || null
  };
}

/* Socials are FOUND, never invented: no official handle means no chip, and
   the fallback opens a search the user can see. */
/* The company's own website is the link we actually KNOW — it is the domain
   we hold, and it is where every other fact came from. Everything else is
   either found and cited, or not shown at all. */
/* YouTube and Instagram are no longer collected. A customer saved before that
   change still carries them, and showing a chip we no longer believe in is
   worse than dropping it here. */
const DROPPED_SOCIALS = ['YouTube', 'Instagram'];
function socialChips(c){
  const have = (c.links || []).filter(l => !DROPPED_SOCIALS.includes(l.n));
  const site = c.site ? `<a class="soc pri" href="https://${esc(c.site)}" target="_blank" rel="noopener"
      onclick="event.stopPropagation()" title="${esc(c.site)} — their own site, and the source behind the rest of this card">Website ↗</a>` : '';
  return site + have.map(l =>
    `<a class="soc" href="${esc(l.u)}" target="_blank" rel="noopener" onclick="event.stopPropagation()"
        title="${esc(l.n)} — found on ${esc(l.src || 'their own site')}, unverified">${esc(l.n)} ↗</a>`).join('')
    + (have.some(l => l.n === 'LinkedIn') ? '' :
      `<a class="soc" href="${esc(liCompany(c.name))}" target="_blank" rel="noopener"
          onclick="event.stopPropagation()" title="Their website is the link we know. This opens a search — we never invent a profile URL.">Find on LinkedIn ↗</a>`);
}
const nameWords = (n) => n.replace(NAME_PRE, '').split(/\s+/).filter(w => w.length > 2 && !/^\(r\)$/i.test(w));
const metWith = (c, p) => D.interactions.filter(m => m.c === c.id &&
  nameWords(p.n).some(w => m.att.toLowerCase().includes(w.toLowerCase())));
const lastMet = (c, p) => metWith(c, p).sort((a, b) => b.d.localeCompare(a.d))[0] || null;

/* One rule for people: who needs you first. Classification first — a blocker
   outranks an influencer — then stance, then name. Deterministic, so two
   people opening this tab see the same first row and argue about the customer
   rather than about the order. */
function rankPeople(list){
  return list.slice().sort((a, b) =>
    (BANDS.indexOf(bandOf(a)) - BANDS.indexOf(bandOf(b))) ||
    ((RISK[a.s] ?? 3) - (RISK[b.s] ?? 3)) ||
    a.n.localeCompare(b.n));
}

/* Every count in the rail is counted inside your scope. A number that
   includes rows you are not allowed to open is a lie you can see.
   The AI Tasks count is the §23 badge: how many asks are still running.
   Zero shows nothing — a badge that is always there says nothing. */
const navCount = (k) =>
  k === 'customers' ? visibleCustomers().length :
  k === 'people' ? visibleCustomers().reduce((a, c) => a + c.contacts.length, 0) :
  k === 'opportunities' ? Object.values(D.opps).filter(o => inScope(o.c)).length :
  k === 'interactions' ? D.interactions.filter(m => inScope(m.c)).length :
  k === 'products' ? (D.products || []).length :
  k === 'aitasks' ? (aiTaskList.filter(t => t && (t.state === 'queued' || t.state === 'processing')).length || null) : null;

function renderNav(){
  document.getElementById('nav').innerHTML = NAV
    .map(g => {
      const items = g.i.filter(n => n.k !== 'admin' || can('users'));
      if (!items.length) return '';
      return `<div class="grp">${g.g}</div>
      ${items.map(n => { const c = navCount(n.k);
        return `<button class="nav ${view.s === n.k ? 'on' : ''}" data-go="${n.k}">
        ${n.l}${c != null ? `<span class="c">${c}</span>` : ''}</button>`; }).join('')}`;
    }).join('');
  /* The theme switch rides with the nav so it re-draws with the app. */
  const foot = document.getElementById('railFoot');
  if (foot) foot.innerHTML = corgiToggleRow();
}

/* When you are looking through somebody else's eyes, say so on every screen.
   A demo that silently shows you the wrong thing is worse than no demo. */
/* ---------------------------------------------------------- leak control --
   Export is a button we can remove, so it is removed for everybody but an
   Admin — and the server refuses the request even if the button is forged.
   A screenshot is not a button, so it cannot be removed: the honest answer
   is attribution. Every screen carries the signed-in name and the time, so
   a photo of the screen is a photo that names its author. */
let watermarkOn = false;   /* Kelvin: off by default — the Admin data-guard toggle can still turn it back on. */

function drawWatermark(){
  const old = document.getElementById('wm');
  if (old) old.remove();
  document.body.classList.toggle('nowm', !watermarkOn);
  document.body.classList.toggle('canprint', can('export'));
  if (!watermarkOn || view.s === 'login') return;
  const who = (D.me && D.me.name) || 'Teh Bin Shun';
  const stamp = who + ' · ' + fmtDay(todayISO()) + ' ' + new Date().toTimeString().slice(0, 5) + ' · Waypoint';
  const cells = [];
  for (let row = -1; row < 14; row++)
    for (let col = -1; col < 5; col++)
      cells.push(`<span style="left:${col * 24}vw;top:${row * 9}vh">${esc(stamp)}</span>`);
  const el = document.createElement('div');
  el.className = 'wm'; el.id = 'wm'; el.setAttribute('aria-hidden', 'true');
  el.innerHTML = cells.join('');
  document.body.appendChild(el);
}

window.addEventListener('beforeprint', (e) => {
  if (!can('export')){ e.preventDefault(); toast('Printing is disabled — export is Admin-only.'); }
});

/* Refuse the keyboard shortcuts that turn a screen into a file for anybody
   who may not export. Friction, not a wall — hence the watermark too. */
document.addEventListener('keydown', (e) => {
  if (can('export')) return;
  const meta = e.metaKey || e.ctrlKey;
  if (meta && (e.key === 'p' || e.key === 'P')){
    e.preventDefault(); toast('Print is disabled — export is Admin-only.');
  }
  if (meta && e.shiftKey && (e.key === 's' || e.key === 'S')){
    e.preventDefault(); toast('Saving the page is disabled — export is Admin-only.');
  }
  /* Windows and Linux deliver the Print Screen key to the page; macOS does
     not, and no web page can stop an operating-system capture either way.
     The honest answer is to say so, not to imply a wall that is not there. */
  if (e.key === 'PrintScreen'){
    toast('A screenshot is taken by the operating system, not by this page — it cannot be blocked here. Every screen still carries your name and the time.');
  }
});

/* Right-click and drag are the two ways a picture of this data leaves without
   anybody pressing Print. Both are refused for a role that may not export.
   Typing is left alone: people paste e-mail addresses into this thing. */
document.addEventListener('contextmenu', (e) => {
  if (can('export')) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  e.preventDefault();
  toast('Copying images and saving them out is disabled — export is Admin-only.');
});
document.addEventListener('dragstart', (e) => {
  if (can('export')) return;
  if (e.target && String(e.target.tagName) === 'IMG') e.preventDefault();
});

function roleBanner(){
  if (guest) return `<div class="rban" data-tour="guestban">
    <span class="tag t-grey">Looking around</span>
    <span class="tiny">You have not signed in. This is the sample workspace — none of it is your team's
      data, and nothing you do here is kept.</span>
    <div class="spacer"></div>
    <button class="btn sm" data-act="endsession">Sign in</button>
  </div>`;
  if (asRole === 'admin') return '';
  const def = ROLE_DEFS.find(x => x.k === asRole);
  const writes = ['create','edit','del','commercial','technical','people','opp'].filter(c => can(c)).length;
  /* The lens is an Admin's tool. A BD who is a BD does not get to try on
     Admin — not greyed out, not warned about: simply not offered. */
  const switcher = isAdminSession() ? `
    <div class="seg sm">
      ${ROLE_DEFS.map(r => `<button data-as="${r.k}" class="${asRole === r.k ? 'on' : ''}">${r.l}</button>`).join('')}
    </div>
    <button class="btn sm" data-act="asadmin">Back to Admin</button>` : '';
  return `<div class="rban" data-tour="roleban">
    <span class="tag t-violet">${isAdminSession() ? 'Viewing as ' : ''}${esc(ROLE[asRole])}</span>
    <span class="tiny">${esc(def.d)}</span>
    <div class="spacer"></div>
    <span class="tiny muted">${visibleCustomers().length} of ${D.customers.length} customer${D.customers.length === 1 ? '' : 's'} ·
      ${asRole === 'manager' ? 'read-only' : writes ? writes + ' write rights' : 'no write rights'}</span>
    ${switcher}
  </div>`;
}

/* ------------------------------------------------------------------ screens */
/* ============================================================================ */
/*  Login — the brand surface.                                                 */
/*  The drawing is the product's own model: a handful of records, the          */
/*  relationships between them, and a signal travelling to the next action.    */
/*  Fixed coordinates on purpose — designed, not randomised.                   */
/* ============================================================================ */
const LG_N = [
  { x: 62, y: 292, r: 5.5, big: 1 }, { x: 128, y: 206, r: 4 },   { x: 58,  y: 128, r: 3.4 },
  { x: 198, y: 268, r: 4.6 },        { x: 208, y: 118, r: 3.4 }, { x: 282, y: 186, r: 6.5, big: 1 },
  { x: 352, y: 108, r: 3.6 },        { x: 358, y: 278, r: 4.6 }, { x: 432, y: 198, r: 5.5, big: 1 },
  { x: 474, y: 300, r: 3.4 },        { x: 462, y: 88,  r: 3.2 }, { x: 148, y: 356, r: 3.6 },
  { x: 302, y: 358, r: 4.2 },        { x: 388, y: 388, r: 3.2 }, { x: 246, y: 60,  r: 3 }
];
const LG_E = [[0,1],[1,3],[1,2],[2,4],[3,7],[3,4],[4,5],[5,6],[5,8],[5,7],[8,9],[8,10],
              [6,10],[7,12],[12,13],[11,0],[11,12],[4,14],[14,6],[9,12]];
const LG_SIG = [[0,1,3,7,12,13],[2,4,5,8,9],[14,6,5,3,11]];

const LG_MARK = `<svg width="19" height="19" viewBox="0 0 24 24" fill="none">
  <path d="M3 7l4.5 10L12 9l4.5 8L21 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="12" cy="9" r="2.3" fill="currentColor"/></svg>`;

function loginNet(){
  const edges = LG_E.map(([a, b]) => {
    const p = LG_N[a], q = LG_N[b];
    return `<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}"
      stroke="rgba(255,255,255,.14)" stroke-width="1"/>`;
  }).join('');

  const nodes = LG_N.map((n, i) => `
    <g class="lg-n" style="animation-delay:${(i * 55)}ms">
      ${n.big ? `<circle cx="${n.x}" cy="${n.y}" r="${n.r + 8}" fill="url(#lgglow)"/>` : ''}
      <circle class="${n.big ? 'lg-big' : ''}" cx="${n.x}" cy="${n.y}" r="${n.r}"
        fill="${n.big ? '#8FC0FF' : '#FFFFFF'}" opacity="${n.big ? 1 : .72}"/>
    </g>`).join('');

  /* three signals, slow and staggered — momentum, not traffic */
  const sigs = LG_SIG.map((route, i) => {
    const d = route.map((k, j) => `${j ? 'L' : 'M'}${LG_N[k].x} ${LG_N[k].y}`).join(' ');
    const dur = 13 + i * 3;
    return `<g opacity=".95">
      <circle r="7" fill="rgba(143,192,255,.20)"/>
      <circle r="2.9" fill="#BBD7FF"/>

function enterApp(asGuest){
  guest = !!asGuest;
  if (guest) asRole = 'manager';   /* sight, no pen — the only honest posture
                                      for someone who never authenticated */
  else if (D.me && D.me.role) adoptRole();
  /* Today is the default, not the destination. A reload on `#/customers/c123`
     has to come back to that customer — that is the whole point of having an
     address — so the hash is read before the screen is chosen. `navigateFromHash`
     has already checked the role and the scope; a hash that names something
     this user cannot see leaves us on Today, which is the honest landing. */
  if (!navigateFromHash()) view = { s: 'today', id: null, tab: 'brief', cview: 'board' };
  /* From here on the address bar mirrors the app. It is switched on BEFORE the
     first render, not after it, because navigating writes `view` directly and
     then calls `render()` — so a flag cleared afterwards would be on for one
     frame and off for every click that followed. */
  routeSilent = false;
  render();
}
