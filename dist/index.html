/* ------------------------------------------------------------ calendar
   §19 asked for a time view of the work, and forbade decoration. This grid
   is not a new place facts live: every dot on it is a record that already
   exists, opened where it already opens — a next step on its due date, an
   interaction on its date, an open opportunity on its close date. The click
   is the whole point. A calendar you can look at but not enter is a
   picture, and the brief has no time for pictures.
   The overdue work is deliberately NOT left behind the month you are
   looking at: it is named above the grid, the same facts Today names, so
   the calendar never reads quieter than the work actually is.
   The month on screen is a conversation with the page, not a place — it
   stays out of the URL for the same reason the search boxes do, and every
   fresh open starts on the month you are in. */
let calMonth = null;   /* 'YYYY-MM', or null for the month you are in */

function calYm(){
  if (!calMonth){
    const n = new Date();
    calMonth = n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0');
  }
  return calMonth;
}

/* Everything dated in the month, by day. A finished step nags nobody, and
   a parked deal closes nothing — the same two guards every list reads. */
function calByDay(ym){
  const byDay = {};
  const add = (iso, item) => { (byDay[iso] = byDay[iso] || []).push(item); };
  for (const s of D.steps || []){
    if (stepIsDone(s) || !s.due || !s.due.startsWith(ym)) continue;
    add(s.due, { k: 'step', c: s.c, t: s.t, late: stepOverdue(s) });
  }
  for (const m of D.interactions || []){
    if (!m.d || !m.d.startsWith(ym)) continue;
    add(m.d, { k: 'meet', c: m.c, t: m.t });
  }
  for (const o of Object.values(D.opps || {})){
    if (!D.stages.includes(o.stage) || !o.close || !o.close.startsWith(ym)) continue;
    add(o.close, { k: 'close', c: o.c, t: o.t });
  }
  return byDay;
}

/* One dot-row on a day. It names the record it opens — a step or a meeting
   on the account's timeline, a close date on its opportunity tab — so the
   click is the promise and the promise is kept. */
function calItem(it){
  const colour = it.k === 'step'
    ? (it.late ? 'var(--risk)' : 'var(--warn)')
    : it.k === 'meet' ? 'var(--blue)' : 'var(--violet)';
  const mark = it.k === 'step' ? '▲' : it.k === 'meet' ? '●' : '✦';
  return `<button class="row" data-cgo="${esc(it.c)}" data-cgotab="${it.k === 'close' ? 'opportunities' : 'timeline'}"
    style="gap:5px;padding:2px 4px;width:100%;border:0;background:none;cursor:pointer;text-align:left;align-items:center;border-radius:6px"
    title="${esc(it.t)} — opens the ${it.k === 'close' ? 'opportunities' : 'timeline'} of ${esc((cust(it.c) || {}).name || 'the account')}">
    <span class="tiny" style="flex:0 0 auto;color:${colour};font-size:10px;line-height:1">${mark}</span>
    <span class="tiny" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.t)}</span>
  </button>`;
}

function screenCalendar(){
  const ym = calYm();
  const [y, m] = ym.split('-').map(Number);
  /* Monday first — the working week is the frame the team plans in. */
  const lead = (new Date(y, m - 1, 1).getDay() + 6) % 7;
  const count = new Date(y, m, 0).getDate();
  const byDay = calByDay(ym);
  const today = todayISO();
  const overdue = (D.steps || []).filter(stepOverdue);
  const undated = (D.steps || []).filter(s => !stepIsDone(s) && stepDays(s) == null);
  let dated = 0;
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push('<div></div>');
  for (let d = 1; d <= count; d++){
    const iso = ym + '-' + String(d).padStart(2, '0');
    const items = byDay[iso] || [];
    dated += items.length;
    const isToday = iso === today;
    cells.push(`
      <div style="border:1px solid var(--line);border-radius:8px;padding:5px 4px;min-height:88px;overflow:hidden;${isToday ? 'outline:2px solid var(--blue);outline-offset:-2px' : ''}">
        <div class="tiny" style="font-weight:${isToday ? 700 : 500};color:${isToday ? 'var(--blue)' : 'var(--ink-2)'};margin-bottom:2px;padding-left:2px">${d}</div>
        ${items.slice(0, 3).map(calItem).join('')}
        ${items.length > 3 ? `<div class="tiny muted" style="padding:1px 4px">+${items.length - 3} more</div>` : ''}
      </div>`);
  }
  return `
  <div class="phead">
    <div>
      <h1>Calendar</h1>
      <p class="sub">${MON[m - 1]} ${y} · the dated work, on the days it is dated</p>
    </div>
    <div class="spacer"></div>
    <div class="row" style="gap:6px">
      <button class="btn sm" data-cal="prev" title="The month before">‹</button>
      <button class="btn sm" data-cal="today" title="Back to the month you are in">This month</button>
      <button class="btn sm" data-cal="next" title="The month after">›</button>
    </div>
  </div>

  ${overdue.length ? `
  <div class="card" style="padding:0;margin-bottom:var(--s5)">
    ${overdue.slice(0, 5).map(s => `
      <button class="row" data-cgo="${esc(s.c)}"
        style="gap:9px;padding:9px var(--s4);border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;width:100%;text-align:left;align-items:center"
        title="Opens the timeline of ${esc((cust(s.c) || {}).name || 'the account')}">
        <span class="dot" style="background:var(--risk)"></span>
        <div style="min-width:0;flex:1">
          <div style="font-size:13px;font-weight:500">${esc(s.t)}</div>
          <div class="tiny muted">${esc((cust(s.c) || {}).name || '')} · ${esc(stepExec(s) || 'nobody named')}</div>
        </div>
        <span class="tag t-risk">due ${esc(fmtDay(s.due))}</span>
      </button>`).join('')}
    ${overdue.length > 5 ? `<div class="tiny muted" style="padding:7px var(--s4)">${overdue.length - 5} more overdue — Today carries the full list.</div>` : ''}
  </div>` : ''}

  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:var(--s3)">
    ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => `<div class="tiny muted" style="text-align:center;font-weight:600">${d}</div>`).join('')}
  </div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">
    ${cells.join('')}
  </div>

  ${!dated && !overdue.length ? `<div class="empty" style="padding:var(--s5) var(--s4);margin-top:var(--s4)">
    Nothing dated in ${MON[m - 1]} ${y}. The work is not lost — it is on Today, undated —
    but a calendar with no dates cannot help you keep them.</div>` : ''}
  ${undated.length ? `
  <div class="card" style="padding:0;margin-top:var(--s4)">
    ${undated.slice(0, 5).map(s => `
      <button class="row" data-cgo="${esc(s.c)}"
        style="gap:9px;padding:8px var(--s4);border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;width:100%;text-align:left;align-items:center"
        title="Opens the timeline of ${esc((cust(s.c) || {}).name || 'the account')}">
        <span class="dot" style="background:var(--ink-0)"></span>
        <div style="min-width:0;flex:1">
          <div style="font-size:13px;font-weight:500">${esc(s.t)}</div>
          <div class="tiny muted">${esc((cust(s.c) || {}).name || '')} · ${esc(stepExec(s) || 'nobody named')}</div>
        </div>
        <span class="tag t-grey">no date</span>
      </button>`).join('')}
    ${undated.length > 5 ? `<div class="tiny muted" style="padding:7px var(--s4)">${undated.length - 5} more without a date.</div>` : ''}
    <div class="tiny muted" style="padding:7px var(--s4)">Nobody can be reminded of a day that was never set — give these a date and they take their place on the grid.</div>
  </div>` : ''}`;

/* An empty book has to show the way out of being empty. Panels that read
   "0 customers · RM 0" and offer nothing are a dead end on the one screen a
   new team lands on, and a dead end is the worst first impression there is. */
function firstUseCard(){
  return `<div class="card" data-tour="firstuse" style="margin-bottom:var(--s6)">
    ${mascot('peek', 'm-peek')}
    <div class="row" style="align-items:flex-start">
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:600">Nothing in the book yet</div>
        <p class="tiny" style="margin:6px 0 0;max-width:70ch;color:var(--ink-2)">
          Start with one customer. A name and a domain is enough — the rest can be filled in
          from their own website, or left until you know it. Everything after that hangs off
          this record: the people you meet, the interactions, what hurts, the opportunity.
        </p>
      </div>
      <div class="spacer"></div>
      ${can('create')
        ? '<button class="btn pri" data-act="newcust">+ New customer</button>'
        : '<span class="tag t-grey">An administrator adds the first customer</span>'}
    </div>
  </div>`;
}

/* One nudge, computed. It used to name a customer and an amount that were
   typed in once; if that record was deleted the page threw. Now it is the
   customer you have left longest, and if there is none, there is no nudge. */
function proactiveNudge(){
  const ranked = visibleCustomers().map(c => {
    const last = D.interactions.filter(m => m.c === c.id).sort((a, b) => b.d.localeCompare(a.d))[0];
    const o = oppsOf(c.id).slice().sort((a, b) => oppAge(b) - oppAge(a))[0];
    return { c, last, o, days: last ? Math.max(0, dayGap(last.d)) : null };
  }).filter(x => x.days === null || x.days > 14).sort((a, b) => (b.days ?? 1e6) - (a.days ?? 1e6))[0];
  if (!ranked) return '';
  const { c, o, days } = ranked;
  return `<div class="note" style="margin-top:var(--s4)">
      <strong>Proactive — one nudge only.</strong> ${esc(c.name)}: ${days === null ? 'no meeting has ever been logged' : 'no contact in ' + days + ' days'}${o ? ' on an opportunity worth ' + cm(o.v) : ''}.
      ${o ? 'It has been ' + oppAge(o) + ' days in ' + esc(o.stage) + '.' : ''}
    </div>`;
}

function screenCustomers(){
  /* Scope first, then everything else. A BD never sees a customer they are
     not on — not greysed out, not in the count, not in the total. */
  const vis = visibleCustomers();
  const rows = vis.filter(custMatches).map(c => {
    const ops = oppsOf(c.id);
    const val = ops.reduce((a,o) => a + o.v, 0);
    return { c, ops, val };
  }).sort((a, b) => {
    /* The default order is "who needs you" — overdue first, then weighted
       pipeline. A seller with 30 customers may need a different lens. */
    if (custSort === 'pipeline') return b.val - a.val;
    if (custSort === 'name') return a.c.name.localeCompare(b.c.name);
    if (custSort === 'activity') {
      const la = (a.c.timeline || [])[0]?.d || '';
      const lb = (b.c.timeline || [])[0]?.d || '';
      return lb.localeCompare(la);
    }
    const oa = D.steps.filter(x => x.c === a.c.id && stepOverdue(x)).length;
    const ob = D.steps.filter(x => x.c === b.c.id && stepOverdue(x)).length;
    if (oa !== ob) return ob - oa;
    return b.val - a.val;
  });

  if (view.cview === 'list'){
    const open = rows.reduce((a, r) => a + r.val, 0);
    const weighted = rows.reduce((a, r) => a + r.ops.reduce((x, o) => x + o.v * o.p / 100, 0), 0);
    const atRisk = rows.filter(r => r.c.health === 'At risk').length;
    const overdue = D.steps.filter(s => s.from === 'us' && stepOverdue(s) && inScope(s.c)).length;

    return `

/* Ten chips that did nothing were worse than three controls that do. A filter
   you click and nothing happens teaches people to distrust the whole screen, so
   the choice was to wire them or lose them: search, industry, stance. Clear
   only shows once something is narrowed — a bar that is always asking you to
   undo things is just noise. */
let custF = { q:'', ind:'', st:'' };
let custShowAll = false;   /* the list caps at 50; "Show all" lifts it */

function custMatches(c){
  if (custF.ind && c.industry !== custF.ind) return false;
  if (custF.st && c.stance !== custF.st) return false;
  const q = custF.q.trim().toLowerCase();
  if (!q) return true;
  return (c.name + ' ' + c.industry + ' ' + c.hq + ' ' + c.owner).toLowerCase().includes(q);
}

function filterBar(){
  const inds = [...new Set(D.customers.map(c => c.industry))].filter(Boolean).sort();

/* ============================================================================ */
/*  Watch — what happened outside the account that changes what we do inside   */
/*  it. This is the one place a model reads the outside world, and it is the   */
/*  most dangerous place to let one write. So: scanning is retrieval (fetch,   */
/*  match the company, match our competitor list), the model is only allowed   */
/*  to triage and to say WHY it matters, every item carries its source, and    */
/*  nothing is trusted until a human confirms it. A wrong "your competitor     */
/*  signed an MOU" is a sentence you cannot take back in a customer meeting.   */
/* ============================================================================ */
/* Colour here is a consequence channel, not a category channel. What a signal
   *is* — funding, a product launch, a hire — is a label, and labels are read
   as text. What it *does to you* is the only thing worth colour: a competitor
   move or a security incident can cost you the deal, so those two stay red.
   Everything else goes neutral. Violet is reserved for AI-produced content and
   must never appear on a human-typed category again. */
const WATCH_KIND = {
  competitor:   { l:'Competitor move', cls:'t-risk' },
  regulatory:   { l:'Regulatory',      cls:'t-grey' },
  funding:      { l:'Money',           cls:'t-grey' },
  people:       { l:'People move',     cls:'t-grey' },
  tender:       { l:'Tender',          cls:'t-grey' },
  /* The seller asked for the whole surface of business signals — a product
     launch or a transformation programme is often the earliest signal there
     is. Same closed list the server validates against. */
  ai:           { l:'AI',              cls:'t-grey' },
  cloud:        { l:'Cloud / IT',      cls:'t-grey' },
  transformation:{l:'Transformation',  cls:'t-grey' },
  product:      { l:'Product',         cls:'t-grey' },
  expansion:    { l:'Expansion',       cls:'t-grey' },
  strategy:     { l:'Strategy',        cls:'t-grey' },
  investment:   { l:'Investment',      cls:'t-grey' },
  partnership:  { l:'Partnership',     cls:'t-grey' },
  security:     { l:'Security',        cls:'t-risk' },
  note:         { l:'Signal',          cls:'t-grey' }
};
/* Confirmed and dismissed are stored on the record and saved, not held in
   memory. A human decision that evaporates on reload is not a decision — the
   next person opens the same unverified row and starts again. */
let showWatchAll = false;
let watchAdd = false;

const watchOf = (cid) => D.watch
  .filter(w => w.c === cid && w.st !== 'hidden')
  .sort((a, b) => String(b.d).localeCompare(String(a.d)));

/* The only two kinds that can lose us the deal. Everything else is context. */
const threatsOf   = (cid) => watchOf(cid).filter(w => w.k === 'competitor' || w.k === 'regulatory');
const openThreats = (cid) => threatsOf(cid).filter(w => w.st !== 'confirmed');

function watchRow(w, withCustomer){

/* -------------------------------------------------------------------------- */
/*  Three model services over a single record, and one human-only act.          */
/*  Brief and news READ the customer's own site; the model only drafts over     */
/*  what was really fetched, and everything it touches is labelled a draft.     */
/*  Deleting a customer is the one act with no model in it at all — and the     */
/*  only one that needs the administrator's typed name beside it.               */
/* -------------------------------------------------------------------------- */
let aiBusy = false;
    newsLead = null;   /* retired: the news card on the Brief tab replaced the lead box */
let delCust = null;

const hostOf = (u) => { try { return new URL(u).hostname; } catch { return String(u); } };
const shortTxt = (s, n) => { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; };

function aiReady(c){
  return !c.confidential && !!(aiState && aiState.configured && aiState.reachable);
}

async function aiCompanyBrief(cid){
  const c = cust(cid);
  if (!c || !can('edit') || aiBusy) return;
  if (!aiReady(c)){ toast('No model endpoint is answering.'); return; }
  aiBusy = true;
  toast('Asking the model — this can take a minute or two.');
  try {
    const res = await fetch('/api/ai/brief', { method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: c.name, site: c.site, industry: c.industry, hq: c.hq, people: c.people }) });
    const b = await res.json();
    if (!res.ok || !b.ok){ toast('No draft — ' + (b.error || 'the model did not answer')); return; }
    c.aiBrief = { who: b.who, fit: b.fit, at: todayISO(), sources: b.sources || [] };
    audit('ai', 'Company brief drafted', c.name, '-', 'model draft — unverified');
    syncSave(); render();
    toast('Draft ready · it stays unverified until you confirm it.');
  } catch {
    toast('The model could not be reached.');
  } finally { aiBusy = false; }
}

async function aiCollectNews(cid){
  const c = cust(cid);
  if (!c || !can('log') || aiBusy) return;
  if (!aiReady(c)){ toast('No model endpoint is answering.'); return; }
  aiBusy = true;
  toast('Searching public news for ' + c.name + ' — this can take a minute or two.');
  try {
    const res = await fetch('/api/ai/news', { method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: c.name, site: c.site || '' }) });
    const b = await res.json();
    if (!res.ok || !b.ok){ toast('Nothing collected — ' + (b.error || 'the news search did not answer')); return; }
    /* The top five are kept on the customer, so the next person who opens this
       page sees them instantly instead of waiting a minute for a search. A
       cached result says when it was taken; it never pretends to be live. */
    c.newsCache = { at: todayISO(), items: (b.items || []).slice(0, 5) };
    audit('ai', 'Market news collected', c.name, '-', (b.items || []).length + ' items found');
    syncSave();
    render();
  } catch {
    toast('The model could not be reached.');
  } finally { aiBusy = false; }
}

/* ------------------------------------------------------------ minutes (MOM)
   Paste the minutes, get the facts. The model extracts; the person decides:
   every concern, decision, commitment and next step is a suggestion with its
   own accept button, the summary is written to the meeting only on Save, and
   the raw minutes are never stored - the whole point is not to dump them. */
let momState = null;   /* { mid, text, out, picked:[], created:[], oppsMade:[], oppsDropped:[] } */

/* The minutes panel's header, on its own so a sheet that borrowed the veil
   (#75's opportunity confirm) can put the panel back without resetting it —
   momState still holds the results, so only the chrome needs rebuilding.
   #79: the same panel is the paste-notes flow — mid empty means the paste
   belongs to the customer, not to any one meeting. */
function momHeader(mid){
  const m = mid ? ((D.interactions || []).find(x => x.id === mid) || {}) : {};
  const c = momState && momState.cid ? cust(momState.cid) : null;
  const title = mid ? 'Read the minutes' : 'Paste notes';
  const sub = mid ? (m.t || '') : (c ? c.name : '');
  document.querySelector('#capVeil .sheet-h').innerHTML = `
    <strong style="font-size:14.5px">${title}</strong>
    <span class="tiny muted">${esc(sub)}</span><div class="spacer"></div>
    <button class="btn sm" id="capClose7">Close</button>`;
  document.getElementById('capClose7').onclick = closeCapture;
}

function openMom(mid){
  const m = (D.interactions || []).find(x => x.id === mid);
  if (!m) return;
  momState = { mid, cid: m.c, text: '', out: null, picked: [], created: [], oppsMade: [], oppsDropped: [], painsPicked: [], painsMade: [] };
  const veil = document.getElementById('capVeil');
  veil.classList.add('on');
  momHeader(mid);
  drawMom();
}

/* #79 (§14): the same reading, without the meeting. The paste belongs to the
   customer's page — notes that never became a meeting still carry actions,
   pains and hints worth keeping, and the reader stays in control of every
   line that reaches the book. */
function openNotes(cid){
  const c = cust(cid);
  if (!c) return;
  momState = { mid: '', cid, text: '', out: null, picked: [], created: [], oppsMade: [], oppsDropped: [], painsPicked: [], painsMade: [] };
  const veil = document.getElementById('capVeil');
  veil.classList.add('on');
  momHeader('');
  drawMom();
}

function drawMom(){
  const b = document.getElementById('capBody');
  if (!b || !momState) return;
  const m = (D.interactions || []).find(x => x.id === momState.mid) || {};
  const out = momState.out;
  /* #79: mid empty means the paste belongs to the customer's page, not to a
     meeting — the same reading, the same ticks, and no interaction to save
     a summary into. */
  const cid = momState.cid || m.c || '';
  const c = cid ? cust(cid) : null;
  if (!out){
    b.innerHTML = `
      <p class="tiny muted" style="margin-top:0">${momState.mid
        ? `Paste the minutes of <b>${esc(m.t)}</b>. The model reads them once and proposes the summary, the outcome, the requirements, the next steps and any opportunity it hints at - nothing is written until you save, and the raw text is never stored.`
        : `Paste any notes you have on <b>${esc(c ? c.name : 'this customer')}</b> - they do not have to be minutes. The model reads them once and proposes the action items, the pain points and any opportunity they hint at - nothing is written until you create it, and the raw text is never stored.`}</p>
      <textarea id="momT" rows="9" style="${FLD};width:100%;min-height:170px;resize:vertical"
        placeholder="e.g. Attended: their CTO, Head of Billing. They opened with the renewal timeline...">${esc(momState.text)}</textarea>
      <div class="row" style="margin-top:var(--s4)">
        <button class="btn pri" id="momGo">Read this</button>
        <div class="spacer"></div>
        <span class="tiny muted">Takes half a minute or so.</span>
      </div>`;
    const t = document.getElementById('momT');
    if (t) t.oninput = () => { momState.text = t.value; };
    document.getElementById('momGo').onclick = () => runMom(momState.mid);
    return;
  }
  const chip = (arr, cls, label) => arr.length ? `
    <div style="margin-top:var(--s3)">
      <div class="tiny" style="font-weight:600;margin-bottom:4px">${label}</div>
      ${arr.map(x => `<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)">
        <span class="tag ${cls}" style="flex:0 0 auto">${esc(label.split(' ')[0])}</span>
        <span style="font-size:13px;flex:1">${esc(x)}</span>
      </div>`).join('')}
    </div>` : '';
  /* §14's example, as the panel's own opening line: what the reading found,
     counted, and the reminder that nothing moves until the reader says so. */
  const nAct = (out.steps || []).length, nPain = (out.pains || []).length, nOpp = (out.opps || []).length;
  const plural = (n, w) => n === 1 ? n + ' ' + w : n + ' ' + w + 's';
  const foundBits = [plural(nAct, 'possible action item'), plural(nPain, 'pain point'), plural(nOpp, 'potential opportunity')]
    .filter((_, i) => [nAct, nPain, nOpp][i] > 0);
  const foundLine = foundBits.length
    ? 'I found ' + foundBits.join(', ') + ' - review and keep what is true.'
    : 'The reading found nothing worth creating - the text stays yours.';
  b.innerHTML = `
    <div class="row" style="margin-bottom:var(--s2)">
      <span class="ai-mark model">AI</span><span class="tiny muted">${esc(foundLine)}${momState.mid ? ' Check each line, then save what is true.' : ''}</span>
    </div>
    ${momState.mid ? `
    <div class="card" style="padding:var(--s4)">
      <div class="tiny" style="font-weight:600;margin-bottom:4px">Summary (will be written to the interaction)</div>
      <p style="font-size:13.5px;margin:0 0 var(--s3)">${esc(out.summary || '-')}</p>
      <div class="tiny" style="font-weight:600;margin-bottom:4px">Outcome</div>
      <p style="font-size:13.5px;margin:0">${esc(out.outcome || '-')}</p>
    </div>` : ''}
    ${chip(out.concerns, 't-warn', 'Customer concerns')}
    ${chip(out.requirements, 't-grey', 'Requirements')}
    ${chip(out.decisions, 't-blue', 'Decisions')}
    ${chip(out.commitments, 't-ok', 'Commitments')}
    <div style="margin-top:var(--s4)">
      <div class="tiny" style="font-weight:600;margin-bottom:4px">Suggested next steps - tick the ones to create</div>
      ${(out.steps || []).length ? out.steps.map((st, i) => {
        const made = momState.created.includes(i);
        const rel = !made && c ? momMatchOpp(c, st.opp) : null;
        return `
        <div class="row" style="padding:8px 0;border-bottom:1px solid var(--line);align-items:flex-start">
          <input type="checkbox" data-mchk="${i}"${momState.picked.includes(i) ? ' checked' : ''}${made ? ' disabled' : ''}
            style="flex:0 0 auto;margin-top:3px" />
          <span class="tag t-grey" style="flex:0 0 auto">${esc(st.kind)}</span>
          <span class="pr-main">
            <span class="pr-n" style="font-weight:500${made ? ';color:var(--ink-3)' : ''}">${esc(st.t)}${made ? ' · created' : ''}</span>
            <span class="pr-t">${st.from === 'customer' ? 'in their court' : 'our move'}${st.due ? ' · due ' + esc(st.due) : ''}${st.exec ? ' · on ' + esc(st.exec) : ''}${rel ? ' · ties to ' + esc(rel.t) : ''}</span>
          </span>
        </div>`;
      }).join('')
      : '<div class="tiny muted">The minutes did not carry a next step worth recording.</div>'}
      ${(out.steps || []).length ? `
      <div class="row" style="margin-top:var(--s3)">
        <button class="btn pri" id="momCreate"${momState.picked.filter((i) => !momState.created.includes(i)).length ? '' : ' disabled'}>Create Selected Next Steps</button>
        <span class="tiny muted">Nothing is written until you press it.</span>
      </div>` : ''}
    </div>
    ${(out.pains || []).length ? `
    <div style="margin-top:var(--s4)">
      <div class="tiny" style="font-weight:600;margin-bottom:4px">Pain points - tick the ones to record on the customer</div>
      ${out.pains.map((p, pi) => {
        const made = (momState.painsMade || []).includes(pi);
        return `
        <div class="row" style="padding:8px 0;border-bottom:1px solid var(--line);align-items:flex-start">
          <input type="checkbox" data-pchk="${pi}"${(momState.painsPicked || []).includes(pi) ? ' checked' : ''}${made ? ' disabled' : ''}
            style="flex:0 0 auto;margin-top:3px" />
          <span class="tag t-warn" style="flex:0 0 auto">Pain</span>
          <span style="flex:1;font-size:13px${made ? ';color:var(--ink-3)' : ''}">${esc(p)}${made ? ' · recorded' : ''}</span>
        </div>`;
      }).join('')}
      <div class="row" style="margin-top:var(--s3)">
        <button class="btn pri" id="momPains"${(momState.painsPicked || []).filter((i) => !(momState.painsMade || []).includes(i)).length ? '' : ' disabled'}>Add the ticked pain points</button>
        <span class="tiny muted">They reach the customer's record only when you press it.</span>
      </div>
    </div>` : ''}
    ${(out.opps || []).length ? `
    <div style="margin-top:var(--s4)">
      <div class="tiny" style="font-weight:600;margin-bottom:4px">Potential opportunities - what the minutes hint at</div>
      ${out.opps.map((o, oi) => {
        /* §10: the user can create it or dismiss it — both are the reader's
           call, never the model's. A dismissed hint is dropped from the panel
           only; nothing was ever written for it, so there is nothing to undo. */
        if ((momState.oppsDropped || []).includes(oi)) return '';
        const made = (momState.oppsMade || []).includes(oi);
        return `
        <div class="card" style="padding:var(--s3);margin-bottom:var(--s2)">
          <div style="font-weight:500;font-size:13.5px">${esc(o.t)}</div>
          <div class="tiny muted" style="margin-top:4px">Why this may be an opportunity: ${esc(o.why)}</div>
          <div class="tiny muted" style="margin-top:2px">Source: these minutes - the customer has not confirmed this demand.</div>
          <div class="row" style="margin-top:8px;gap:8px;align-items:center">
            ${made
              ? '<span class="tiny" style="font-weight:600">created</span><span class="tiny muted">it is in the pipeline now - amounts and dates are set on the opportunity itself.</span>'
              : `<button class="btn sm pri" data-mopp="${oi}">Create Opportunity</button>
                 <button class="btn sm" data-moppdrop="${oi}">Dismiss</button>
                 <span class="tiny muted">the choice is yours - the model only noticed the hint.</span>`}
          </div>
        </div>`; }).join('')}
    </div>` : ''}
    ${aiState && aiState.configured && aiState.reachable ? taskAskBox('momProducts-' + esc(momState.mid || momState.cid), 'Suggest products from these minutes',
      '§13: picked only from the Product Reference — nothing is attached and no SA is contacted.',
      { action: 'suggest-products', targetId: cid,
        question: 'Which products from the Reference fit what these minutes say?' }) : ''}
    <div class="sheet-f" style="margin:var(--s4) calc(-1 * var(--s5)) calc(-1 * var(--s5))">
      <button class="btn" id="momBack">Edit the text</button>
      <div class="spacer"></div>
      ${momState.mid ? '<button class="btn pri" id="momSave">Save to the interaction</button>' : '<span class="tiny muted">No meeting to save a summary into - create what you keep below the reading.</span>'}
    </div>`;
  document.getElementById('momBack').onclick = () => { momState.out = null; drawMom(); };
  const msBtn = document.getElementById('momSave');
  if (msBtn) msBtn.onclick = () => saveMom(momState.mid);
  const mk = document.getElementById('momCreate');
  if (mk) mk.onclick = () => momCreateSelected(momState.mid);
  const mp = document.getElementById('momPains');
  if (mp) mp.onclick = () => momCreatePains();
  b.querySelectorAll('[data-mchk]').forEach(el => el.onchange = () => momPick(+el.dataset.mchk));
  b.querySelectorAll('[data-pchk]').forEach(el => el.onchange = () => momPickPain(+el.dataset.pchk));
  /* §10's two doors on a hinted opportunity: create (through the confirm
     sheet, §26) or dismiss (a panel-only drop — the hint was never a record). */
  b.querySelectorAll('[data-mopp]').forEach(el => el.onclick = () => openOppConfirm(momState.mid, +el.dataset.mopp));
  b.querySelectorAll('[data-moppdrop]').forEach(el => el.onclick = () => {
    momState.oppsDropped = [...(momState.oppsDropped || []), +el.dataset.moppdrop];
    drawMom();
  });
}

async function runMom(mid){
  if (!momState) return;
  const text = (document.getElementById('momT') || {}).value || momState.text;
  if (text.trim().length < 40){ toast('Paste the notes first - a couple of lines is not enough.'); return; }
  momState.text = text;
  document.getElementById('capBody').innerHTML = `<div class="row"><span class="ai-mark model">AI</span>
    <span class="tiny muted" style="margin-left:8px">Reading ${momState.mid ? 'the minutes' : 'the notes'}...</span></div>`;
  try {
    const res = await fetch('/api/ai/mom', { method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
    const b = await res.json();
    if (!res.ok || !b.ok){
      document.getElementById('capBody').innerHTML = `<div class="empty">${esc(b.error || 'The text could not be read.')}</div>
        <div class="sheet-f" style="margin:var(--s4) calc(-1 * var(--s5)) calc(-1 * var(--s5))">
          <button class="btn" id="momBack2">Back</button></div>`;
      document.getElementById('momBack2').onclick = () => { momState.out = null; drawMom(); };
      return;
    }
    momState.out = b;
    /* §9: every suggested step starts ticked — the model only proposes what
       the minutes support, so the reader's job is to drop, not to hunt. */
    momState.picked = (b.steps || []).map((_, i) => i);
    momState.created = [];
    momState.oppsMade = [];
    momState.oppsDropped = [];
    /* §9's rule for pains too: every one the text supports starts ticked,
       and the reader's job is to drop, not to hunt. */
    momState.painsPicked = (b.pains || []).map((_, i) => i);
    momState.painsMade = [];
    drawMom();
  } catch {
    toast('The model could not be reached.');
    momState.out = null; drawMom();
  }
}

function momPick(i){
  if (!momState || !momState.out) return;
  if (momState.created.includes(i)) return;
  momState.picked = momState.picked.includes(i)
    ? momState.picked.filter((x) => x !== i) : [...momState.picked, i];
  drawMom();
}

function momPickPain(pi){
  if (!momState || !momState.out) return;
  if ((momState.painsMade || []).includes(pi)) return;
  momState.painsPicked = (momState.painsPicked || []).includes(pi)
    ? (momState.painsPicked || []).filter((x) => x !== pi) : [...(momState.painsPicked || []), pi];
  drawMom();
}

/* #79 (§14): a pain point reaches the customer's record only through this
   press — the reading itself writes nothing, and an unticked line never
   lands. Each accepted pain goes into c.pains in the customer's own words,
   through the same PUT a hand-typed one uses, and the audit remembers
   where the words came from. */
function momCreatePains(){
  if (!momState || !momState.out) return;
  const m = (D.interactions || []).find(x => x.id === momState.mid);
  const c = m ? cust(m.c) : (momState.cid ? cust(momState.cid) : null);
  if (!c){ toast('That customer is no longer in the book.'); return; }
  if (!can('log')){ toast('Your role cannot record work.'); return; }
  const todo = (momState.out.pains || [])
    .map((p, pi) => ({ p, pi }))
    .filter(({ pi }) => (momState.painsPicked || []).includes(pi) && !(momState.painsMade || []).includes(pi));
  if (!todo.length){ toast('Tick the pain points you want first.'); return; }
  (c.pains = c.pains || []).push(...todo.map(({ p }) => p));
  momState.painsMade = [...(momState.painsMade || []), ...todo.map(({ pi }) => pi)];
  momState.painsPicked = (momState.painsPicked || []).filter((pi) => !momState.painsMade.includes(pi));
  audit('data', momState.mid ? 'Pain points from minutes' : 'Pain points from notes',
    todo.length + ' pain point(s) - ' + c.name, '-',
    momState.mid ? 'accepted from the minutes' : 'accepted from pasted notes');
  syncSave();
  drawMom();
  toast(todo.length + ' pain point(s) recorded on ' + c.name + ' - you accepted each one.');
}

/* §9's Related Opportunity: the model returns a title it read in the minutes,
   the account's own book decides whether that deal exists. A title nothing
   matches is left alone — an unconfirmed link is worse than none. */
function momMatchOpp(c, title){
  const q = String(title || '').replace(/\s+/g, ' ').trim().toLowerCase();
  if (!q || !c) return null;
  for (const id of (c.opps || [])){
    const o = opp(id);
    if (!o || !o.t) continue;
    const t = String(o.t).toLowerCase();
    if (t.includes(q) || q.includes(t)) return o;
  }
  return null;
}

function momCreateSelected(mid){
  if (!momState || !momState.out) return;
  /* #79: a paste without a meeting (mid empty) still creates steps — the
     account is momState.cid's, and the interaction lookup only exists on
     the minutes path. */
  const m = (D.interactions || []).find(x => x.id === mid);
  const c = m ? cust(m.c) : (momState.cid ? cust(momState.cid) : null);
  if (!c) return;
  if (!can('log')){ toast('Your role cannot record work.'); return; }
  const todo = (momState.out.steps || [])
    .map((st, i) => ({ st, i }))
    .filter(({ i }) => momState.picked.includes(i) && !momState.created.includes(i));
  if (!todo.length){ toast('Tick the steps you want first.'); return; }
  /* §5 on the minutes path too: an action accepted from a MOM is a Next Step
     like any other, so it carries the same two roles. The Execution Owner is
     whoever the minutes put it on — named in the text, the customer, or the
     person reading them who accepted it. The Tracker is this account's
     Primary BD or Primary SA, which is what the brief requires and the
     server enforces. §9's confirmation is this one press: ticks alone write
     nothing, and every row below reaches the book through the same PUT a
     hand-written step uses. */
  const me = (D.me && D.me.name) || '';
  for (const { st, i } of todo){
    const rel = momMatchOpp(c, st.opp);
    const exec = st.exec || (st.from === 'customer' ? 'the customer' : me);
    const track = c.owner || c.sa || me;
    (D.steps = D.steps || []).unshift({
      id: 's' + Date.now() + i, c: c.id, t: st.t,
      exec, track,
      due: st.due || '', w: '', from: st.from === 'customer' ? 'customer' : 'us', p: 'p1',
      kind: st.kind, o: rel ? rel.id : '',
      done:'', doneBy:'', doneNote:'' });
    /* #72: the same memory a hand-typed step leaves — the promise goes into
       the account's timeline the moment it is accepted, not only when it is
       finished (Scenario 3's rule, now one rule for every door in). */
    (c.timeline = c.timeline || []).unshift({ d: todayISO(), k: 'step', t: st.t,
      x: exec + (track && track !== exec ? ' · tracked by ' + track : '')
         + (st.due ? ' · due ' + st.due : '') });
    momState.created.push(i);
    momState.picked = momState.picked.filter((x) => x !== i);
  }
  audit('data', momState.mid ? 'Actions from minutes' : 'Actions from notes',
    todo.length + ' next step(s) - ' + c.name, '-',
    momState.mid ? 'accepted from the minutes' : 'accepted from pasted notes');
  syncSave();
  drawMom();
  toast(todo.length + ' next step(s) created - from ' + (momState.mid ? 'the minutes' : 'pasted notes') + ', accepted by you.');
}

function openOppConfirm(mid, oi){
  if (!momState || !momState.out) return;
  const sug = (momState.out.opps || [])[oi];
  if (!sug) return;
  /* #79: the hint's account is the paste's account — the meeting lookup is
     only there on the minutes path. */
  const m = (D.interactions || []).find(x => x.id === mid);
  const c = m ? cust(m.c) : (momState.cid ? cust(momState.cid) : null);
  if (!c){ toast('That customer is no longer in the book.'); return; }
  confirmOppSheet(c, sug, oi);
}

/* #75 — §10's Create Opportunity door, run through §26's protocol. The sheet
   pre-fills what the minutes support (a title and the evidence) and the
   Create button walks the exact path a hand-typed opportunity walks — the
   same fields, the same stage clock, the same audit line, syncSave and the
   server's oppIntegrity and all — so an opportunity created from a hint and
   one typed by hand are indistinguishable to the book. Only the audit note
   remembers where the suggestion came from. Amounts and probability are
   never written this way: the minutes cannot know either one, and a guessed
   figure in a pipeline is worse than an empty field (§10: speculation is not
   confirmed demand). */
function confirmOppSheet(c, sug, oi){
  if (!can('commercial')){ toast('Only the commercial owner creates opportunities.'); return; }
  const veil = document.getElementById('capVeil');
  veil.classList.add('on');
  document.querySelector('#capVeil .sheet-h').innerHTML = `
    <strong style="font-size:14.5px">Create an opportunity</strong>
    <span class="tiny muted">${esc(c.name)}</span><div class="spacer"></div>
    <button class="btn sm" id="capClose8">Close</button>`;
  document.getElementById('capClose8').onclick = closeCapture;
  const me = (D.me && D.me.name) || '';
  const stageOpts = (D.stages || ['Interested']).map(s => `<option>${esc(s)}</option>`).join('');
  document.getElementById('capBody').innerHTML = `
    <p class="tiny muted" style="margin-top:0">Detected from the minutes — the customer has not confirmed this demand.
      Nothing is written until you create it, and amounts and probability are never written this way at all.</p>
    <div class="row" style="margin-bottom:10px;flex-wrap:wrap;gap:6px"><span class="tiny" style="width:120px">Opportunity</span>
      <input id="ocText" style="${FLD}" value="${esc(sug.t || '')}" maxlength="140"></div>
    <div class="row" style="margin-bottom:10px;flex-wrap:wrap;gap:6px"><span class="tiny" style="width:120px">Customer</span>
      <input value="${esc(c.name)}" disabled style="${FLD};opacity:.7"></div>
    <div class="row" style="margin-bottom:10px;flex-wrap:wrap;gap:6px"><span class="tiny" style="width:120px">Stage</span>
      <select id="ocStage" style="${FLD}">${stageOpts}</select></div>
    <div class="row" style="margin-bottom:10px;flex-wrap:wrap;gap:6px"><span class="tiny" style="width:120px">Close (optional)</span>
      <input id="ocClose" type="date" style="${FLD}"></div>
    <div class="row" style="margin-bottom:10px;flex-wrap:wrap;gap:6px"><span class="tiny" style="width:120px">Description</span>
      <textarea id="ocDesc" rows="3" maxlength="400" style="${FLD}">${esc(sug.why || '')}</textarea>
      <span class="tiny muted" style="flex-basis:100%">Starts as the evidence from the minutes - the record keeps saying where it came from.</span></div>
    <div class="sheet-f" style="margin:var(--s4) calc(-1 * var(--s5)) calc(-1 * var(--s5))">
      <button class="btn" id="ocCancel">Cancel</button>
      <div class="spacer"></div>
      <button class="btn pri" id="ocCreate">Create opportunity</button>
    </div>`;
  document.getElementById('ocCancel').onclick = closeCapture;
  const textEl = document.getElementById('ocText');
  const descEl = document.getElementById('ocDesc');
  const create = document.getElementById('ocCreate');
  const sync = () => { create.disabled = !textEl.value.trim(); create.style.opacity = textEl.value.trim() ? '' : '.45'; };
  textEl.oninput = sync; sync();
  create.onclick = () => {
    const t = textEl.value.trim();
    if (!t) return;
    /* The same rule as the hand-typed form: a close date that is not a date
       is worse than none. */
    const close = document.getElementById('ocClose').value || '';
    if (close && !/^\d{4}-\d{2}-\d{2}$/.test(close)){
      toast('The close date needs to look like 2027-03-31 — or leave it empty.'); return;
    }
    const stage = document.getElementById('ocStage').value || 'Interested';
    /* The description carries its own caveat — the demand was read out of the
       minutes, not confirmed by the customer (§10's last line), and a record
       that forgets that reads as confirmed demand a quarter later. */
    const rawDesc = descEl.value.trim();
    const desc = (rawDesc ? rawDesc + ' ' : '') + '(Detected from the minutes - the customer has not confirmed this demand.)';
    const id = 'o' + Date.now();
    (D.opps = D.opps || {})[id] = { id, c: c.id, t, stage, v: 0, p: 10,
      stageAt: todayISO(), owner: me, comp: '-', close, cust: '', desc, soln: '' };
    (c.opps = c.opps || []).push(id);
    /* The same audit line a hand-typed opportunity writes — only the note
       says where the suggestion came from. */
    audit('data', 'Opportunity created', t + ' - ' + c.name, '-', stage + ' — accepted from the minutes');
    closeCapture();
    if (momState && momState.out){
      momState.oppsMade = [...(momState.oppsMade || []), oi];
      /* Put the minutes panel back without resetting it — the results, the
         ticks and the created marks all survive in momState. */
      const veil2 = document.getElementById('capVeil');
      veil2.classList.add('on');
      momHeader(momState.mid);
      drawMom();
    }
    render(); syncSave();
    toast('Opportunity created on ' + c.name + ' - from the minutes, accepted by you.');
  };
}

function saveMom(mid){
  const m = (D.interactions || []).find(x => x.id === mid);
  const c = m && cust(m.c);
  if (!m || !c || !momState || !momState.out) return;
  if (!can('log')){ toast('Your role cannot record work.'); return; }
  m.sum = momState.out.summary || m.sum;
  m.out = momState.out.outcome || m.out;
  /* The timeline entry is the same fact as the meeting - keep the pair in step. */
  const tl = c.timeline || [];
  const at = tl.findIndex(t => TL_IS_INTERACTION(t.k) && t.t === m.t);
  if (at >= 0) tl[at].x = m.out;
  audit('ai', 'Minutes read into the interaction', m.t + ' - ' + c.name, '-',
    momState.created.length + ' next step(s) accepted from them');
  closeCapture();
  syncSave(); render();
  toast('Summary and outcome written to the interaction.');
}

/* --------------------------------------------------------------- insights
   "What should I do next?" - the question a BD actually brings to the screen.
   The context is built from the customer's own records, anonymised on the way
   in (no person names, no company name), and SHOWN before it is sent: the
   panel lists exactly what the model will receive, and nothing else is. */
let insState = null;   /* { cid, facts, out, sent:[] } */

function buildInsightFacts(c){
  const meets = (D.interactions || []).filter(m => m.c === c.id).sort((a, b) => b.d.localeCompare(a.d));
  const steps = (D.steps || []).filter(s => s.c === c.id && !stepIsDone(s));
  const opps = (c.opps || []).map(opp).filter(Boolean);
  const news = (c.newsCache && c.newsCache.items) || [];
  return {
    'Industry': c.industry,
    'Customer stance / health': [c.stance, c.health].filter(Boolean).join(' / '),
    'Recorded problems': (c.pains || []),
    'People (anonymised)': (c.contacts || []).map(p => bandOf(p) + ' who is ' + p.s + (p.t ? ' (' + p.t + ')' : '')),
    'Recent activity': meets.slice(0, 5).map(m => (m.k || 'Meeting') + ' on ' + m.d + (m.out ? ' - ' + m.out : '')),
    'Open actions': steps.map(s => (s.from === 'customer' ? 'waiting on them' : 'our move') + ': ' + s.t + (s.due ? ' (due ' + s.due + ')' : '')),
    'Opportunities': opps.map(o => o.stage + ' - ' + money(o.v) + ' - ' + o.p + '% - ' + oppAge(o) + ' days in stage' + (o.comp && o.comp !== '—' ? ' - competitor: ' + o.comp : '')),
    'Latest news headlines': news.slice(0, 5).map(it => it.h),
  };
}

function openInsights(cid){
  const c = cust(cid);
  if (!c) return;
  insState = { cid, facts: buildInsightFacts(c), out: null, sent: [] };
  const veil = document.getElementById('capVeil');
  veil.classList.add('on');
  document.querySelector('#capVeil .sheet-h').innerHTML = `
    <strong style="font-size:14.5px">What should we do next?</strong>
    <span class="tiny muted">${esc(c.name)}</span><div class="spacer"></div>
    <button class="btn sm" id="capClose8">Close</button>`;

  drawInsights();
}

async function runInsights(cid){
  if (!insState) return;
  document.getElementById('capBody').innerHTML = `<div class="row"><span class="ai-mark model">AI</span>
    <span class="tiny muted" style="margin-left:8px">Reading the facts...</span></div>`;
  try {
    const res = await fetch('/api/ai/insights', { method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ facts: insState.facts }) });
    const b = await res.json();
    if (!res.ok || !b.ok){
      document.getElementById('capBody').innerHTML = `<div class="empty">${esc(b.error || 'The model did not answer.')}</div>
        <div class="sheet-f" style="margin:var(--s4) calc(-1 * var(--s5)) calc(-1 * var(--s5))">
          <button class="btn" id="insBack2">Back</button></div>`;
      document.getElementById('insBack2').onclick = () => { insState.out = null; drawInsights(); };
      return;
    }
    insState.out = b; insState.sent = [];
    drawInsights();
  } catch {
    toast('The model could not be reached.');
    insState.out = null; drawInsights();
  }
}

/* #72 — the last path that still wrote on a click. The insight's Create
   button now opens the same confirm sheet every other AI suggestion walks
   through (§26), and the panel reopens with the move marked once the step
   is real. */
function insConfirmStep(cid, i){
  const c = cust(cid);
  const mv = insState && insState.out ? (insState.out.moves || [])[i] : null;
  if (!c || !mv) return;
  confirmStepSheet(c, { t: mv.what || '', kind: mv.kind || '' }, 'confirmed from an insight', () => {
    if (!insState || insState.cid !== cid) return;
    insState.sent = (insState.sent || []).concat([i]);
    /* The sheet shared the veil with the panel; put the panel's own header
       back and redraw it over the confirm sheet's body. */
    document.querySelector('#capVeil .sheet-h').innerHTML = `
      <strong style="font-size:14.5px">What should we do next?</strong>
      <span class="tiny muted">${esc(c.name)}</span><div class="spacer"></div>
      <button class="btn sm" id="capClose8">Close</button>`;
    document.getElementById('capClose8').onclick = closeCapture;
    drawInsights();
  });
}

async function deleteCustomerNow(){
  const c = cust(delCust);
  if (!c) return;
  if (!can('del')){ toast('Only an administrator can delete a customer.'); return; }
  const typed = ((document.getElementById('delName') || {}).value || '').trim();
  if (typed !== c.name){ toast('The name does not match — nothing was deleted.'); return; }
  const cid = c.id;
  ensureIds();
  const gone = {
    customers: [cid],
    steps: D.steps.filter(s => s.c === cid).map(s => s.id),
    meetings: D.interactions.filter(m => m.c === cid).map(m => m.id),
    watch: (D.watch || []).filter(w => w.c === cid).map(w => w.id),
    files: (D.files || []).filter(f => f.c === cid).map(f => f.id),
    opps: Object.values(D.opps || {}).filter(o => o.c === cid).map(o => o.id)
  };
  D.customers = D.customers.filter(x => x.id !== cid);
  D.steps = D.steps.filter(s => s.c !== cid);
  D.interactions = D.interactions.filter(m => m.c !== cid);
  D.watch = (D.watch || []).filter(w => w.c !== cid);
  D.files = (D.files || []).filter(f => f.c !== cid);
  for (const id of gone.opps) delete D.opps[id];
  /* Every row that went with the customer is named too, so the removal
     survives a merge as well as a replace — and survives a request that was
     refused, because GONE is only emptied once a save is answered. */
  for (const k of Object.keys(gone)) for (const id of gone[k]) goneAdd(k, id);
  audit('data', 'Customer deleted', c.name, '-', 'every record on it went with it');
  delCust = null;
  closeCapture();
  view = { s: 'customers', id: null, tab: 'brief', cview: 'board' };
  render();
  /* The removal travels under its own envelope. It always did here; what
     changed is that the server no longer reads a MISSING row as a deleted one,
     so the envelope is now the only way a removal happens at all — on a merge
     as much as on a replace. The server still has the last word: DELETE_ROLES
     is the administrator's alone. */
  try {
    await fetch('/api/data', { method: 'PUT', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-Base-Rev': String(SY.rev) },
      body: JSON.stringify({ state: buildState(), baseRev: SY.rev, deleted: goneTake() }) });
  } catch { /* GONE is kept, so the next scheduled save carries the removal again */ }
  toast(c.name + ' deleted — every record on it went with it.');
}

function saveWatch(cid){

function watchCard(c){

     card is one inline prompt line, not a framed empty box. */
  if (!all.length){
    return `<div class="card wkw-empty" data-tour="watch">
      <div class="row row-wrap">

        ${can('log') && !watchAdd ? `<button class="btn sm" data-act="watchadd">+ Record something you saw</button>` : ''}
      </div>

  }
  return `<div class="card card-flush" data-tour="watch">
    <div class="bf-sec bf-sec-head">
      <div class="row row-wrap">
        <h3>Worth knowing</h3>
        <span class="tiny muted">each with its source and the date you put it here</span>

      </div>
    </div>

      <span class="sstat"><span class="n">${all.length}</span><span class="l">recorded</span></span>
      <span class="sstat"><span class="n">${fresh}</span><span class="l">in the last 30 days</span></span>
      <span class="sstat"><span class="n">${comp}</span><span class="l">competitor moves</span></span>
      <div class="spacer"></div>
      <span class="tiny muted">Nothing here is <b>true</b> until somebody opens the link and marks it confirmed.</span>

    ${showWatchAll && all.length > 4 ? `<button class="more" data-act="wless">Show fewer ↑</button>` : ''}
    ${can('log')
      ? (watchAdd
          ? watchAddForm(c)
          : `<button class="more" data-act="watchadd">+ Record something you saw</button>`)
      : ''}
  </div>`;
}

/* A closed list, so it is chips and a dropdown — not free text. Free text
   turns "what kind of file is this" into six spellings of the same answer,
   and then the list stops being scannable. */
const FILE_KINDS = ['Proposal', 'Commercials', 'Design', 'Requirements', 'POC', 'Tender', 'Risk', 'Other'];
let fileAdd = false;

/* Kelvin's list, 16 Sep 2026: brief · people · what they run · opportunities ·
   timeline · file & audit. Six, and no other. A seventh tab is a decision,
   not an accident — every tab you add is a place a colleague now has to look
   before a meeting. */
const CUST_TABS = [
  { k:'brief',         l:'Brief' },
  { k:'people',        l:'People' },
  { k:'run',           l:'What they run' },
  { k:'opportunities', l:'Opportunities' },
  { k:'timeline',      l:'Timeline' },
  { k:'files',         l:'File & Audit' }
];

/* Files and audit sit on the same tab because they answer the same question —
   what is true, and who said it — and because both are the things an Admin
   is accountable for. Put them on separate tabs and the second one is never
   opened. */
function tabFiles(c){

/* A file is added by a person, so it carries their name from the first save —
   not "somebody uploaded this". Same rule as everything else here: if it might
   be questioned later, it is written down at the time. */
function saveFile(){
  const c = view.id ? cust(view.id) : null;
  if (!c) return;
  /* The same gate the button was drawn behind. A read-only role never sees
     the form, and a forged click must not reach the server either. */
  if (!can('log')){ toast('Your role cannot add documents.'); return; }
  const input = document.getElementById('aff');
  const f = input && input.files && input.files[0];
  const note = document.getElementById('afnote');
  if (!f){ toast('Choose the document first — nothing has been uploaded yet.'); return; }
  if (f.size > 25 * 1024 * 1024){
    toast('That file is ' + (f.size / 1048576).toFixed(1) + ' MB — the limit is 25 MB.');
    return;
  }
  const k = (document.getElementById('afk') || {}).value || 'Other';
  const id = 'f_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  if (note) note.textContent = 'Uploading ' + f.name + '…';
  const reader = new FileReader();
  reader.onerror = () => { if (note) note.textContent = 'That document could not be read on this machine.'; };
  reader.onload = async () => {
    const b64 = String(reader.result || '');
    const data = b64.includes(',') ? b64.slice(b64.indexOf(',') + 1) : b64;
    let res, body;
    try {
      res = await fetch('/api/files', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, c: c.id, n: f.name, k, data })
      });
      body = await res.json().catch(() => ({}));
    } catch {
      toast('Not saved — the server could not be reached. Nothing was added.');
      if (note) note.textContent = 'Upload failed. Try again.';
      return;
    }
    if (!res.ok){
      toast(body.error || 'The document could not be stored. Nothing was added.');
      if (note) note.textContent = body.error || 'Upload failed.';
      return;
    }
    (D.files = D.files || []).push({
      id, c: c.id, n: f.name, k, sz: fmtSize(f.size),
      by: (D.me && D.me.name) || '', d: todayISO(), bytes: f.size, stored: true
    });
    fileAdd = false;
    audit('data', 'Document uploaded', c.name + ' · ' + f.name, '—', k);
    view.tab = 'files';
    render(); syncSave();
    toast('Uploaded · ' + f.name);
  };
  reader.readAsDataURL(f);
}

const fmtSize = (b) => b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB'
  : b >= 1024 ? Math.round(b / 1024) + ' KB' : b + ' B';

/* Classification is a judgement, not a fact, so it is a chip somebody clicks
   and the log keeps both sides. Four options on purpose: a list you can extend
   is a list nobody agrees on, and then it stops being a filter. */
function setClass(b, name){
  const c = view.id ? cust(view.id) : null;
  const p = c && c.contacts.find(x => x.n === name);
  if (!p) return;
  const before = bandOf(p);
  if (before === b) return;
  p.b = b;
  pickedPerson = name;   /* the card you just touched is the card you mean */
  audit('data', 'Person classified', name + ' · ' + c.name, before, b);
  render(); toast(name + ' is now ' + b + ' · ' + BAND_WHY[b]);
}

/* Only offer a draft when a model is genuinely reachable. The badge used to be
   there permanently, over a paragraph that no model had ever written. */
function briefAiBox(c){
  if (c.confidential) return `<div class="note" style="margin-top:var(--s3)"><strong>Confidential.</strong>
    ${esc(c.name)} is never sent to a model, so no draft is offered.</div>`;
  if (!(aiState && aiState.configured && aiState.reachable)) return '';
  /* The Draft button lives on the card's header row, next to Edit. This mount
     carries the hint when idle and the "Drafting…" / failure state while the
     model is out. */
  return `<div class="tiny muted" style="margin-top:var(--s2)">Draft asks the model from the records
    on this customer — read it and edit it before you rely on it.</div>`;
}

async function draftBrief(cid){
  const c = cust(cid);
  if (!c) return;
  if (c.confidential){ toast(c.name + ' is confidential — no draft is requested.'); return; }
  const host = document.getElementById('briefAi' + cid);
  if (host) host.innerHTML = '<div class="row" style="margin-top:var(--s3)"><span class="ai-mark model">AI</span>'
    + '<span class="tiny muted" style="margin-left:8px">Drafting…</span>'
    + '<div class="spacer"></div>' + corgiWorking() + '</div>';
  const facts = [
    'Customer: ' + c.name + ' (' + (c.industry || '?') + ', ' + (c.hq || '?') + ')',
    'Stance: ' + c.stance + ' · health: ' + c.health,
    'Pain points: ' + ((c.pains || []).join('; ') || 'none recorded'),
    'People: ' + ((c.contacts || []).map(p => p.n + ' - ' + (p.t || '') + ' - ' + p.s).join('; ') || 'none'),
    'Opportunities: ' + ((c.opps || []).map(opp).filter(Boolean)
      .map(o => o.t + ' (' + money(o.v) + ', ' + o.stage + ')').join('; ') || 'none'),
    'Systems: ' + ((c.apps || []).map(a => a.n).join('; ') || 'none'),
    'Recent: ' + ((c.timeline || []).slice(0, 5).map(t => t.d + ' ' + t.t).join('; ') || 'none')
  ].join('\n');
  try {
    const out = await askModel('Write a brief of at most 90 words on where this account stands, using only these facts.\n\n' + facts);
    c.brief = out;
    /* Remember who wrote it. A model draft and a person's own words looked
       identical on the card — both read "Written" — so the one thing a reader
       needs to know before trusting a paragraph was the one thing the screen
       did not say. The mark is cleared the moment a human edits the brief, so
       it never outlives the draft it describes. */
    c.briefSrc = 'model';
    audit('ai', 'Brief drafted by the model', c.name, 'Written', 'Draft');
    render(); syncSave();
    toast('Draft written — read it, edit it, then it is yours.');
  } catch (e) {
    if (host) host.innerHTML = '<div class="note" style="margin-top:var(--s3)"><strong>No draft was written.</strong> '
      + esc(e.message || 'The model could not be reached.') + ' The brief is unchanged.</div>';
  }
}

/* ---------------------------------------------------------------- our team
   Who is on a customer used to be `D.team.slice(0,3)` — the first three people
   in the workspace roster, on every customer, including one created ten
   seconds earlier. That is a directory listing wearing a team's name, and it
   asserts something false: that those three are working this account.

const teamCanEdit = (c) => can('edit') &&

/* ------------------------------------------------------------------ brief

             so it is drawn as part of the page header rather than as another
             box competing with the ones below it.
   WORK      what needs you, given the wide column, beside our own thinking
             and the last meeting, stacked in the narrow one. The only block
             on this page with a due date gets the most room.

             carries a headline, a source, a reason and a link; a watch row

function tabBrief(c, ops){

        <button class="btn sm ai" data-act="notes" data-cid="${esc(c.id)}"

}

          : 'Nothing here yet, and no model endpoint on this server is answering, so nothing can be drafted.'}</p>

function lastMeetCard(c){
  const m = c.timeline.filter(t => TL_IS_INTERACTION(t.k)).slice(0, 1);
  return `
