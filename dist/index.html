      ? `<div style="font-size:13px;font-weight:500">${esc(m[0].t)}</div>
         <div class="tiny muted" style="margin:2px 0 var(--s2)">${esc(m[0].d)}</div>
         <p class="tiny" style="margin:0;color:var(--ink-2)">${esc(m[0].x) || 'No summary was written for that meeting.'}</p>`
      : '<div class="tiny muted">No meeting with this customer yet. The first one is the one that matters.</div>'}
  </div>`;
}

/* ------------------------------------------------------------- open actions
   The follow-ups lived only on the Today screen, so the customer page — the
   one place you open before a meeting — never mentioned them, and there was
   no way to record one except by typing a sentence Capture could parse. A
   promise made in the room needs a row here: what, who owns it, by when, and
   whose court it is in. Done writes to the timeline, so the record of the
   account and the list of work can never disagree.
   Returns the card, plus the add form when it is open — inside a grid they
   must be wrapped in one <div>, or each lands in its own cell. */
/* §5: the two roles, shown only when they are two people.
   When the same person executes and tracks — the ordinary case — a line saying
   so twice is noise. When they differ (a Product SA executing, the Primary SA
   tracking, which is Scenario 3) it is the single most useful thing on the
   card, so it gets its own line. */
/* §6: every action carries two people — who does it, and who is answerable
   for it happening. One name is the common case (the same person does both),
   and it used to render as a bare name with no role at all, so the row could
   not say which of the two jobs that name was doing. It says so now:
   "does and tracks", or each one named. */
function stepRoleLine(s){
  const e = stepExec(s), t = stepTrack(s);
  if (!e && !t) return '';
  if (!e) return `<div class="tiny muted">tracked by ${esc(t)}</div>`;
  if (!t || e === t) return `<div class="tiny muted">executed and tracked by ${esc(e)}</div>`;
  return `<div class="tiny muted">executed by ${esc(e)} · tracked by ${esc(t)}</div>`;
}

function actionsCard(c){
  const all = (D.steps || []).filter(s => s.c === c.id);
  const open = all.filter(s => !stepIsDone(s));
  const done = all.filter(stepIsDone);
  const doneCount = done.length;
  const late = open.filter(stepOverdue).length;
  return `
  <div class="card" style="padding:0">
    <div class="bf-sec" style="padding-bottom:var(--s3)">
      <div class="row" style="flex-wrap:wrap;gap:8px">
        <h3 style="margin:0">What needs you</h3>
        <span class="tiny muted">${open.length} open action${open.length === 1 ? '' : 's'} · ${doneCount} done</span>
        ${late ? `<span class="tag t-risk">${late} overdue</span>` : ''}
        <div class="spacer"></div>
        ${addBarFor('steps', { only:'btn' })}
      </div>
    </div>
    ${open.length ? open.map(s => {
      const late = stepOverdue(s);
      return `<div class="row" style="padding:13px var(--s5);border-bottom:1px solid var(--line);align-items:flex-start">
        <span class="tag ${s.from === 'customer' ? 't-blue' : 't-grey'}" title="${s.from === 'customer' ? 'In their court — we are waiting on them' : 'In our court — we owe this'}"
          style="flex:0 0 auto">${s.from === 'customer' ? 'them' : 'us'}</span>
        <div style="min-width:0;flex:1">
          <div style="font-size:13px;font-weight:500">${esc(s.t)}</div>
          <div class="tiny muted">${s.due ? esc(s.due) : 'no date set'}</div>
          ${stepRoleLine(s)}
        </div>
        <span class="tag ${late ? 't-risk' : 't-grey'}">${esc(stepWhen(s))}${late ? ' overdue' : ''}</span>
        ${can('log') ? `<button class="btn sm" data-act="stepdone" data-sid="${esc(s.id)}"
          title="Mark this done — recorded on the timeline with your name">Done</button>` : ''}
        ${rmBar(rmKey.step(c, s), s.t)}
      </div>${edFor === rmKey.step(c, s) ? edForm(rmKey.step(c, s),
        { ed1: s.t, ed2: stepExec(s), ed5: stepTrack(s), ed3: s.due || '', ed4: s.from }) : ''}`;
    }).join('')
      : '<div class="empty" style="padding:var(--s5)">Nothing is owed in either direction.</div>'}
    ${done.length ? doneBlock(c, done) : ''}
  </div>
  ${addBarFor('steps', { only:'form' })}`;
}

/* §6: a completed action does not disappear.
   It used to be counted in a line of prose ("3 done") and then dropped from
   the page entirely, so the only way to answer "did we ever do that?" was to
   read the timeline. That is the wrong shape for the question: the work is
   often the most useful part of the account — what was done, by whom, when,
   and what it led to. It stays here, closed and folded, with the original
   execution owner and tracker still on it. */
function doneBlock(c, done){
  const open = !!doneOpen;
  return `
  <button class="btn sm" data-act="donefold" style="margin:var(--s3) var(--s5)"
    >${open ? 'Hide' : 'Show'} ${done.length} completed</button>
  ${open ? done.slice().sort((a, b) => String(b.done).localeCompare(String(a.done))).map(s => `
    <div class="row" style="padding:11px var(--s5);border-bottom:1px solid var(--line);align-items:flex-start;opacity:.72">
      <span class="tag t-ok" style="flex:0 0 auto">done</span>
      <div style="min-width:0;flex:1">
        <div style="font-size:13px">${esc(s.t)}</div>
        <div class="tiny muted">Completed ${esc(s.done)}${s.doneBy ? ' by ' + esc(s.doneBy) : ''}</div>
        ${stepRoleLine(s)}
        ${s.doneNote ? `<div class="tiny muted">${esc(s.doneNote)}</div>` : ''}
      </div>
      ${rmBar(rmKey.step(c, s), s.t)}
    </div>
    ${edFor === rmKey.step(c, s) ? edForm(rmKey.step(c, s),
      { ed1: s.t, ed2: stepExec(s), ed5: stepTrack(s), ed3: s.due || '', ed4: s.from }) : ''}
  `).join('') : ''}`;
}

/* One line each, and each one is a different NEXT ACTION — that is the test.
   If two of them told you to do the same thing, one of them would not belong. */
const BAND_WHY = {
  'Decision maker':'signs it, or says no',
  'Blocker':'can stop it — win them or go around them',
  'Influencer':'shapes the choice, does not sign it',
  'User':'lives with it every day, after we leave'
};

function personRow(c, p, on){
  const m = lastMet(c, p);
  const gap = m ? dayGap(m.d) : null;
  const last = m ? (gap <= 0 ? 'Today' : gap + 'd ago') : 'Never met';
  return `<button class="pr ${on ? 'on' : ''}" data-sel="${esc(p.n)}">
    <span class="av" style="width:26px;height:26px;font-size:10px;flex:0 0 26px">${esc(initials(p.n))}</span>
    <span class="pr-main">
      <span class="pr-n">${esc(p.n)}</span>
      <span class="pr-t">${esc(p.t)}</span>
    </span>
    ${stanceTag(p.s)}
    <span class="pr-m">${last}</span>
    <span class="pr-m opt">${esc(p.o)}</span>
    <span class="pr-c">›</span>
  </button>`;
}

function personCard(c, p){
  const ms = metWith(c, p).sort((a, b) => b.d.localeCompare(a.d));
  const m = ms[0] || null;
  const links = p.lk || [];
  /* The LinkedIn chip uses the URL the team pasted when there is one — a
     search is a guess, and the person who met them knows the real profile. */
  const liUrl = String(p.li || '').trim();
  return `
  <div class="card">
    <button class="btn sm pd-back" data-act="unpick">← All people</button>
    <div class="row" style="align-items:flex-start;margin-top:var(--s3)">
      <div class="av" style="width:38px;height:38px;font-size:13px;flex:0 0 38px">${esc(initials(p.n))}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:15px;font-weight:600">${esc(p.n)}</div>
        <div class="tiny muted">${esc(p.t)}</div>
      </div>
      ${stanceTag(p.s)}
    </div>
    <div class="hr"></div>
    <div class="kv">
      <div class="k">${bandOf(p)}</div><div>${BAND_WHY[bandOf(p)]}</div>
      <div class="k">Our owner</div><div>${esc(p.o)}</div>
      ${p.em ? `<div class="k">Email</div><div><a class="lk" href="mailto:${esc(p.em)}">${esc(p.em)}</a></div>` : ''}
      ${p.ph ? `<div class="k">Phone</div><div><a class="lk" href="tel:${esc(String(p.ph).replace(/[^+0-9]/g, ''))}">${esc(p.ph)}</a></div>` : ''}
      <div class="k">In a room with us</div>
      <div>${m ? fmtDay(m.d) + ' · ' + ms.length + ' meeting' + (ms.length === 1 ? '' : 's') : '<span style="color:var(--risk)">never — nobody has met them</span>'}</div>
    </div>
    <div class="hr" style="margin:var(--s3) 0"></div>
    <div class="tiny muted" style="margin-bottom:6px">Classification
      <span style="opacity:.8">— what they are in this decision. Where they stand is the badge above,
      and the two are deliberately not the same thing.</span></div>
    <div class="row" style="gap:6px;flex-wrap:wrap">
      ${BANDS.map(b => `<button class="fchip ${bandOf(p) === b ? 'on' : ''}" data-cls="${esc(b)}" data-pn="${esc(p.n)}"
        title="${esc(BAND_WHY[b])}">${b}</button>`).join('')}
    </div>
    <p class="tiny" style="color:var(--ink-2);margin:var(--s3) 0 0">${esc(p.note)}</p>
    <div class="hr" style="margin:var(--s3) 0"></div>
    <div class="tiny muted" style="margin-bottom:6px">Links</div>
    <div class="row" style="gap:6px;flex-wrap:wrap">
      ${links.map(l => `<a class="lk" href="${esc(l.u)}" target="_blank" rel="noopener"
      title="Pasted by ${esc(l.by || 'somebody on the team')} — never generated">${esc(l.n)} ↗</a>`).join('')}
      ${liUrl
        ? `<a class="lk" href="${esc(liUrl)}" target="_blank" rel="noopener"
             title="The exact profile — set by the team in Edit">LinkedIn ↗</a>`
        : `<a class="lk" href="${liPeople(liPersonQ(p, c))}"
             target="_blank" rel="noopener"
             title="A search, not a profile — paste the exact URL in Edit when you know it">Find on LinkedIn ↗</a>`}
    </div>
    <p class="tiny muted" style="margin:var(--s2) 0 0">${liUrl
      ? 'This profile link was set by your team. Edit corrects it; empty the field to fall back to a search.'
      : 'We never invent a profile URL — this opens a search. When the search is not accurate enough, paste the exact profile in <b>Edit</b>.'}</p>
    <div class="hr" style="margin:var(--s3) 0"></div>
    <div class="row" style="gap:8px;flex-wrap:wrap">
      <div class="spacer"></div>
      <button class="btn sm" data-act="ed" data-ed="${rmKey.person(c, p)}">Edit</button>
      ${rmBar(rmKey.person(c, p), p.n)}
    </div>
    ${edFor === rmKey.person(c, p) ? edForm(rmKey.person(c, p), [p.n, p.t, bandOf(p), p.s, p.em, p.ph, p.li]) : ''}
    <p class="tiny muted" style="margin:6px 0 0;opacity:.85">Personal data under the PDPA: visible to
      your team, exportable, and deleted on request.</p>
  </div>`;
}

/* The map is a diagnostic you open, so it draws the one thing the list makes
   you count in your head: who on their side is actually COVERED. Our team on
   the left, the customer in the middle, their people on the right — a solid
   line means somebody of ours has met them, a dashed one means nobody has. */
function relMapBlock(c){
  const STANCE_COLOR = { 'With us': '#2E7D5B', 'Undecided': '#8A93A3', 'Against us': '#B4232A' };
  const all = (c.contacts || []).slice()
    .sort((a, b) => (BANDS.indexOf(bandOf(a)) - BANDS.indexOf(bandOf(b))) || String(a.n).localeCompare(String(b.n)));
  if (!all.length){
    return `<div class="artline">
      <svg viewBox="0 0 680 110">
        <rect x="296" y="31" width="88" height="48" rx="10" fill="#1B1F27"/>
        <text x="340" y="52" text-anchor="middle" font-size="11" fill="#9AA3AF">${esc(shortTxt(c.name, 12))}</text>
        <text x="340" y="68" text-anchor="middle" font-size="10" fill="#E8EBEF">customer</text>
      </svg>
      <div class="t">Nobody from their side is on the record yet, so the map has nothing to draw.
        Add people on this tab and it fills in — each line a relationship, dashed when nobody has met them.</div>
    </div>`;
  }
  const shown = all.slice(0, 10);
  const more = all.length - shown.length;
  const owners = [];
  for (const p of shown){ if (p.o && !owners.includes(p.o)) owners.push(p.o); }
  if (!owners.length) owners.push(c.owner || 'Our team');
  const rowH = 40, top = 16;
  const peopleH = shown.length * rowH;
  const teamH = owners.length * rowH;
  const H = Math.max(peopleH, teamH) + top * 2 + (more ? 24 : 0);
  const cy = H / 2;
  const teamY = (i) => top + i * rowH + (Math.max(peopleH, teamH) - teamH) / 2;
  const peopleY = (i) => top + i * rowH + (Math.max(peopleH, teamH) - peopleH) / 2;
  const box = (x, y, w, h, fill, stroke) =>
    `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="${fill}" stroke="${stroke}" stroke-width="1"/>`;
  let svg = `<svg viewBox="0 0 680 ${H}" role="img" aria-label="Relationship map of ${esc(c.name)}">`;
  shown.forEach((p, i) => {
    const y = peopleY(i) + 16;
    const oi = owners.indexOf(p.o);
    const ty = oi >= 0 ? teamY(oi) + 16 : cy;
    const met = !!lastMet(c, p);
    svg += `<path d="M 196 ${ty} C 262 ${ty}, 372 ${y}, 434 ${y}" fill="none" stroke="#C6CDD6"
      stroke-width="${met ? 1.5 : 1.2}"${met ? '' : ' stroke-dasharray="4 4"'}/>`;
  });
  owners.forEach((o, i) => {
    const y = teamY(i);
    svg += box(20, y, 176, 32, '#F1F4F8', '#D8DDE4')
      + `<text x="32" y="${y + 20.5}" font-size="11.5" fill="#414954" font-weight="500">${esc(shortTxt(o, 20))}</text>`;
  });
  svg += box(296, cy - 24, 88, 48, '#1B1F27', '#1B1F27')
    + `<text x="340" y="${cy - 4}" text-anchor="middle" font-size="11" fill="#9AA3AF">${esc(shortTxt(c.name, 12))}</text>`
    + `<text x="340" y="${cy + 12}" text-anchor="middle" font-size="10" fill="#E8EBEF">customer</text>`;
  shown.forEach((p, i) => {
    const y = peopleY(i);
    svg += box(434, y, 226, 32, '#FFFFFF', '#D8DDE4')
      + `<circle cx="448" cy="${y + 16}" r="4.5" fill="${STANCE_COLOR[p.s] || '#8A93A3'}"/>`
      + `<text x="460" y="${y + 20.5}" font-size="11.5" fill="#1B1F27" font-weight="500">${esc(shortTxt(p.n, 15))}`
      + `<tspan fill="#8A93A3" font-weight="400"> · ${esc(shortTxt(p.t, 16))}</tspan></text>`;
    if (!lastMet(c, p)) {
      svg += `<text x="650" y="${y + 20.5}" text-anchor="end" font-size="9.5" fill="#B4232A">never met</text>`;
    }
  });
  svg += '</svg>';
  return `<div class="artline">${svg}
    <div class="t">A picture of <b>coverage</b>, not a way to browse. A solid line means somebody of ours
      has met them; <b>dashed</b> means nobody has — a deal that rests on one person restarts when they
      leave. The dot is where they stand.${more ? ' ' + more + ' more not drawn.' : ''}</div>
  </div>`;
}

function tabPeople(c){
  const all = rankPeople(c.contacts);
  /* Classification and stance are two different questions and the strip shows
     both: "can stop it" is what they ARE, "against us" is where they STAND.
     A decision maker who is against us is the worst row on this screen, and
     neither number alone would tell you that. */
  const deciders = all.filter(p => bandOf(p) === 'Decision maker');
  const blockers = all.filter(p => bandOf(p) === 'Blocker');
  const against  = all.filter(p => p.s === 'Against us');
  const quiet = all.filter(p => { const m = lastMet(c, p); return !m || dayGap(m.d) >= 45; });
  const unowned = all.filter(p => p.o === '—');

  const stats = [
    { k:'all',            n: all.length,      l: all.length === 1 ? 'person' : 'people' },
    { k:'Decision maker', n: deciders.length, l:'decide' },
    { k:'Blocker',        n: blockers.length, l:'can stop it' },
    { k:'blocked',        n: against.length,  l:'against us' },
    { k:'quiet',          n: quiet.length,    l:'quiet 45d+' },
    { k:'none',           n: unowned.length,  l:'no owner' }
  ];

  let list = all;
  if (peopleScope === 'Decision maker') list = deciders;
  if (peopleScope === 'Blocker') list = blockers;
  if (peopleScope === 'blocked') list = against;
  if (peopleScope === 'quiet')   list = quiet;
  if (peopleScope === 'none')    list = unowned;

  const cap = showAllPeople ? list.length : 8;
  const shown = list.slice(0, cap);
  const selName = (pickedPerson && list.some(p => p.n === pickedPerson)) ? pickedPerson
                : (window.innerWidth > 880 && shown[0] ? shown[0].n : null);
  const sel = all.find(p => p.n === selName) || null;

  let rows = '', band = null;
  shown.forEach(p => {
    const b = bandOf(p);
    if (b !== band){
      band = b;
      rows += `<div class="grp-h">${b}<span class="n">${shown.filter(x => bandOf(x) === b).length}</span>
        <span class="why">${BAND_WHY[b]}</span></div>`;
    }
    rows += personRow(c, p, p.n === selName);
  });

  return `
  <div class="row" style="margin-bottom:var(--s3);gap:8px;flex-wrap:wrap">
    <button class="fchip ${showMap ? 'on' : ''}" data-act="map" data-tour="net">
      ${showMap ? 'Hide' : 'Show'} relationship map</button>
    <button class="fchip ${dense ? 'on' : ''}" data-act="dense">${dense ? 'Compact' : 'Comfortable'}</button>
    <div class="spacer"></div>
  </div>

  ${showMap ? relMapBlock(c) : ''}

  <div class="pd-wrap">
    <div class="card plist" style="padding:0">
      <div class="strip" data-tour="ppl">
        ${stats.map(s => `<button class="sstat ${peopleScope === s.k ? 'on' : ''}" data-scope="${s.k}">
          <span class="n">${s.n}</span><span class="l">${s.l}</span></button>`).join('')}
        <div class="spacer"></div>
        <span class="tiny muted">${shown.length} of ${list.length}</span>
      </div>
      ${rows || `<div class="empty">Nobody in this view.</div>`}
      ${list.length > cap ? `<button class="more" data-act="showall">Show all ${list.length} people ↓</button>` : ''}
      ${showAllPeople && list.length > 8 ? `<button class="more" data-act="showless">Show the first 8 ↑</button>` : ''}
    </div>
    <div>${sel ? personCard(c, sel)
      : `<div class="card"><div class="empty">Pick a person to see everything we know about them.</div></div>`}</div>
  </div>`;
}

const RUN_WHY = {
  Replace:   'their contract or their pain is our opening',
  Both:      'we can replace it or live beside it',
  Integrate: 'we join it — it is not a target'
};

function tabRun(c){
  const groups = ['Replace', 'Both', 'Integrate']
    .map(s => ({ s, list: c.apps.filter(a => a.stance === s) }))
    .filter(g => g.list.length);
  const n = (s) => c.apps.filter(a => a.stance === s).length;
  return `<div class="card" style="padding:0">
    <div class="strip">
      <span class="sstat"><span class="n">${c.apps.length}</span><span class="l">systems</span></span>
      <span class="sstat"><span class="n">${n('Replace')}</span><span class="l">we can replace</span></span>
      <span class="sstat"><span class="n">${n('Both')}</span><span class="l">contested</span></span>
      <span class="sstat"><span class="n">${n('Integrate')}</span><span class="l">we join</span></span>
      <div class="spacer"></div>
    </div>
    ${groups.map(g => `
      <div class="grp-h">${g.s}<span class="n">${g.list.length}</span><span class="why">${RUN_WHY[g.s]}</span></div>
      ${g.list.map(a => `<div class="pr">
        <span class="pr-main">
          <span class="pr-n">${esc(a.n)}</span>
          <span class="pr-t">${esc(a.v)}</span>
        </span>
        <span class="pr-m">${esc(a.note ?? '—')}</span>
        ${canEditKind(rmKey.system(c, a)) ? `<button class="btn sm" data-act="ed" data-ed="${rmKey.system(c, a)}">Edit</button>` : ''}
        ${rmBar(rmKey.system(c, a), a.n)}
      </div>${edFor === rmKey.system(c, a) ? edForm(rmKey.system(c, a), [a.n, a.v, a.stance]) : ''}`).join('')}`).join('')}
  </div>`;
}

function tabOpps(c, ops){
  const total = ops.reduce((a, o) => a + o.v, 0);
  const weighted = ops.reduce((a, o) => a + o.v * o.p / 100, 0);
  const stalled = ops.filter(o => oppAge(o) >= 30 && o.p <= 25);
  const soon = ops.filter(o => { const u = -dayGap(o.close); return u >= 0 && u <= 45; });
  const ranked = ops.slice().sort((a, b) =>
    ((stalled.indexOf(b) >= 0 ? 1 : 0) - (stalled.indexOf(a) >= 0 ? 1 : 0)) ||
    (b.v * b.p - a.v * a.p));
  const groups = [
    { l:'Needs you', why:'in stage more than 30 days with a low probability', list: ranked.filter(o => stalled.indexOf(o) >= 0) },
    { l:'Moving',    why:'weighted value first — value × probability',        list: ranked.filter(o => stalled.indexOf(o) < 0) }
  ].filter(g => g.list.length);

  return `<div class="card" style="padding:0;margin-bottom:var(--s5)">
    <div class="strip">
      <span class="sstat"><span class="n">${ops.length}</span><span class="l">${ops.length === 1 ? 'opportunity' : 'opportunities'}</span></span>
      <span class="sstat"><span class="n">${money(total)}</span><span class="l">on the table</span></span>
      <span class="sstat"><span class="n">${money(weighted)}</span><span class="l">weighted</span></span>
      <span class="sstat"><span class="n">${stalled.length}</span><span class="l">stalled</span></span>
      <span class="sstat"><span class="n">${soon.length}</span><span class="l">closing in 45d</span></span>
      <div class="spacer"></div>
    </div>
  </div>
  ${groups.map(g => `
    <div class="grp-h">${g.l}<span class="n">${g.list.length}</span><span class="why">${g.why}</span></div>
    <div class="grid g2" style="margin-bottom:var(--s5)">
    ${g.list.map(o => `
      <div class="card">
        <div class="row" style="align-items:flex-start">
          <div style="flex:1;min-width:0">
            <div style="font-size:14px;font-weight:600">${esc(o.t)}</div>
            <div class="tiny muted">${esc(o.cust)} · our owner ${esc(o.owner)}</div>
          </div>
          <span class="mono" style="font-size:14px;font-weight:600">${money(o.v)}</span>
        </div>
        <div class="rail-dots">
          ${D.stages.map((s,i) => `<i class="${i <= stageIdx(o.stage) ? 'on ' + stageCls(s) : ''}" title="${esc(s)}"></i>`).join('')}
        </div>
        <div class="row tiny muted" style="margin-top:7px">
          <span class="stage-pill ${stageCls(o.stage)}">${esc(o.stage)}</span>
          ${stalled.indexOf(o) >= 0 ? `<span class="tag t-risk">Stalled ${oppAge(o)}d</span>` : `<span>${oppAge(o)}d in stage</span>`}
          <div class="spacer"></div>
          <span>${o.p}%</span>
        </div>
        <div class="tiny muted" style="margin-top:5px;line-height:1.45" title="§13: the deal's own evidence, read at render time">${esc(oppWhy(o))}</div>
        <div class="hr" style="margin:var(--s3) 0"></div>
        <p class="tiny" style="color:var(--ink-2);margin:0 0 var(--s3)">${esc(o.desc)}</p>
        ${(o.items || []).length ? `<div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:var(--s3)">
          ${o.items.map(pid => {
            const p = (D.products || []).find(x => x.id === pid);
            return `<span class="tag t-grey" style="gap:4px">${esc(p ? p.n : 'retired product')}
              ${canEditKind(rmKey.opp(c, o)) ? `<a data-act="oppitemrm" data-op="${o.id}" data-item="${esc(pid)}"
                style="cursor:pointer;font-weight:700" title="Take this product off the opportunity">×</a>` : ''}
            </span>`;
          }).join('')}
        </div>` : ''}
        ${aiState && aiState.configured && aiState.reachable ? `<div class="ai-cluster">`
          + taskAskBox('analyzeOpp-' + esc(o.id), 'Analyze',
            'The facts from your records, then the model\'s reading of them.',
            { action: 'analyze-opp', targetId: o.id,
              question: 'What are the current risks and what should I do next?' },
            [{ label: 'What should I do next?', question: 'What should I do next on this opportunity?' },
             { label: 'Find risks', question: 'Find the risks on this opportunity.' },
             { label: 'Find missing information', question: 'What information is missing on this opportunity?' }])
          + taskAskBox('suggestProducts-' + esc(o.id), 'Suggest Products',
            '§13: picked only from the Product Reference — nothing is attached and no SA is contacted.',
            { action: 'suggest-products', targetId: o.id,
              question: 'Which products from the Reference fit this opportunity?' })
          + `</div>` : ''}
        ${canEditKind(rmKey.opp(c, o)) ? (() => {
          const pool = (D.products || []).filter(p => !(o.items || []).includes(p.id));
          return pool.length ? `<div class="row" style="gap:6px;margin-bottom:var(--s3)">
            <select class="pick" id="oppItem${o.id}" style="flex:1;min-width:0">
              ${pool.map(p => `<option value="${esc(p.id)}">${esc(p.n)} — ${esc(p.cat)}</option>`).join('')}
            </select>
            <button class="btn sm" data-act="oppitem" data-op="${o.id}"
              title="Attach a product from the catalogue to this opportunity">+ Product</button>
          </div>` : '';
        })() : ''}
        <div class="row">
          <button class="btn sm ai" data-act="diff" data-id="${o.id}">Update from a meeting</button>
          <div class="spacer"></div>
          ${rmBar(rmKey.opp(c, o), o.t)}
          ${canEditKind(rmKey.opp(c, o)) ? `<button class="btn sm" data-act="ed" data-ed="${rmKey.opp(c, o)}">Edit</button>` : ''}
        </div>
        ${edFor === rmKey.opp(c, o) ? edForm(rmKey.opp(c, o), oppFormValues(o)) : ''}
      </div>`).join('')}
    </div>`).join('')}`;
}

/* An interaction entry carries the outcome; the meeting it came from carries
   the room. "We met them on the 6th" that cannot say who was there sends you
   back into the meeting record to answer a question the history should have
   answered. Match on the customer, the date and the title — the same three
   things the writer copies across — and say nothing when no meeting matches,
   which is the honest reading of an entry whose meeting has since been taken
   off the book. */
function tlRoom(c, t){
  if (!TL_IS_INTERACTION(t.k)) return '';
  const m = (D.interactions || []).find(x => x.c === c.id && x.d === t.d && x.t === t.t);
  return m && m.att ? String(m.att).trim() : '';
}

/* Timeline: newest first, grouped by month. Old months stay — collapsed,
   never hidden — because “when did we last speak to them” is a question you
   ask about quarters, not days. */
function tabTimeline(c){
  const ev = c.timeline.slice().sort((a, b) => b.d.localeCompare(a.d));
  const months = [...new Set(ev.map(t => t.d.slice(0, 7)))];
  const in30 = ev.filter(t => dayGap(t.d) <= 30).length;
  const meets = ev.filter(t => TL_IS_INTERACTION(t.k)).length;
  const allOpen = months.every(k => tlOpen.has(k));
  /* You are already inside the customer, so the meeting form here needs no
     customer picker — it is this customer's meeting by construction. */
  return `${addBarFor('interactions', { label:'Log an interaction with ' + c.name.split(' ')[0] })}
  <div class="card" style="padding:0">
    <div class="strip">
      <span class="sstat"><span class="n">${ev.length}</span><span class="l">event${ev.length === 1 ? '' : 's'}</span></span>
      <span class="sstat"><span class="n">${meets}</span><span class="l">interaction${meets === 1 ? '' : 's'}</span></span>
      <span class="sstat"><span class="n">${in30}</span><span class="l">in the last 30 days</span></span>
      <div class="spacer"></div>
      ${months.length ? `<button class="btn sm" data-act="tlall">${allOpen ? 'Collapse old months' : 'Open every month'}</button>` : ''}
    </div>
    ${ev.length ? months.map(k => {
      const list = ev.filter(t => t.d.slice(0, 7) === k);
      const open = tlOpen.has(k);
      return `<button class="mg ${open ? 'open' : ''}" data-tl="${k}">
          <span class="tw">›</span><span class="l">${fmtMon(k)}</span><span class="n">${list.length}</span>
        </button>
        ${open ? list.map(t => { const room = tlRoom(c, t); return `<div class="pr">
          <span class="pr-m" style="width:72px;flex:0 0 72px">${fmtDay(t.d)}</span>
          <span class="tag ${tlKindClass(t.k)}" style="flex:0 0 auto">${tlKindLabel(t.k)}</span>
          <span class="pr-main">
            <span class="pr-n" style="font-weight:500">${esc(tlTitle(t.t))}</span>
            <span class="pr-t">${esc(t.x)}</span>
            ${room ? `<span class="tiny muted" style="display:block;margin-top:3px"
              title="Who was there, from the meeting record">in the room: ${esc(room)}</span>` : ''}
          </span>
          ${t.k === 'note' ? rmBar(rmKey.note(c, t), 'this note') : ''}
        </div>`; }).join('') : ''}`;
    }).join('') : `<div class="empty" style="padding:var(--s6) var(--s5)">
        Nothing has happened on this account yet. The first thing you log here
        becomes the start of its history — and the answer to “when did we last
        speak to them” that a new colleague will ask in six months.
      </div>`}
  </div>`;
}

/* Scoped find — one box for the whole customer. This is retrieval, not AI:
   it matches text that is already in the record and tells you which tab the
   answer lives in. No model is asked to guess, and nothing is invented. */
function custFind(c){
  const q = custQ.trim().toLowerCase();
  if (!q) return '';
  const hit = (s) => String(s ?? '').toLowerCase().includes(q);
  const out = [];
  c.contacts.forEach(p => { if (hit(p.n + ' ' + p.t + ' ' + p.note + ' ' + p.o)) out.push({ tab:'people', t:p.n, x:p.t + ' · ' + p.s }); });
  oppsOf(c.id).forEach(o => { if (hit(o.t + ' ' + o.desc + ' ' + o.stage + ' ' + o.cust)) out.push({ tab:'opportunities', t:o.t, x:money(o.v) + ' · ' + o.stage }); });
  D.interactions.filter(m => m.c === c.id).forEach(m => { if (hit(m.t + ' ' + m.sum + ' ' + m.out + ' ' + m.att)) out.push({ tab:'timeline', t:m.t, x:fmtDay(m.d) + ' · ' + tlKindLabel('interaction') }); });
  c.timeline.forEach(t => { if (hit(t.t + ' ' + t.x) && !out.some(h => h.t === t.t)) out.push({ tab:'timeline', t:tlTitle(t.t), x:fmtDay(t.d) + ' · ' + tlKindLabel(t.k) }); });
  c.apps.forEach(a => { if (hit(a.n + ' ' + a.v + ' ' + (a.note || ''))) out.push({ tab:'run', t:a.n, x:a.v + ' · ' + a.stance }); });

  return `<div class="card" style="padding:0;margin-bottom:var(--s4)">
    <div class="strip">
      <span class="sstat"><span class="n">${out.length}</span>
        <span class="l">match${out.length === 1 ? '' : 'es'} for “${esc(custQ)}”</span></span>
      <div class="spacer"></div>
      <button class="btn sm" data-act="clearq">Clear</button>
    </div>
    ${out.length ? out.map(h => `<button class="find-row" data-jump="${h.tab}">
        <span class="pr-main"><span class="ft">${esc(h.t)}</span><span class="fx">${esc(h.x)}</span></span>
        <span class="tag t-grey">${{people:'People',opportunities:'Opportunities',timeline:'Timeline',run:'What they run'}[h.tab]}</span>
        <span class="pr-c">›</span>
      </button>`).join('')
      : `<div class="empty">Nothing in this customer matches “${esc(custQ)}”.</div>`}
  </div>`;
}

function screenPeople(){
  const q = peopleQ.trim().toLowerCase();
  const list = D.customers
    .filter(c => !peopleC || c.id === peopleC)
    .map(c => ({ c, people: c.contacts.filter(p =>
        (!q || (p.n + ' ' + p.t + ' ' + p.note + ' ' + c.name).toLowerCase().includes(q))
        && (peopleStance === 'any' || p.s === peopleStance)) }))
    .filter(x => x.people.length);
  const shown = list.reduce((a,x) => a + x.people.length, 0);
  const total = D.customers.reduce((a,c)=>a + c.contacts.length, 0);

  if (!list.length){
    return `
    <div class="phead"><div><h1>People</h1><p class="sub">${total} ${total === 1 ? 'person' : 'people'}</p></div></div>
    ${peopleBar()}
    ${addBarFor('gpeople')}
    <div class="card"><div class="empty">
      <div style="display:flex;justify-content:center;margin-bottom:var(--s3)">${ART.empty}</div>
      Nobody here matches “${esc(peopleQ)}”.<br />Try a name, a title, or a customer from the picker.
    </div></div>`;
  }

  return `
  <div class="phead">
    <div><h1>People</h1>
      <p class="sub">${shown === total ? total + (total === 1 ? ' person' : ' people') : shown + ' of ' + total + ' people'} · grouped by the customer they belong to</p></div>
  </div>
  ${peopleBar()}
  ${addBarFor('gpeople')}
  ${(() => {
    /* A person is a CARD, not a row: who they are, where they stand, how to
       reach them, and an Edit that works right here — the Dribbble contact-card
       shape Kelvin pointed at. Groups cap at twenty customers; search and
       filters override the cap. */
    const groupHtml = list.map(({c, people}) => `
    <div style="margin-bottom:var(--s5)">
      <div class="row" style="margin-bottom:var(--s2);gap:9px">
        ${logo(c, 18)}
        <strong style="font-size:13.5px">${esc(c.name)}</strong>
        <span class="tiny muted">${esc(c.industry)} · ${esc(c.hq)}</span>
        <div class="spacer"></div>
        <span class="tiny muted">${people.length === c.contacts.length
          ? people.length + (people.length === 1 ? ' person' : ' people')
          : people.length + ' of ' + c.contacts.length + ' people'}</span>
        <button class="btn sm" data-open="${c.id}">Open customer</button>
      </div>
      <div class="grid g2" style="align-items:stretch">
        ${people.map(p => personMiniCard(c, p)).join('')}
      </div>
    </div>`);
    if (!q && !peopleC && peopleStance === 'any' && !peopleShowAll && groupHtml.length > 20){
      return groupHtml.slice(0, 20).join('')
        + `<button class="more" data-act="pshowall" style="margin-bottom:var(--s4)">Show all ${groupHtml.length} customers ↓</button>`;
    }
    return groupHtml.join('');
  })()}`;
}

function peopleBar(){

    </select>

function screenOpportunities(){
  /* §12: the board must not be the ONLY way to manage opportunities. A board
     answers "where is everything"; it cannot answer "show me CelcomDigi's two
     deals worth over RM 1m whose close date is this quarter", because that is
     a question about values, not about position. At volume the board also
     stops being scannable — every card is the same size whether it is worth
     RM 5k or RM 5m. So List is a first-class view, not a fallback.
     `view.cview` is the same switch the customer page uses, so the control
     sits in the same place and behaves the same way on both screens. */
  if (view.cview === 'list'){
    const rows = Object.values(D.opps).filter(o => inScope(o.c));
    const open = rows.filter(o => D.stages.includes(o.stage));
    const sorted = rows.slice().sort((a,b) => b.v - a.v);
    return `
    <div class="phead">
      <div><h1>Opportunities</h1><p class="sub">One row per opportunity, largest first — the shape the board cannot show</p></div>
      <div class="spacer"></div>
      <div class="seg">
        <button data-cv="board">Board</button>
        <button class="on" data-cv="list">List</button>
      </div>
      ${addBarFor('opportunities', { only:'btn', pri:true, pickCustomer:true, label:'+ New opportunity' })}
    </div>
    ${addBarFor('opportunities', { only:'form', pickCustomer:true })}
    <div class="card" style="padding:0;overflow-x:auto">
      <table>
        <thead><tr>
          <th>Opportunity</th><th>Customer</th><th>Stage</th><th style="white-space:nowrap">Owner</th>
          <th style="text-align:right;white-space:nowrap">Value</th><th style="text-align:right;white-space:nowrap">Prob</th>
          <th style="text-align:right;white-space:nowrap">Weighted</th><th style="white-space:nowrap">Close</th><th style="white-space:nowrap">In stage</th><th></th>
        </tr></thead>
        <tbody>${sorted.map(o => {
          const c = cust(o.c);
          const onPath = D.stages.includes(o.stage);
          const toClose = o.close ? -dayGap(o.close) : null;
          const k = rmKey.opp(c, o);
          return `<tr>
            <td><strong>${esc(o.t)}</strong></td>
            <td>${esc(c.name)}</td>
            <td>${onPath ? `<span class="tag ${stageCls(o.stage)}">${esc(o.stage)}</span>` : `<span class="tag t-grey">${esc(o.stage)}</span>`}</td>
            <td>${o.owner ? `<span style="white-space:nowrap">${esc(o.owner)}</span>` : '<span class="muted">unowned</span>'}</td>
            <td class="mono" style="text-align:right;white-space:nowrap">${money(o.v)}</td>
            <td class="tiny muted" style="text-align:right;white-space:nowrap">${o.p}%</td>
            <td class="mono" style="text-align:right;white-space:nowrap">${money(Math.round(o.v * o.p / 100))}</td>
            <td class="tiny" style="white-space:nowrap">${o.close ? esc(o.close) + (toClose != null && toClose < 0 ? ` <span class="tag t-warn">overdue</span>` : '') : '<span class="muted">—</span>'}</td>
            <td class="tiny muted" style="white-space:nowrap" title="${esc(oppWhy(o))} — §13: the deal's own evidence">${oppAge(o)}d</td>
            <td style="white-space:nowrap">
              ${canEditKind(k) ? `<button class="btn sm" data-act="ed" data-ed="${k}">Edit</button>` : ''}
              ${rmBar(k, o.t)}
            </td>
          </tr>
          ${edFor === k ? `<tr><td colspan="10" style="padding:0">${edForm(k, oppFormValues(o))}</td></tr>` : ''}`;
        }).join('') || `<tr><td colspan="10"><div class="col-empty">No opportunities yet.</div></td></tr>`}</tbody>
      </table>
    </div>
    <p class="sub" style="margin-top:var(--s3)">${open.length} open · ${rows.length - open.length} parked · ${cm(rows.reduce((a,o)=>a+o.v,0))} total</p>`;
  }

  const cols = D.stages.map((s, i) => {
    const list = Object.values(D.opps).filter(o => o.stage === s && inScope(o.c)).sort((a,b) => oppAge(b) - oppAge(a));
    const tot = list.reduce((a,o) => a + o.v, 0);
    return `<div class="col${list.length ? '' : ' col-none'}">
      <div class="col-h"><span class="col-pill ${stageCls(s)}"></span><span class="n">${s}</span><span class="c">${list.length}</span>
        <span class="col-t">${list.length ? cm(tot) : ''}</span></div>
      ${list.map(o => {
        const c = cust(o.c);
        /* dayGap() is (today − close); a future close is negative, so −dayGap = days until it closes. */
        const toClose = o.close ? -dayGap(o.close) : null;
        return `<div class="opp">
          <div class="opp-h">
            ${logo(c, 26)}
            <div class="opp-id">
              <div class="t">${esc(o.t)}</div>
              <div class="m">${esc(c.name)}</div>
            </div>
          </div>
          ${o.owner ? `<div class="opp-own"><span class="av">${esc(initials(o.owner))}</span>${esc(o.owner)}</div>` : ''}
          <div class="f">
            <span class="mono amt">${money(o.v)}</span>
            ${toClose === 0 ? '<span class="tag t-warn">⏳ Closes today</span>'
              : o.age > 30 ? `<span class="tag t-warn">${oppAge(o)}d in stage</span>` : ''}
            <div class="spacer"></div>
            <span class="tiny muted">${o.p}%</span>
          </div>
          <div class="tiny muted" style="margin-top:5px;line-height:1.45">${esc(oppWhy(o))}</div>
        </div>`;
      }).join('') || `<div class="col-empty">No opportunities here yet.</div>`}
    </div>`;
  }).join('');

  /* Parked = everything not on the board: won, lost, deliberately paused. It is
     drawn, not just counted, because a won opportunity is the whole point of the
     work — and a number nobody can open is a number nobody trusts. */
  const all = Object.values(D.opps).filter(o => inScope(o.c));
  const open = all.filter(o => D.stages.includes(o.stage));
  const parked = all.filter(o => !D.stages.includes(o.stage));

  return `
  <div class="phead">
    <div><h1>Opportunities</h1><p class="sub">${open.length} open · ${cm(all.reduce((a,o)=>a+o.v,0))} · weighted ${cm(all.reduce((a,o)=>a+o.v*(o.p/100),0))}</p></div>
    <div class="spacer"></div>
    <div class="seg">
      <button class="on" data-cv="board">Board</button>
      <button data-cv="list">List</button>
    </div>
    ${addBarFor('opportunities', { only:'btn', pri:true, pickCustomer:true, label:'+ New opportunity' })}
  </div>
  ${addBarFor('opportunities', { only:'form', pickCustomer:true })}
  <div class="board" data-tour="board">${cols}</div>
  <h2 style="margin-top:var(--s7)">Parked</h2>
  <p class="sub" style="margin-bottom:var(--s3)">Won, lost or deliberately paused — not a position on the path</p>
  ${parked.length
    ? '<div class="grid g3">' + parked.map(parkedCard).join('') + '</div>'
    : '<div class="parked-empty">Nothing parked. Every opportunity is still on the path.</div>'}`;
}

function parkedCard(o){
  const c = cust(o.c);
  const k = rmKey.opp(c, o);
  return `<div class="card">
    <div class="row" style="align-items:flex-start;margin-bottom:var(--s2)">
      ${logo(c, 20)}
      <div style="flex:1;min-width:0">

    <div class="row">
      <span class="mono" style="font-size:13px;font-weight:600">${money(o.v)}</span>

}

let meetQ = '', meetC = '', peopleC = '', peopleQ = '';
/* Two filters that used to be drawn and did nothing. A control that looks
   like a choice but never changes the list is worse than no control. */
let meetRange = 'Last 90 days';
let peopleStance = 'any';
let peopleShowAll = false;   /* at fifty customers the People page caps at twenty groups until asked for more */

/* Past months start collapsed; the current month is open. Nothing is hidden —
   a collapsed month still shows its count, so a card can never go missing. */
let openMonths = new Set([todayISO().slice(0, 7)]);

    </select>

    <span class="tiny muted">Searching opens every month that has a match.</span>
  </div>
  <div id="mList"></div>`;
}

function drawInteractions(){
  const el = document.getElementById('mList');
  if (!el) return;
  const q = meetQ.trim().toLowerCase();
  const today = todayISO();
  const rows = D.interactions.filter(m => {
    if (meetC && m.c !== meetC) return false;
    /* The range is a promise the screen now keeps: the list really is the
       last 90 days / this month / everything. */
    if (meetRange === 'This month' && String(m.d).slice(0, 7) !== today.slice(0, 7)) return false;
    if (meetRange === 'Last 90 days' && dayGap(m.d) > 90) return false;
    if (!q) return true;
    const c = cust(m.c);
    return (m.t + ' ' + m.sum + ' ' + m.out + ' ' + m.att + ' ' + m.loc + ' ' + c.name)
      .toLowerCase().includes(q);
  });
  if (!rows.length){
    el.innerHTML = `<div class="card"><div class="empty">
      <div style="display:flex;justify-content:center;margin-bottom:var(--s3)">${ART.empty}</div>
      No interaction matches “${esc(meetQ)}”.<br />Try a customer, a person or a place — or clear the picker.
    </div></div>`;
    return;
  }
  /* Grouped by month, newest first — so a card never disappears, it just moves
     down a month. Past months are COLLAPSED, not hidden: the count stays
     visible and one click opens them. Searching overrides the collapse. */
  const groups = [];
  rows.forEach(m => {
    const k = m.d.slice(0, 7);
    let g = groups.find(x => x.k === k);
    if (!g){ g = { k, items: [] }; groups.push(g); }
    g.items.push(m);
  });
  const MN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  el.innerHTML = groups.map(g => {
    const open = q ? true : openMonths.has(g.k);
    return `
    <button class="mg ${open ? 'open' : ''}" data-mg="${g.k}">
      <span class="tw">›</span>
      <span class="l">${MN[+g.k.slice(5,7) - 1]} ${g.k.slice(0,4)}</span>
      <span class="n">${g.items.length}</span>
      ${open ? '' : `<span class="tiny muted">· collapsed, click to open</span>`}
    </button>
    ${open ? `<div class="grid g2" style="margin-bottom:var(--s4)">
      ${g.items.map(m => interactionCard(m)).join('')}
    </div>` : ''}`;
  }).join('');
}

function screenInsights(){
  const opps = Object.values(D.opps);
  const nm = (id) => ((cust(id) || {}).name) || '';
  const uniq = (a) => a.filter((x, i) => a.indexOf(x) === i);

  /* The pipeline table: every stage, how many, how much, weighted - computed
     from the records, identical for everybody who opens it. This is the
     number a manager opens a CRM for; it used to live nowhere. */
  const scoped = opps.filter(o => inScope(o.c) && D.stages.includes(o.stage));
  const byStage = D.stages.map(st => {
    const list = scoped.filter(o => o.stage === st);
    return { st, n: list.length, v: list.reduce((a, o) => a + o.v, 0),
      w: list.reduce((a, o) => a + o.v * o.p / 100, 0) };
  });
  const totV = byStage.reduce((a, r) => a + r.v, 0);
  const totW = byStage.reduce((a, r) => a + r.w, 0);
  const topDeals = scoped.slice().sort((a, b) => b.v * b.p - a.v * a.p).slice(0, 5);
  const pipelineCard = `
  <h2 style="margin-top:var(--s5)">Pipeline</h2>
  <div class="card" style="padding:0;margin-bottom:var(--s5)">
    <div class="strip">
      <span class="sstat"><span class="n">${cm(totV)}</span><span class="l">open pipeline</span></span>
      <span class="sstat"><span class="n">${cm(totW)}</span><span class="l">weighted</span></span>
      <span class="sstat"><span class="n">${scoped.length}</span><span class="l">opportunit${scoped.length === 1 ? 'y' : 'ies'}</span></span>
      <div class="spacer"></div>
    </div>
    ${byStage.map(r => `<div class="row" style="padding:10px var(--s4);border-bottom:1px solid var(--line)">
      <span class="stage-pill ${stageCls(r.st)}" style="flex:0 0 auto">${esc(r.st)}</span>
      <span class="tiny muted" style="flex:1">${r.n} opportunit${r.n === 1 ? 'y' : 'ies'}</span>
      <span class="mono" style="font-size:13px">${money(r.v)}</span>
      <span class="tiny muted" style="width:110px;text-align:right">weighted ${money(r.w)}</span>
    </div>`).join('')}
  </div>
  ${topDeals.length ? `<div class="card" style="padding:0;margin-bottom:var(--s5)">
    <div class="grp-h">Biggest open opportunities<span class="n">${topDeals.length}</span>
      <span class="why">weighted value — value × probability</span></div>
    ${topDeals.map(o => `<button class="pr" data-open="${o.c}">
      <span class="pr-main"><span class="pr-n" style="font-weight:500">${esc(o.t)}</span>
        <span class="pr-t">${esc(nm(o.c))} · ${esc(o.stage)} · ${oppAge(o)}d in stage${(o.comp && o.comp !== '—') ? ' · vs ' + esc(o.comp) : ''}</span></span>
      <span class="mono" style="font-size:13px">${money(o.v)}</span>
      <span class="tiny muted" style="flex:0 0 auto">${o.p}%</span>
      <span class="pr-c">›</span>
    </button>`).join('')}
  </div>` : ''}`;

  /* The last time anybody spoke to this customer: a meeting or a timeline
     entry, whichever is more recent. Measured the same way it is on Today, so
     the number here and the number there can never disagree. */
  const lastTouch = (c) => {
    const ds = c.timeline.map(t => t.d)
      .concat(D.interactions.filter(m => m.c === c.id).map(m => m.d))
      .filter(Boolean).sort();
    return ds.length ? dayGap(ds[ds.length - 1]) : null;
  };

  /* Six rules. Each one is a filter over records that already exist — a date
     subtraction, a count, a gap in coverage. Not one of them asks a model to
     judge anything, which is why the number is the same for everybody. */
  const stalled = opps.filter(o => oppAge(o) >= 30 && o.p <= 25).sort((a, b) => oppAge(b) - oppAge(a));
  const silent  = D.customers.map(c => ({ c, gap: lastTouch(c) }))
                    .filter(x => x.gap !== null && x.gap >= 30)
                    .sort((a, b) => b.gap - a.gap);
  const single  = D.customers.filter(c => (c.opps || []).length &&
                    c.contacts.filter(p => bandOf(p) === 'Decision maker' || bandOf(p) === 'Influencer').length < 2);
  const unseen  = D.customers.reduce((a, c) => a.concat(
                    c.contacts.filter(p => bandOf(p) === 'Decision maker' && !lastMet(c, p))
                              .map(p => ({ c, p }))), []);
  const rivals  = uniq(opps.map(o => o.comp).filter(x => x && x !== '—' && x !== '-'));
  const waiting = D.steps.filter(s => s.from === 'customer' && !stepIsDone(s));

  /* `surface` is the eighth argument and only the empty-state card passes it.
     A card that says "nothing here" should sit slightly recessed, so a quiet
     week reads as quiet rather than as five white boxes demanding attention. */
  const card = (tag, cls, n, title, line, meaning, cta, surface) => `
    <div class="card${surface ? ' ' + surface : ''}">
      <div class="row"><span class="tag ${cls}">${tag}</span><div class="spacer"></div><span class="mono tiny">${n}</span></div>
      <div style="font-size:13.5px;font-weight:600;margin-top:var(--s2)">${title}</div>
      ${line ? `<div class="tiny muted">${line}</div>` : ''}
      <div class="hr" style="margin:var(--s3) 0"></div>
      <div class="tiny" style="color:var(--ink-2)">${meaning}</div>
      <div class="row" style="margin-top:var(--s3)">${cta}</div>
    </div>`;

  /* An empty card is still a fact worth showing: "nothing is stalled" is the
     answer to the question, and a page that hides its own good news is a page
     people stop trusting. */
  /* A zero is not a red flag, it is an absence. Colouring five empty cards
     red or amber makes a quiet week look like an emergency. */
  const none = (tag, cls, what) =>
    card(tag, 't-grey', 0, 'Nothing here', '', what, `<span class="tiny muted">Nothing to act on.</span>`, 'card--recessed');

  const top = stalled[0];
  const s2  = silent[0];

  const stalledCard = !top
    ? none('Stalled', 't-ok', 'No opportunity has sat in one stage for 30 days or more at a low probability.')
    : card('Stalled', 't-warn', stalled.length, esc(top.t),
        esc(nm(top.c)) + ' · ' + oppAge(top) + ' days in ' + esc(top.stage) + ' · ' + money(top.v),
        'A deal that has not changed stage in ' + oppAge(top) + ' days is not “in progress”. It is waiting for somebody to move it, and the clock says who should be moving.',
        `<button class="btn sm ai" data-act="why" data-id="${top.id}">Why is it stuck?</button>`);

  const silentCard = !s2
    ? none('Silent', 't-ok', 'Every customer has had something logged in the last 30 days.')
    : card('Silent', 't-risk', silent.length, esc(s2.c.name),
        'No contact in ' + s2.gap + ' days',
        'Relationships cool and records go stale in silence. ' + silent.length +
        ' customer' + (silent.length === 1 ? '' : 's') + ' have had nothing logged for 30 days or more.',
        `<button class="btn sm" data-open="${s2.c.id}">Open the customer</button>`);

  const singleCard = !single.length
    ? none('Single-threaded', 't-ok', 'Every open opportunity has at least two people we can reach.')
    : card('Single-threaded', 't-warn', single.length, single.map(c => esc(c.name)).join(' · '),
        'One relationship carries the whole deal',
        'If that one person leaves, changes role or goes quiet, the opportunity restarts from zero. Two names, one backup plan each.',
        single.slice(0, 3).map(c => `<button class="btn sm" data-open="${c.id}">Open</button>`).join(''));

  const coverCard = !unseen.length
    ? none('Coverage', 't-ok', 'Every decision maker has been in a room with us.')
    : card('Coverage', 't-warn', unseen.length, 'Decision makers we have never met',
        unseen.map(x => esc(x.p.n.split(' ')[0])).join(' · '),
        'You are bidding to people who have never heard you say it. Meeting them is the cheapest thing you can do to a deal’s odds.',
        `<button class="btn sm" data-go="people">See who they are</button>`);

  const rivalCard = !rivals.length
    ? none('Competitive', 't-ok', 'No rival is named on any open opportunity.')
    : card('Competitive', 't-risk', rivals.length, 'Rivals named on open opportunities',
        rivals.map(esc).join(' · '),
        'A named rival is a deal you can prepare for. The loss reason from the last one is the argument for the next one.',
        `<button class="btn sm" data-go="opportunities">See the deals</button>`);

  const waitCard = !waiting.length
    ? none('Waiting on them', 't-grey', 'Nothing is sitting in a customer’s court right now.')
    : card('Waiting on them', 't-grey', waiting.length, 'In the customer’s court',
        uniq(waiting.map(s => nm(s.c))).map(esc).join(' · '),
        'These are not yours to chase today — but the dates are still yours to watch. “Chase it” and “let it sit” are different decisions.',
        `<button class="btn sm" data-go="today">See them on Today</button>`);

  return `
  <div class="phead">
    <div><h1>Insights</h1>
      <p class="sub">Six questions Waypoint answers exactly — each with what to do about it</p></div>
  </div>

  ${pipelineCard}

  <div class="artline">
    ${ART.chain}
    <div class="t">Every card below is made the same way: <b>records you already have</b> go
      through <b>one rule</b> and come out as <b>one number</b>. Nothing is judged by a model — which
      is why the number never changes between two people looking at it.</div>
  </div>

  <div class="grid g3" style="margin-top:var(--s5)">
    ${stalledCard}${silentCard}${singleCard}${coverCard}${rivalCard}${waitCard}
  </div>`;
}

   richer than the product is, and toggling one changed nothing. Removed
   rather than kept "for later": a switch that switches nothing is a lie. */
/* Snapshot for Restore — an editable matrix needs a way back. */
const CAP_DEFAULTS = JSON.parse(JSON.stringify(CAPS));

const capLabel = (row, on) => row.k === 'allCustomers' ? (on ? (row.onT || 'All') : (row.offT || 'Own'))
  : on ? 'Yes' : '—';

function toggleCap(roleKey, key){
  if (roleKey === 'admin') return;               /* you cannot unmake yourself */
  const row = CAP_ROWS.find(r => r.k === key);
  if (row && row.locked) return;                 /* export and admin controls stay with Admin */
  const before = !!CAPS[roleKey][key];
  CAPS[roleKey][key] = before ? 0 : 1;
  audit('access', 'Permission ' + (before ? 'removed' : 'granted'),
        ROLE[roleKey] + ' · ' + row.l, before ? 'Yes' : 'No', before ? 'No' : 'Yes');
  render();
}

function restoreCaps(){
  Object.keys(CAP_DEFAULTS).forEach(r => { CAPS[r] = JSON.parse(JSON.stringify(CAP_DEFAULTS[r])); });
  audit('access', 'Permissions restored to default', 'BD · SA · Manager', 'Customised', 'Default');
  render(); toast('Back to the shipped roles.');
}

/* ------------------------------------------------------- data protection --
   The most important control on this screen, and the one that needs saying
   honestly: we can remove every button that makes leaving easy, but we
   cannot stop a phone camera. So the design does both — nothing to press,
   and a name on anything that leaves anyway. */
/* A CSV a page cannot watermark still has to name its author, so the name and
   the time go on every row — one row split out of the file still carries them.
   This is the only way data leaves, so it is the one that gets audited. */
/* The file is built by the server, not here.
   Two reasons, and the second is the one that matters: a permission the
   browser checks is a preference, and a spreadsheet that left through a
   copied button would leave no trace. Asking the server means the answer is
   the server's — a BD or an SA is refused there even if they forge the click. */
async function exportCsv(){
  if (!can('export')){ toast('Export is an administrator action.'); return; }
  let r;
  try {
    r = await fetch('/api/export?kind=customers', { credentials: 'same-origin' });
  } catch {
    toast('Export failed — the server could not be reached. Nothing left the product.');
    return;
  }
  if (r.status === 403){
    toast('The server refused that — export is an administrator action. Nothing left the product.');
    return;
  }
  if (!r.ok){
    toast('Export failed — the server refused it. Nothing left the product.');
    return;
  }
  const text = await r.text();
  const rows = Math.max(0, text.trim().split(/\r?\n/).length - 1);
  const dispo = /filename="([^"]+)"/.exec(r.headers.get('Content-Disposition') || '');
  const name = dispo ? dispo[1] : 'waypoint-customers-' + todayISO() + '.csv';
  try {
    const url = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (e) {
    /* Say it failed. An export that announced itself and produced nothing is
       the exact kind of promise this product must not make. */
    toast('Export failed — the browser blocked the download. Nothing left the product.');
    return;
  }
  audit('data', 'Exported the workspace', 'CSV', '—', rows + ' customers');
  syncSave();
  toast('Exported ' + rows + ' customer' + (rows === 1 ? '' : 's')
    + ' · your name and the time are on every row · recorded on the audit trail.');
}

        <div class="tiny muted">Not a mock-up. Switching changes the rows, the counts and the buttons, everywhere.</div></div>
      <div class="spacer"></div>
      <div class="seg">
        ${ROLE_DEFS.map(r => `<button data-as="${r.k}" class="${asRole === r.k ? 'on' : ''}">${r.l}</button>`).join('')}

        <div class="tiny muted">Every customer, every number, nothing to press. There is no switch — that is the role.</div></div>
      <div class="spacer"></div><span class="tag t-grey">By design</span>
    </div>` : ''}
    ${asRole !== 'admin' ? `

      <span class="tag t-violet">You are looking through ${esc(ROLE[asRole])}’s eyes</span>

/* ============================================================================ */
/*  Admin as a control room                                                    */
/*  An admin does four jobs, at four different frequencies: manage people       */
/*  (weekly), check what happened (daily), set the AI and the model (rarely,    */
/*  and never casually), and keep an eye on the jobs (when something looks      */
/*  stale). Explaining the role model is a fifth job that happens once.         */
/*  So the screen is tabbed by FREQUENCY, not by topic — the everyday actions   */
/*  are one click away and nothing explanatory sits between the admin and       */
/*  the thing they came to do.                                                  */
/* ============================================================================ */
const ADMIN_TABS = [
  { k:'people', l:'People' },
  { k:'audit',  l:'Audit'  },
  { k:'roles',  l:'Roles'  },
  { k:'ai',     l:'AI & model' },
  { k:'jobs',   l:'Jobs'   }
];
let adminTab = 'people';
let auditKind = 'all';
let auditQ = '';

const AUDIT_K = {
  all:    { l:'Everything' },
  access: { l:'Accounts & access' },
  data:   { l:'Records' },
  ai:     { l:'AI & model' },
  job:    { l:'Jobs' },
  sec:    { l:'Security' }
};

/* Writing to the log is part of the act, not an afterthought — an audit you
   remember to call is an audit with holes in it. */
function audit(k, what, rec, from, to){
  /* Attributed to whoever is signed in — an audit row that names the wrong
     person is worse than no audit row, because it will be believed. */
  D.audit.unshift({ id:'a' + Date.now(), d:todayISO(), tm:new Date().toTimeString().slice(0, 5),
                    who:(D.me && D.me.name) || 'Unknown', role:(D.me && D.me.role) || asRole,
                    k, what, rec:rec || '—', from:from || '—', to:to || '—' });
}

const auditDay = (d) => d === todayISO() ? 'Today'
  : d === daysAgoISO(1) ? 'Yesterday'
  : fmtDay(d);

function adminAudit(){
  const all = D.audit;
  const q = auditQ.trim().toLowerCase();
  const list = all.filter(a =>
    (auditKind === 'all' || a.k === auditKind) &&
    (!q || (a.who + ' ' + a.what + ' ' + a.rec + ' ' + a.to).toLowerCase().includes(q)));
  const days = [...new Set(list.map(a => a.d))];
  const counts = Object.keys(AUDIT_K).reduce((o, k) => {
    o[k] = k === 'all' ? all.length : all.filter(a => a.k === k).length; return o;
  }, {});

  return `
  <div class="row" style="margin-bottom:var(--s4);gap:8px;flex-wrap:wrap">
    <div class="seg">
      ${Object.entries(AUDIT_K).map(([k, v]) => `<button data-ak="${k}" class="${auditKind === k ? 'on' : ''}">${v.l}
        <span class="c">${counts[k]}</span></button>`).join('')}
    </div>
    <div class="spacer"></div>
    <input data-aq value="${esc(auditQ)}" placeholder="Find a person, a record, a change…"
      style="width:260px;border:1px solid var(--line-2);border-radius:var(--r-ctl);padding:6px 10px;font-size:13px" />
  </div>

  ${!list.length ? `<div class="card"><div class="tiny muted">Nothing here for that filter — which is a
    legitimate answer, not a failure.</div></div>` : ''}

  ${days.map(day => `
    <div class="grp-h">${esc(auditDay(day))}<span class="tiny muted">${list.filter(a => a.d === day).length}</span></div>
    <div class="card" style="padding:0;margin-bottom:var(--s4)">
      ${list.filter(a => a.d === day).map(a => `
        <div class="pr" style="align-items:flex-start">
          <span class="pr-m" style="width:48px;flex:0 0 48px;padding-top:2px" class="mono">${esc(a.tm)}</span>
          <span class="tag ${a.k === 'sec' ? 't-risk' : a.k === 'ai' ? 't-violet' : 't-grey'}"
            style="flex:0 0 auto">${esc((AUDIT_K[a.k] || AUDIT_K.data).l)}</span>
          <span class="pr-main">
            <span class="pr-n" style="font-weight:500">${esc(a.what)}
              <span class="muted" style="font-weight:400">· ${esc(a.rec)}</span></span>
            <span class="pr-t">${esc(a.who)}${a.role && a.role !== '—' ? ' · ' + esc(ROLE[a.role] || a.role) : ''}</span>
          </span>
          <span class="pr-m" style="width:230px;flex:0 0 230px">
            <span class="tiny muted">${esc(a.from)}</span>
            <span class="tiny muted"> → </span>
            <span class="tiny" style="font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px" title="${esc(a.to)}">${esc(String(a.to).slice(0, 80))}</span>
          </span>
        </div>`).join('')}
    </div>`).join('')}

`;
}

/* The whole roster, on the Admin screen.
   This was also called `teamCard` — the same name as the card that lists who
   is on ONE customer. Two functions, one name, no error: the later one won,
   so every customer's Brief tab quietly rendered the company roster instead
   of its own team, and the real team card was never drawn at all. */
/* ------------------------------------------------------------------ import
   Bringing a book of 30 customers in by hand is a day of typing nobody does
   twice. The import is deliberately narrow: one paste, one preview, one
   button. §26 widened it from customers to the four things that hang off a
   customer — people, opportunities, interactions, next steps — and widened
   nothing else: the administrator is still the only importer, because the
   import IS the book.
   The one rule that governs the four new kinds: every row must name a
   customer already on the book, by name, case-insensitively. The import
   creates relationships, never orphans — a next step hanging off nothing is
   a promise nobody can see kept. A row whose customer is not found, or that
   misses a required value, is refused in the preview with the reason said
   out loud, never silently dropped; and the server holds the same line on
   every write from every client: a step, an interaction or an opportunity
   that names a customer the book does not hold is refused outright. */
const IMPORT_KINDS = {
  /* `head` is the header-spelling check that keeps a pasted export from
     becoming a row called "Customer" — customers has always accepted both
     spellings, and the regex is built from this string as-is. */
  customers:    { label: 'Customers',     head: 'name|customer', cols: 'name, industry, hq, website, owner' },
  people:       { label: 'People',        head: 'customer', cols: 'customer, name, title, band, email, phone' },
  opps:         { label: 'Opportunities', head: 'customer', cols: 'customer, title, value RM, stage, close date, description' },
  interactions: { label: 'Interactions',  head: 'customer', cols: 'customer, title, date, kind, attendees, outcome' },
  steps:        { label: 'Next steps',    head: 'customer', cols: 'customer, title, due date, owner, whose move' },
};
let importState = null;   /* { kind, rows, refused, done, made } */

const findCust = (name) => D.customers.find(
  (x) => x.name.toLowerCase() === String(name || '').trim().toLowerCase());

function openImport(kind){
  importState = { kind: IMPORT_KINDS[kind] ? kind : 'customers', rows: [], refused: [], done: false };
  const veil = document.getElementById('capVeil');
  veil.classList.add('on');
  document.querySelector('#capVeil .sheet-h').innerHTML = `
    <strong style="font-size:14.5px">Import</strong>
    <span class="tiny muted">paste CSV — pick what you are bringing in</span><div class="spacer"></div>
    <button class="btn sm" id="capClose10">Close</button>`;
  document.getElementById('capClose10').onclick = closeCapture;
  drawImport();
}

/* The placeholder names a customer that is really on the book, so the sample
   row pasted as-is is a row that works — the fastest way to show the shape. */
function importPlaceholder(){
  const me = (D.me && D.me.name) || 'Teh Bin Shun';
  const c0 = (D.customers[0] || {}).name || 'Sunrise Retail Group';
  switch (importState.kind){
    case 'people':
      return 'Customer, Name, Title, Band, Email, Phone\n'
        + c0 + ', Sarah Lim, Head of IT, Decision maker, sarah.lim@example.com, +60 3-2000 1000';
    case 'opps':
      return 'Customer, Title, Value, Stage, Close date, Description\n'
        + c0 + ', Migration assessment, 250000, Evaluating, 2026-12-15, Six-week assessment of the order platform';
    case 'interactions':
      return 'Customer, Title, Date, Kind, Attendees, Outcome\n'
        + c0 + ', Kickoff call, 2026-09-12, Call, Their CTO and two architects, Scope agreed for the assessment';
    case 'steps':
      return 'Customer, Title, Due date, Owner, Whose move\n'
        + c0 + ', Send architecture notes, 2026-10-05, ' + me + ', us';
    default:
      return 'Customer, Industry, HQ, Website, Owner\n'
        + 'Sunrise Retail Group, Retail, Kuala Lumpur, sunriseretail.com.my, Ahmad Faiz';
  }
}

function importPaste(){
  const spec = IMPORT_KINDS[importState.kind];
  const note = importState.kind === 'customers'
    ? 'Empty industry/hq/website/owner cells are fine; a row without a name is refused and shown back to you.'
    : 'The customer column must name a customer already on the book — the case does not matter, the match has to. '
      + 'An empty optional cell takes that kind\u2019s default; a value the record cannot hold — a stage that is not a stage, '
      + 'a date that is not a date — refuses the row.';
  return `
    <p class="tiny muted" style="margin-top:0">Paste rows of <b>${esc(spec.cols)}</b> — with or without a header row. ${note}</p>
    <textarea id="impT" rows="10" style="${FLD};width:100%;min-height:180px;resize:vertical"
      placeholder="${esc(importPlaceholder())}"></textarea>
    <div class="row" style="margin-top:var(--s4)">
      <button class="btn pri" id="impRead">Read the rows</button>
    </div>`;
}

/* One reader, five shapes. Every row that cannot become a real record is
   refused WITH the reason — the person pasting sees exactly which line and
   exactly what is wrong with it, which is the only honest way to fix a
   spreadsheet. */
function readImportRows(){
  const text = (document.getElementById('impT') || {}).value || '';
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (!lines.length){ toast('Paste the rows first.'); return; }
  const cut = (l) => l.split(',').map(x => x.trim());
  let rows = lines.map(cut);
  /* Accept the obvious header spelling for whichever door is open, so a
     pasted export does not become a row called "customer". */
  const head = IMPORT_KINDS[importState.kind].head;
  if (new RegExp('^(' + head + ')\\s*,', 'i').test(lines[0])) rows = rows.slice(1);
  const out = [];
  const refused = [];
  /* Two rows in one paste can name the same new customer; the book cannot
     hold both, so the second is a duplicate exactly like the first kind. */
  const seen = new Set(D.customers.map(c => c.name.toLowerCase()));
  /* Same story for a person: two rows naming one person on one customer. */
  const seenPeople = new Set();
  /* The customer lookup every non-customer kind begins with. */
  const need = (cname) => {
    if (!cname) return { why: 'no customer' };
    const c = findCust(cname);
    return c ? { c } : { why: '"' + cname + '" is not on the book' };
  };
  /* A date that is not a date is worse than none — it will be compared and
     sorted forever. Real ISO date, or the cell is empty. */
  const badIso = (v) => !!v && !/^\d{4}-\d{2}-\d{2}$/.test(v);
  for (const r of rows){
    const raw = r.join(',');
    if (importState.kind === 'customers'){
      const name = (r[0] || '').slice(0, 120);
      if (!name){ refused.push({ line: raw, why: 'no name' }); continue; }
      if (seen.has(name.toLowerCase())){
        refused.push({ line: raw, why: name + ' is already on the book' }); continue;
      }
      seen.add(name.toLowerCase());
      out.push({ cust: null, row: {
        name, industry: (r[1] || 'Unclassified').slice(0, 60),
        hq: (r[2] || '-').slice(0, 80),
        site: (r[3] || '').replace(/^https?:\/\//i, '').replace(/\/$/, '').slice(0, 120),
        owner: (r[4] || ((D.me && D.me.name) || '')).slice(0, 80),
      } });
    } else if (importState.kind === 'people'){
      const f = need(r[0]);
      if (f.why){ refused.push({ line: raw, why: f.why }); continue; }
      const n = (r[1] || '').slice(0, 80);
      if (!n){ refused.push({ line: raw, why: 'no name' }); continue; }
      const pk = f.c.id + '|' + n.toLowerCase();
      if ((f.c.contacts || []).some(p => p.n === n) || seenPeople.has(pk)){
        refused.push({ line: raw, why: n + ' is already on ' + f.c.name }); continue;
      }
      seenPeople.add(pk);
      const b = r[3] || 'Influencer';
      if (!BANDS.includes(b)){
        refused.push({ line: raw, why: 'band must be one of: ' + BANDS.join(', ') }); continue;
      }
      out.push({ cust: f.c, row: { n, t: (r[2] || '-').slice(0, 80), b,
        em: (r[4] || '').slice(0, 120), ph: (r[5] || '').slice(0, 40) } });
    } else if (importState.kind === 'opps'){
      const f = need(r[0]);
      if (f.why){ refused.push({ line: raw, why: f.why }); continue; }
      const t = (r[1] || '').slice(0, 120);
      if (!t){ refused.push({ line: raw, why: 'no title' }); continue; }
      const stage = r[3] || 'Interested';
      if (!D.stages.includes(stage)){
        refused.push({ line: raw, why: 'stage must be one of: ' + D.stages.join(', ') }); continue;
      }
      const close = (r[4] || '').trim();
      if (badIso(close)){
        refused.push({ line: raw, why: 'the close date needs to look like 2026-12-15 — or be left empty' }); continue;
      }
      out.push({ cust: f.c, row: {
        t, v: Number(String(r[2] || '').replace(/[^0-9.]/g, '')) || 0,
        stage, close, desc: (r[5] || '').slice(0, 400) } });
    } else if (importState.kind === 'interactions'){
      const f = need(r[0]);
      if (f.why){ refused.push({ line: raw, why: f.why }); continue; }
      const t = (r[1] || '').slice(0, 120);
      if (!t){ refused.push({ line: raw, why: 'no title' }); continue; }
      const d = (r[2] || '').trim() || todayISO();
      if (badIso(d)){ refused.push({ line: raw, why: 'the date needs to look like 2026-09-12' }); continue; }
      const k = r[3] || 'Meeting';
      if (!['Meeting', 'Call', 'Email', 'Video call'].includes(k)){
        refused.push({ line: raw, why: 'kind must be one of: Meeting, Call, Email, Video call' }); continue;
      }
      out.push({ cust: f.c, row: { t, d, k,
        att: (r[4] || '-').slice(0, 160), out: (r[5] || '').slice(0, 400) } });
    } else if (importState.kind === 'steps'){
      const f = need(r[0]);
      if (f.why){ refused.push({ line: raw, why: f.why }); continue; }
      const t = (r[1] || '').slice(0, 120);
      if (!t){ refused.push({ line: raw, why: 'no title' }); continue; }
      const due = (r[2] || '').trim();
      if (badIso(due)){
        refused.push({ line: raw, why: 'the due date needs to look like 2026-10-05 — or be left empty' }); continue;
      }
      const from = (r[4] || 'us').toLowerCase();
      if (from !== 'us' && from !== 'customer'){
        refused.push({ line: raw, why: 'whose move must be us or customer' }); continue;
      }
      out.push({ cust: f.c, row: { t, due,
        exec: (r[3] || '').slice(0, 80) || ((D.me && D.me.name) || ''), from } });
    }
  }
  importState.rows = out;
  importState.refused = refused;
}

/* The columns each preview shows. The customer a row hangs off is always
   one of them — on this screen it is the fact that matters most. */
function importPreviewCells(item){
  const r = item.row;
  switch (importState.kind){
    case 'people':    return [r.n, item.cust.name, r.t, r.b];
    case 'opps':      return [r.t, item.cust.name, r.v ? cm(r.v) : '-', r.stage];
    case 'interactions': return [r.t, item.cust.name, r.d, r.k];
    case 'steps':     return [r.t, item.cust.name, r.due || 'no date', r.from === 'customer' ? 'their move' : 'our move'];
    default:          return [r.name, r.industry, r.hq, r.owner];
  }
}

function importPreview(){
  const st = importState;
  return `
    <div class="row" style="margin-bottom:var(--s3)">
      <strong style="font-size:13.5px">${st.rows.length} row${st.rows.length === 1 ? '' : 's'} to import</strong>
      <div class="spacer"></div>
      <span class="tiny muted">${st.refused.length} refused</span>
    </div>
    <div class="card" style="padding:0;margin-bottom:var(--s4);max-height:260px;overflow:auto">
      ${st.rows.map((item) => `
        <div class="row" style="padding:8px var(--s4);border-bottom:1px solid var(--line)">
          ${importPreviewCells(item).map((cell, i) => `
            <span ${i === 0 ? 'style="font-size:13px;font-weight:500;flex:2;min-width:0"' : 'class="tiny muted" style="flex:1;min-width:0"'}>${esc(cell)}</span>`).join('')}
        </div>`).join('') || '<div class="empty">Nothing left to import.</div>'}
    </div>
    ${st.refused.length ? `
      <div class="tiny muted" style="margin-bottom:var(--s3)">Refused — shown back, never silently dropped:
        ${st.refused.map((x) => `<div style="margin-top:3px">· ${esc(x.line)} — <b>${esc(x.why)}</b></div>`).join('')}
      </div>` : ''}
    <div class="sheet-f" style="margin:var(--s4) calc(-1 * var(--s5)) calc(-1 * var(--s5))">
      <button class="btn" id="impBack">Paste again</button>
      <div class="spacer"></div>
      <button class="btn pri" id="impGo" ${st.rows.length ? '' : 'disabled style="opacity:.45"'}>Import ${st.rows.length}</button>
    </div>`;
}

function commitImport(){
  const st = importState;
  if (!st || st.done) return;
  const me = (D.me && D.me.name) || '';
  let made = 0;
  for (const item of st.rows){
    const c = item.cust;
    const r = item.row;
    if (st.kind === 'customers'){
      D.customers.push({
        id: 'c' + Date.now() + (made++), name: r.name, industry: r.industry, hq: r.hq,
        site: r.site, owner: r.owner, stance: 'Undecided', health: 'Watch',
        since: todayISO().slice(0, 7), people: 0, unverified: true,
        pains: [], contacts: [], apps: [], opps: [], timeline: [], team: [],
      });
      audit('data', 'Customer imported', r.name, '-', r.owner);
    } else if (st.kind === 'people'){
      (c.contacts = c.contacts || []).push({ n: r.n, t: r.t, s: 'Undecided', o: me,
        b: r.b, em: r.em, ph: r.ph, note: '' });
      audit('data', 'Person imported', r.n + ' - ' + c.name, '-', r.b);
      made++;
    } else if (st.kind === 'opps'){
      const id = 'o' + Date.now() + '-' + made;
      (D.opps = D.opps || {})[id] = { id, c: c.id, t: r.t, stage: r.stage, v: r.v, p: 10,
        stageAt: todayISO(), owner: me, comp: '-', close: r.close, cust: '', desc: r.desc, soln: '' };
      (c.opps = c.opps || []).push(id);
      audit('data', 'Opportunity imported', r.t + ' - ' + c.name, '-', r.stage);
      made++;
    } else if (st.kind === 'interactions'){
      const id = 'm' + Date.now() + '-' + made;
      (D.interactions = D.interactions || []).unshift({ id, c: c.id, t: r.t, d: r.d, w: '',
        loc: '', att: r.att, ours: me, sum: '', out: r.out, k: r.k });
      (c.timeline = c.timeline || []).unshift({ d: r.d, k: 'interaction', t: r.t, x: r.out || '' });
      audit('data', 'Interaction imported', r.t + ' - ' + c.name, '-', r.k);
      made++;
    } else if (st.kind === 'steps'){
      const id = 's' + Date.now() + '-' + made;
      /* The Tracker is not a column on the paste. It is the account\u2019s own
         Primary BD or Primary SA — the one choice §5 allows and the one the
         server enforces — so the import takes it from the account rather
         than trusting a spreadsheet to have spelled a name right. */
      const track = c.owner || c.sa || me;
      (D.steps = D.steps || []).unshift({ id, c: c.id, t: r.t, exec: r.exec, track,
        due: r.due, w: '', from: r.from, p: 'p1', done: '', doneBy: '', doneNote: '' });
      (c.timeline = c.timeline || []).unshift({ d: todayISO(), k: 'step', t: r.t,
        x: r.exec + (track && track !== r.exec ? ' · tracked by ' + track : '')
           + (r.due ? ' · due ' + r.due : '') });
      audit('data', 'Action imported', r.t + ' - ' + c.name, '-', r.exec + ' (tracked by ' + track + ')');
      made++;
    }
  }
  st.done = true; st.made = made;
  syncSave(); render(); drawImport();
  toast(made + ' row' + (made === 1 ? '' : 's') + ' imported — every one hangs off a customer on the book.');
}

function drawImport(){
  const b = document.getElementById('capBody');
  if (!b || !importState) return;
  /* The five doors. Switching kind restarts the paste: a row read for one
     shape is not a row for another, and keeping it around would invite a
     person to import people as steps. */
  b.innerHTML = `
    <div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:var(--s3)">
      ${Object.keys(IMPORT_KINDS).map((k) => `
        <button class="btn sm${importState.kind === k ? ' pri' : ''}" data-ikind="${k}">${IMPORT_KINDS[k].label}</button>`).join('')}
    </div>
    ${importState.done
      ? `<div class="empty" style="padding:var(--s4)">Imported ${importState.made} row${importState.made === 1 ? '' : 's'} into ${IMPORT_KINDS[importState.kind].label}.
          They are on the book now — open the customer and fill in the rest.</div>`
      : (importState.rows.length ? importPreview() : importPaste())}`;
  b.querySelectorAll('[data-ikind]').forEach(el => el.onclick = () => openImport(el.dataset.ikind));
  const read = document.getElementById('impRead');
  if (read) read.onclick = () => { readImportRows(); drawImport(); };
  const back = document.getElementById('impBack');
  if (back) back.onclick = () => {
    importState = { kind: importState.kind, rows: [], refused: [], done: false };
    drawImport();
  };
  const go = document.getElementById('impGo');
  if (go) go.onclick = commitImport;
}
