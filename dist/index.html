/* ------------------------------------------------- the rest of the controls
   Create, edit, disable, re-activate, reset the password, remove. All six are
   the server's decisions — the screen says what happened only after the
   server says it did, and a refusal is reported with the reason, not styled
   away. Removal removes the sign-in; every act the person ever did keeps
   their name, because history that rewrites itself is not history. */

async function setUserActive(name, active){
  const t = D.team.find(x => x.n === name);
  if (!t) return;
  let ok = false, why = 'the server refused';
  try {
    const res = await fetch('/api/user', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: name, active })
    });
    ok = res.ok;
    if (!res.ok) why = ((await res.json().catch(() => ({}))).error) || why;
  } catch { why = 'the server could not be reached'; }
  if (!ok){ toast('Not changed · ' + why + '. Nothing was changed.'); return; }
  t.st = active ? 'Active' : 'Disabled';
  audit('access', active ? 'Account re-activated' : 'Account disabled', name,
    active ? 'Disabled' : 'Active', active ? 'Active' : 'Disabled');
  closeCapture(); render(); syncSave();
  toast(active ? name + ' can sign in again.' : name + ' disabled — they keep their records, they lose the door.');
}

async function resetUserPassword(name){
  const input = document.getElementById('euPwIn');
  const next = input ? input.value : '';
  if (!next){ toast('Type the new password first.'); return; }
  let ok = false, why = 'the server refused';
  try {
    const res = await fetch('/api/user', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: name, password: next })
    });
    ok = res.ok;
    if (!res.ok) why = ((await res.json().catch(() => ({}))).error) || why;
  } catch { why = 'the server could not be reached'; }
  if (!ok){ toast('Not set · ' + why + '. Nothing was changed.'); return; }
  euPw = false;
  audit('access', 'Password reset', name, '-', 'must change at next sign-in');
  drawEditUser();
  toast('New starting password set — ' + name + ' must change it at next sign-in.');
}

async function removeUser(name){
  let ok = false, why = 'the server refused';
  try {
    const res = await fetch('/api/user', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: name, remove: true })
    });
    ok = res.ok;
    if (!res.ok) why = ((await res.json().catch(() => ({}))).error) || why;
  } catch { why = 'the server could not be reached'; }
  if (!ok){ toast('Not removed · ' + why + '. Nothing was changed.'); return; }
  /* Off every customer too — membership was their access, and it goes with it. */
  D.customers.forEach(c => setOn(name, c.id, false));
  D.team = (D.team || []).filter(x => x.n !== name);
  if (euName === name){ euName = null; closeCapture(); }
  delUser = null;
  audit('access', 'Account removed', name, 'had a sign-in', 'no sign-in — records keep their name');
  render(); syncSave();
  toast(name + ' removed · everything they recorded keeps their name.');
}

async function saveEditUser(){
  const b = document.getElementById('capBody');
  const t = D.team.find(x => x.n === euName);
  const roleSel = b.querySelector('[data-eu="role"]');
  const newRole = (roleSel.value || '').toLowerCase() === 'admin' ? 'admin'
    : (roleSel.value || '').toLowerCase() === 'manager' ? 'manager'
    : (roleSel.value || '').toLowerCase() === 'sa' ? 'sa' : 'bd';
  const before = ROLE[euWas.role] || euWas.role;
  const beforeOn = euWas.on;
  t.f = b.querySelector('[data-eu="f"]').value;
  const afterOn = withPerson(euName).map(id => cust(id).name).join(', ') || 'none';
  if (newRole !== t.role){
    audit('access', 'Role changed', euName, before, ROLE[newRole]);
    t.role = newRole;
  }
  if (beforeOn !== afterOn) audit('access', 'Access changed', euName, beforeOn, afterOn);
  closeCapture(); render();
  toast(euName + ' saved.');
  /* Which customers they are on is held here, but the role is enforced by the
     server, so the server has to be told. Say so plainly if it cannot be. */
  if (newRole !== euWas.role){
    try {
      const res = await fetch('/api/user', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: euName, role: newRole })
      });
      if (!res.ok){
        const b = await res.json().catch(() => ({}));
        toast('Saved here · but their sign-in was not changed: ' + (b.error || 'the server refused.'));
      }
    } catch {
      toast('Saved here · but their sign-in was not changed — the server could not be reached.');
    }
  }
}

function openChangePassword(forced){
  pwForced = !!forced;
  document.querySelector('#capVeil .sheet-h').innerHTML = `

    <span class="tiny muted">${forced ? 'the one you were given was a starting password' : ''}</span>

  const close = document.getElementById('capClose10');
  if (close) close.onclick = closeCapture;
  document.getElementById('capVeil').classList.add('on');
  document.getElementById('capBody').innerHTML = `
    <div class="kv" style="grid-template-columns:132px 1fr;align-items:center;row-gap:12px">
      <div class="k">Current password</div>
      <div><input id="pw1" type="password" style="width:100%" /></div>
      <div class="k">New password</div>
      <div><input id="pw2" type="password" placeholder="At least 8 characters, a letter and a number" style="width:100%" /></div>
      <div class="k">Type it again</div>
      <div><input id="pw3" type="password" style="width:100%" /></div>
    </div>
    ${forced ? '<div class="note" style="margin:var(--s4) 0 0">Until you change it, the administrator who created '
      + 'your account still knows this password. It takes a moment.</div>' : ''}
    <div class="hr"></div>
    <div class="row">
      <span class="tiny muted" id="pwnote"></span>
      <div class="spacer"></div>
      <button class="btn pri" data-act="changepw">Change password</button>
    </div>`;
}

async function submitChangePassword(){
  const val = (id) => { const e = document.getElementById(id); return e ? String(e.value || '') : ''; };
  const note = document.getElementById('pwnote');
  const current = val('pw1'), next = val('pw2'), again = val('pw3');
  if (!current){ if (note) note.textContent = 'The current password is needed first.'; return; }
  if (next !== again){ if (note) note.textContent = 'The two new passwords do not match.'; return; }
  if (note) note.textContent = 'Changing…';
  let res, body;
  try {
    res = await fetch('/api/password', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ current, next })
    });
    body = await res.json().catch(() => ({}));
  } catch {
    if (note) note.textContent = 'The server could not be reached — nothing was changed.';
    return;
  }
  if (!res.ok){ if (note) note.textContent = body.error || 'The password could not be changed.'; return; }
  pwForced = false;
  closeCapture();
  toast('Password changed · it is yours now.');
}

async function createAccount(){
  const val = (id) => { const e = document.getElementById(id); return e ? String(e.value || '').trim() : ''; };
  const note = document.getElementById('nunote');
  const name = val('nu1'), email = val('nu2'), role = val('nu3') || 'bd';
  const fn = val('nu4') || 'BD', password = val('nu5');
  if (!name){ if (note) note.textContent = 'A name is needed before an account can be created.'; return; }
  if (!password){ if (note) note.textContent = 'Give them a starting password — they change it at first sign-in.'; return; }
  if (note) note.textContent = 'Creating the account…';
  let res, body;
  try {
    res = await fetch('/api/users', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, role, fn, password, accounts: [...nuOn] })
    });
    body = await res.json().catch(() => ({}));
  } catch {
    if (note) note.textContent = 'Not saved — the server could not be reached. No account was created.';
    return;
  }
  if (!res.ok){
    if (note) note.textContent = body.error || 'The account could not be created.';
    return;
  }
  /* The server owns the login; this list is the team as the product shows it.
     A name already on the roster is the row being completed, not a second
     person — pushing blindly put "Jayden Lu" on the roster twice the first
     time an account was made for somebody the book already knew. */
  D.team = D.team || [];
  const entry = { n: name, r: fn === 'SA' ? 'Solution Architect' : fn === 'Product SA' ? 'Product SA' : fn === 'Manager' ? 'BD Manager' : 'Account Manager',
                  f: fn, role, last: 'never', st: 'Active' };
  const rosterRow = D.team.find(t => t && String(t.n ?? '').trim().toLowerCase() === name.toLowerCase());
  if (rosterRow) Object.assign(rosterRow, entry); else D.team.push(entry);
  [...nuOn].forEach(id => setOn(name, id, true));
  audit('access', 'Account created', name, '—', ROLE[role] + ' · ' + (nuOn.size + ' customer' + (nuOn.size === 1 ? '' : 's')));
  closeCapture(); render(); syncSave();
  toast(name + ' can sign in now · pass them the starting password.');
}

        <div class="kv" style="grid-template-columns:104px 1fr;align-items:center;row-gap:11px">
          <div class="k">Base URL</div>
          <div><input id="aiBase" value="${esc((aiState && aiState.base) || '')}" placeholder="https://…/v1"
            style="width:100%;border:1px solid var(--line-2);border-radius:var(--r-ctl);padding:6px 9px;font-size:12.5px;font-family:ui-monospace,Menlo,monospace" /></div>
          <div class="k">Model</div>
          <div><input id="aiModel" value="${esc((aiState && aiState.model) || '')}" placeholder="ep-… / gpt-4o-mini"
            style="width:100%;border:1px solid var(--line-2);border-radius:var(--r-ctl);padding:6px 9px;font-size:13px;font-family:ui-monospace,Menlo,monospace" /></div>
          <div class="k">API key</div>
          <div><input id="aiKey" type="password" autocomplete="new-password"
            placeholder="${(aiState && aiState.hasKey) ? 'saved — type a new one to replace it' : 'sk-…'}"
            style="width:100%;border:1px solid var(--line-2);border-radius:var(--r-ctl);padding:6px 9px;font-size:13px;font-family:ui-monospace,Menlo,monospace" /></div>
        </div>
        <div class="hr"></div>
        <div class="row">
          <span class="tiny muted">Kept in <span class="mono">data/ai.json</span> on the server — never part of the state a browser downloads.</span>
          <div class="spacer"></div>
          ${aiOn ? '<button class="btn sm" data-act="aidisconnect">Disconnect</button>' : ''}
          <button class="btn sm pri" data-act="savemodel">Save &amp; test</button>
        </div>
      </div>
`;

  /* The budget is its own setting because it depends on the model, not on the
     endpoint — and a reasoning model that runs out of budget answers nothing
     at all rather than answering briefly. */
  const budgetCard = `
      <div class="card" style="margin-top:var(--s4)">
        <div class="row"><div><div style="font-size:13.5px;font-weight:600">Answer budget</div>
          <div class="tiny muted">How much the model is allowed to think, and how long we wait</div></div>
          <div class="spacer"></div><span class="tag">Admin</span></div>
        <div class="hr"></div>
        <div class="kv" style="grid-template-columns:104px 1fr;align-items:center;row-gap:11px">
          <div class="k">Tokens</div>
          <div><input id="aiBudget" type="number" min="256" max="32000" step="500"
            value="${esc(String((aiState && aiState.maxTokens) || 12000))}"
            style="width:140px;border:1px solid var(--line-2);border-radius:var(--r-ctl);padding:6px 9px;font-size:13px" /></div>
          <div class="k">Timeout</div>
          <div><input id="aiTimeout" type="number" min="5" max="600" step="5"
            value="${esc(String(Math.round(((aiState && aiState.timeoutMs) || 240000) / 1000)))}"
            style="width:140px;border:1px solid var(--line-2);border-radius:var(--r-ctl);padding:6px 9px;font-size:13px" />
            <span class="tiny muted" style="margin-left:6px">seconds</span></div>
        </div>
        <div class="hr"></div>
        <div class="row">
          <span class="tiny muted">A reasoning model spends this budget thinking first — too small and it
            answers nothing rather than answering briefly.${(aiState && aiState.budgetSource === 'environment')
              ? ' Set from the environment here, so a change below has no effect until those are removed.' : ''}</span>
          <div class="spacer"></div>
          <button class="btn sm" data-act="budgetreset">Use defaults</button>
          <button class="btn sm pri" data-act="savebudget">Save budget</button>
        </div>
      </div>
`;

  return `
  <div class="phead">
    <div><h1>Admin</h1><p class="sub">One Admin — you. People first, then what happened, then the settings that change how the product behaves.</p></div>
    <div class="spacer"></div>
    ${adminTab === 'people' ? '<button class="btn pri" data-act="newuser">+ Add person</button>' : ''}
    ${adminTab === 'people' ? '<button class="btn sm" data-act="importcsv" title="Paste rows for customers, people, opportunities, interactions or next steps — every row is previewed, and everything but a customer hangs off a customer that already exists.">Import</button>' : ''}
  </div>

  <div class="card" style="padding:0;margin-bottom:var(--s5)">
    <div class="strip">
      <span class="sstat"><span class="n">${D.team.length}</span><span class="l">people</span></span>
      <span class="sstat"><span class="n">${bd}</span><span class="l">BD</span></span>
      <span class="sstat"><span class="n">${sa}</span><span class="l">SA</span></span>
      <span class="sstat"><span class="n">${unowned.length}</span><span class="l">customer${unowned.length === 1 ? '' : 's'} with nobody on them</span></span>
      <div class="spacer"></div>
      <button class="btn sm" data-atab="audit">${recent} acts logged in 7 days →</button>
    </div>
    ${unowned.length ? `<div class="more" style="border-top:1px solid var(--line)">
      <strong>${unowned.map(c => esc(c.name)).join(', ')}</strong> ${unowned.length === 1 ? 'has' : 'have'} no BD and no SA.
      A customer nobody is on is a customer nobody will update — it will sit here looking healthy.</div>` : ''}
  </div>

  <div class="row" style="margin-bottom:var(--s5)">
    <div class="seg">
      ${ADMIN_TABS.map(x => `<button data-atab="${x.k}" class="${adminTab === x.k ? 'on' : ''}">${x.l}</button>`).join('')}
    </div>
  </div>

  ${adminTab === 'people' ? teamRosterCard() : ''}
  ${adminTab === 'audit'  ? adminAudit() : ''}
  ${adminTab === 'roles'  ? roleMatrix() + viewAsCard() + dataGuardCard() : ''}
  ${adminTab === 'jobs'   ? jobsCard : ''}
  ${adminTab === 'ai'     ? `<div class="grid g2"><div>${aiCard}</div><div>${modelCard}${budgetCard}</div></div>` : ''}
  `;
}

/* ============================================================================ */
/*  Products — what we sell, and who will stand behind it                      */
/*  A catalogue everybody can read is only half of it. The half that changes   */
/*  behaviour is the name against each product: when a customer asks the       */
/*  awkward technical question at 5pm, BD needs to know who to call, and       */
/*  today that lives in someone's head or in a chat thread. Unclaimed rows     */
/*  are counted on purpose — a product nobody owns is a product the team       */
/*  quietly stops selling, and pretending otherwise hides it.                  */
/* ============================================================================ */
/* §27 asks the reference list to be searchable — with the full sellable
   catalogue in the book, finding one of 149 services by name, by what it
   does, or by who backs it is the point of the screen. */
let prodQ = '';
const prodCats = () => [...new Set((D.products || []).map(p => p.cat))];
const supportersOf = (p) => p.by || [];
/* A supporter is a CONTACT, not an account. Some of them are also people who
   use Waypoint; most never will, and must not have to. */
const isUser = (n) => D.team.some(t => t.n === n);

function screenProducts(){
  /* The find box decides what is LISTED. Every number on the page then
     describes the listed set, and the "of N" suffix is the only thing that
     remembers the whole catalogue — typing does not change what we sell. */
  const everything = D.products || [];
  const q = prodQ.trim().toLowerCase();
  const hit = (p) => !q || [p.n, p.ab, p.cat, p.one,
    ...supportersOf(p).map(x => x.n + ' ' + (x.r || ''))]
    .join(' ').toLowerCase().includes(q);
  const all = q ? everything.filter(hit) : everything;
  const withBy = all.filter(p => supportersOf(p).length).length;
  const people = [...new Set(all.flatMap(supportersOf).map(x => x.n))];
  const onPlatform = people.filter(isUser).length;
  /* Categories come off the listed rows, so a group with no match never
     stands as a header over nothing. */
  const cats = [...new Set(all.map(p => p.cat))];
  return `
  <div class="phead">
    <div><h1>Products</h1><p class="sub">What we can sell, and who inside Tencent Cloud will stand behind each one</p></div>
    <div class="spacer"></div>
    ${can('users') ? addBarFor('products', { only: 'btn', pri: true }) : ''}
  </div>

  ${can('users') ? addBarFor('products', { only: 'form' }) : ''}

  <div class="row" style="margin-bottom:var(--s5);flex-wrap:wrap;gap:8px">
    <label class="search">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.6" stroke="var(--ink-0)" stroke-width="1.5"/><path d="M10.6 10.6L14 14" stroke="var(--ink-0)" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input data-prq placeholder="Find a product, a category, a specialist…" value="${esc(prodQ)}" />
    </label>
    ${q ? `<span class="tiny muted">${all.length} of ${everything.length} shown</span>
          <button class="rchip on" data-act="clearpq" title="Clear the find">${esc(prodQ)} ✕</button>` : ''}
    <div class="spacer"></div>
  </div>

  <div class="card" style="padding:0;margin-bottom:var(--s5)">
    <div class="strip">
      <span class="sstat"><span class="n">${all.length}</span><span class="l">${q ? 'of ' + everything.length + ' products' : 'products'}</span></span>
      <span class="sstat"><span class="n">${cats.length}</span><span class="l">categories</span></span>
      <span class="sstat"><span class="n">${people.length}</span><span class="l">specialists named</span></span>
      <span class="sstat"><span class="n">${all.length - withBy}</span><span class="l">products unclaimed</span></span>
      <div class="spacer"></div>
      <span class="tiny muted">${can('users') ? 'You maintain this list. Everybody can read it.' : 'Read-only — an Admin maintains this list.'}</span>
    </div>
    <div class="more" style="border-top:1px solid var(--line)">
      ${onPlatform} of the ${people.length} specialists named here also have a Waypoint account.
      <b>They do not need one.</b> This is a name and a way to reach them — the product SA is a
      contact, not a user, and a product can be backed by as many people as it takes.
    </div>
  </div>

  ${q && !all.length ? `<div class="card" style="padding:18px;color:var(--ink-2)">Nothing matches “${esc(prodQ)}” — try a product name, a category, or a specialist.</div>` : ''}

  ${cats.map(cat => {
    const rows = all.filter(p => p.cat === cat);
    const open = rows.filter(p => supportersOf(p).length).length;
    return `
    <div class="grp-h" style="margin-top:var(--s5)">${esc(cat)}
      <span class="tiny muted">${rows.length} · ${open} backed${rows.length - open ? ' · ' + (rows.length - open) + ' unclaimed' : ''}</span>
    </div>
    <div class="card" style="padding:0;margin-bottom:var(--s3)" data-tour="plist">
      ${rows.map(p => {
        const ss = supportersOf(p);
        /* 76px: the longest real abbreviation in the catalogue runs to 9
           characters — TCHouse-C, HTTPDNS, TokenHub — and a badge must not
           spill onto the name it belongs to. */
        return `<div class="pr" style="align-items:flex-start">
          <span class="pr-m" style="width:76px;flex:0 0 76px;padding-top:2px"><span class="tag t-grey">${esc(p.ab)}</span></span>
          <span class="pr-main">
            <span class="pr-n" style="font-weight:500">${esc(p.n)}</span>
            <span class="pr-t">${esc(p.one)}</span>
          </span>
          <span class="pr-m" style="width:250px;flex:0 0 250px">
            ${ss.length ? ss.slice(0, 2).map(x => `<span class="who">
                <span class="tiny" style="font-weight:500">${esc(x.n)}</span>
                <span class="pr-t" style="margin-top:1px">${esc(x.r)} · ${esc(x.hq)}${isUser(x.n) ? ' · has an account' : ''}</span>
              </span>`).join('') + (ss.length > 2 ? `<span class="tiny muted">+${ss.length - 2} more</span>` : '')
              : `<span class="tiny muted">Nobody named yet — the team will avoid selling what nobody backs.</span>`}
          </span>
          ${can('users') ? `<button class="btn sm" data-pa="${p.id}">${ss.length ? 'Edit' : 'Assign'}</button>` : ''}
          ${ss.length ? `<button class="btn sm" data-pw="${esc(ss[0].n)}" title="Copy the name so you can find them in WeCom — a page cannot open an app it does not control">${esc(ss[0].how)}</button>` : ''}
        </div>`;
      }).join('')}
    </div>`;
  }).join('')}

`;
}

/* Assigning a supporter is a claim, not an edit — it is how a product stops
   being everybody's job and becomes somebody's. */
let paId = null;
function openAssign(id){
  paId = id;
  const p = (D.products || []).find(x => x.id === id);
  document.querySelector('#capVeil .sheet-h').innerHTML = `
    <strong style="font-size:14.5px">Who backs ${esc(p.n)}</strong>
    <span class="tiny muted">the name the team calls when this product comes up</span>
    <div class="spacer"></div>
    <button class="btn sm" id="capClose7">Close</button>`;
  document.getElementById('capClose7').onclick = closeCapture;
  document.getElementById('capVeil').classList.add('on');
  drawAssign();
}

/* The pool is everybody already named somewhere in the workspace — on the
   platform or not. Add a name that is nowhere yet and it joins the pool. */
function supPool(){
  const seen = new Map();
  (D.team || []).forEach(t => seen.set(t.n, { n:t.n, r:t.r, hq:'KL', how:'WeCom' }));
  (D.products || []).flatMap(supportersOf).forEach(x => { if (!seen.has(x.n)) seen.set(x.n, x); });
  return [...seen.values()];
}

function drawAssign(){
  const b = document.getElementById('capBody');
  const p = (D.products || []).find(x => x.id === paId);
  const ss = supportersOf(p);
  const pool = supPool().filter(x => !ss.some(y => y.n === x.n));

  b.innerHTML = `
    <div class="tiny muted" style="margin-bottom:var(--s4)">${esc(p.n)} — ${esc(p.one)}</div>

    <div class="tiny muted" style="margin-bottom:8px">Backed by ${ss.length ? ss.length + ' — remove any of them' : 'nobody yet'}</div>
    <div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:var(--s4)">
      ${ss.length ? ss.map(x => `<button class="rchip on" data-prm="${esc(x.n)}" title="Remove">${esc(x.n)} ✕</button>`).join('')
                  : '<span class="tiny muted">Unclaimed.</span>'}
    </div>

    <div class="tiny muted" style="margin-bottom:8px">Add somebody — they do <b>not</b> need a Waypoint account</div>
    <div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:var(--s4)">
      ${pool.map(x => `<button class="rchip" data-padd="${esc(x.n)}">${esc(x.n)}
        <span class="tiny muted">${esc(x.r)}</span></button>`).join('')}
    </div>

    <div class="hr"></div>
    <div class="tiny muted" style="margin-bottom:8px">Not in the list? Name them here — a name, what they do, and how to reach them.</div>
    <div class="kv" style="grid-template-columns:104px 1fr;align-items:center;row-gap:9px">
      <div class="k">Name</div><div><input data-pn placeholder="Iskandar Noor"
        style="width:100%;border:1px solid var(--line-2);border-radius:var(--r-ctl);padding:6px 9px;font-size:13px" /></div>
      <div class="k">What they do</div><div><input data-pr placeholder="Security specialist"
        style="width:100%;border:1px solid var(--line-2);border-radius:var(--r-ctl);padding:6px 9px;font-size:13px" /></div>
      <div class="k">Where</div><div><input data-ph value="KL"
        style="width:100%;border:1px solid var(--line-2);border-radius:var(--r-ctl);padding:6px 9px;font-size:13px" /></div>
    </div>

    <div class="hr"></div>
    <div class="row">
      <span class="tiny muted">Leaving a product unclaimed is allowed — and it shows as unclaimed, so it gets noticed.</span>
      <div class="spacer"></div>
      <button class="btn sm" data-act="paddnew">Add this person</button>
      ${ss.length ? '<button class="btn sm" data-pclear="1">Remove all</button>' : ''}
      <button class="btn pri" data-act="pdone">Done</button>
    </div>`;

  b.querySelectorAll('[data-padd]').forEach(el => {
    el.onclick = () => {
      const x = supPool().find(y => y.n === el.dataset.padd);
      p.by = [...ss, x];
      audit('access', 'Product supporter added', p.n, ss.map(y => y.n).join(', ') || 'Unclaimed',
            p.by.map(y => y.n).join(', '));
      drawAssign();
    };
  });
  b.querySelectorAll('[data-prm]').forEach(el => {
    el.onclick = () => {
      const was = ss.map(y => y.n).join(', ');
      p.by = ss.filter(y => y.n !== el.dataset.prm);
      audit('access', 'Product supporter removed', p.n, was, p.by.map(y => y.n).join(', ') || 'Unclaimed');
      drawAssign();
    };
  });
  const clear = b.querySelector('[data-pclear]');
  if (clear) clear.onclick = () => {
    const was = ss.map(y => y.n).join(', ');
    p.by = [];
    audit('access', 'Product supporters cleared', p.n, was, 'Unclaimed');
    drawAssign();
  };
  b.querySelector('[data-act="paddnew"]').onclick = () => {
    const n = b.querySelector('[data-pn]').value.trim();
    if (!n){ toast('A name at least — that is the whole point.'); return; }
    p.by = [...supportersOf(p), { n, r:b.querySelector('[data-pr]').value.trim() || 'Specialist',
            hq:b.querySelector('[data-ph]').value.trim() || 'KL', how:'WeCom' }];
    audit('access', 'Product supporter added', p.n, ss.map(y => y.n).join(', ') || 'Unclaimed',
          p.by.map(y => y.n).join(', '));
    drawAssign();
  };
  b.querySelector('[data-act="pdone"]').onclick = () => {
    closeCapture(); view.s = 'products'; render();
    toast(p.n + ' · ' + (supportersOf(p).length || 'unclaimed') + ' named.');
  };
}

/* ------------------------------------------------------------------ marks
   In the product these are fetched from the customer's own domain and cached —
   never generated. A made-up logo in front of a customer is worse than none,
   so anything we cannot fetch falls back to initials. Prototype: stand-ins. */
const MARKS = {

};

function initials(name){
  return name.split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
}
/* The header chip used to read "KL Kelvin" for everybody — the author's own
   initials, left in the static HTML while every other part of the app read the
   session. It follows the signed-in person now, and clears before the next
   sign-in so nobody else is wearing a stranger's name. */
function drawMe(){
  const name = (D.me && D.me.name) || '';
  const av = document.getElementById('meAv');
  const label = document.getElementById('meName');
  if (av) av.textContent = name ? initials(name) : '–';
  if (label) label.textContent = name;
}
function logo(c, px){
  const box = `width:${px}px;height:${px}px`;
  const tbox = box + `;font-size:${Math.max(8, Math.round(px * 0.4))}px`;
  const monogram = `<span class="monogram" style="${tbox}" title="${esc(c.name)}">${esc(initials(c.name))}</span>`;
  /* A customer created from a lookup carries the mark we fetched from their
     own site. It used to be shown in the lookup sheet and then dropped on
     Create, so every new customer fell back to initials — the logo looked
     like it had been lost. A fetched URL can still rot, so the monogram sits
     behind it and takes over if the image does not load. */
  if (c.logo){
    return `<span style="${box};position:relative;display:inline-flex;flex:0 0 auto">
      <img src="${esc(c.logo)}" alt="" title="${esc(c.name)}"
        style="${box};object-fit:contain;display:block;background:var(--surface-3);
               border-radius:${Math.max(4, Math.round(px * 0.28))}px"
        onerror="this.style.display='none';var n=this.nextElementSibling;if(n)n.style.display='inline-grid'" />
      <span class="monogram" style="${tbox};display:none">${esc(initials(c.name))}</span>
    </span>`;
  }
  const m = MARKS[c.id];
  return m ? `<span class="logo" style="${box}" title="${esc(c.name)}">${m}</span>` : monogram;
}

function stanceTag(s){
  const k = s === 'With us' ? 't-with' : s === 'Against us' ? 't-against' : 't-und';
  return `<span class="tag ${k}">${esc(s)}</span>`;
}
/* ------------------------------------------------------- health, explained
   §10/§13: "Always show the reason". A health word on its own is a mood —
   it cannot be argued with, checked, or trusted. Both functions below read
   the signals the brief lists and return ONE sentence of evidence.

   Rules, not scores: §10 forbids meaningless AI numbers, so nothing here
   counts its way to a verdict. First match wins — the most alarming
   observable fact is the reason, and when nothing is wrong the supporting
   evidence is. Every date is read from the record and formatted NOW; no
   relative time is ever stored on the way in (the w:'4d' trap). */

/* §10 signals: recent activity / open opportunities / upcoming next step /
   overdue next step / stale activity / recent MOM / blockers. */
function healthWhy(c){
  const ops = oppsOf(c.id).filter(o => D.stages.includes(o.stage));
  const blocked = ops.filter(o => String(o.blockers || '').trim());
  const ns = D.steps.filter(s => s.c === c.id && !stepIsDone(s))[0];
  const lm = (c.timeline || []).filter(t => TL_IS_INTERACTION(t.k))[0];
  if (ns && stepOverdue(ns))
    return `Next step overdue — “${ns.t}” was due ${fmtDay(ns.due)}`
      + (ns.from === 'us' ? ' and it is our move' : '');
  if (blocked.length)
    return `Blocker on ${blocked[0].t} — ${String(blocked[0].blockers).trim()}`;
  if (!lm) return 'No interaction logged yet';
  if (dayGap(lm.d) > 45) return `No interaction since ${fmtDay(lm.d)}`;
  if (!ops.length) return `Last interaction ${fmtDay(lm.d)} — no open opportunity`;
  return `Last interaction ${fmtDay(lm.d)}`
    + (ns && ns.due ? ` · next step due ${fmtDay(ns.due)}` : '');
}

/* §13 signals: stage / last activity / next step / stale period / blockers /
   customer engagement. */
function oppWhy(o){
  const c = cust(o.c);
  const bl = String(o.blockers || '').trim();
  const os = D.steps.filter(s => s.o === o.id && !stepIsDone(s))
    .sort((a, b) => String(a.due || '9999').localeCompare(String(b.due || '9999')))[0];
  if (bl) return `Blocker — ${bl}`;
  if (os && stepOverdue(os)) return `Next step “${os.t}” was due ${fmtDay(os.due)}`;
  if (c && c.stance === 'Against us') return 'Customer stance is Against us';
  if (oppAge(o) >= 30 && o.p <= 25) return `${oppAge(o)}d in ${o.stage} at ${o.p}%`;
  if (o.close && dayGap(o.close) > 0) return `Close date ${fmtDay(o.close)} has passed`;
  return `In ${o.stage} since ${o.stageAt ? fmtDay(o.stageAt) : '—'}`
    + (o.close ? ` · closes ${fmtDay(o.close)}` : '');
}
function healthTag(h, why){
  /* Healthy is the expected state, and colour is reserved for the exception.
     A board where most cards are green teaches you nothing — you cannot see
     the two that need you. Healthy goes neutral; Watch and At risk keep
     their colour because those are the ones worth a second look.
     `why` is the §10/§13 sentence — the word is never drawn alone. */
  const k = h === 'Healthy' ? 't-grey' : h === 'Watch' ? 't-warn' : 't-risk';
  return `<span class="tag ${k}"${why ? ` title="${esc(why)}"` : ''}>${esc(h)}</span>`;
}

/* ------------------------------------------------------------------ render */
/* ============================================================================
   The shared book.

   Everything above this line is a prototype carrying its data inside the file.
   Everything below turns it into a product: one copy of the truth on the
   server, many people editing it, and a rule that whoever saves last must
   never quietly take the first person's work with them.

   Three promises:
   - Nobody's edit is lost. A save carries the revision it was based on. When
     somebody else saved in between, the server merges ROW BY ROW instead of
     replacing, and hands the merged truth back.
   - Only rows that actually changed are stamped with a new `updatedAt`. That
     field is what the merge decides on; stamping everything on every save
     would make the last saver win at row level, which is the same lost-work
     bug wearing a different hat.
   - The app still works with the server unreachable. It runs from the copy in
     the file and says so, rather than showing an empty product.
   ========================================================================== */
const SYNC_LISTS = ['customers','interactions','meetings','steps','team','audit','files','products',
  /* A signal is a record, not a setting: it is created by a person, and the
     confirm/dismiss decision on it has to survive a reload. It used to travel
     inside `config`, so a decision was only ever held in memory. */
  'watch'];
/* `opps` is a MAP keyed by id, not a list. It used to sit in the list group
   and was therefore skipped by every copy below - opportunity edits were
   saved to the screen and never reached the server. A collection that is
   silently not synced is worse than one that is missing. */
const SYNC_MAPS = ['opps'];
/* `changed` and `cfgSig` are what let a save stay silent — see syncSave. */
const SY = { rev: 0, live: false, sending: false, retry: false, timer: null, sent: {}, note: '',
             changed: false, cfgSig: '', refused: false };

/* Removals travel under their own envelope, because silence is no longer a
   delete. The server puts back every row a save does not mention — that is what
   stops one ordinary save from emptying the collections this client never sends
   — so a row taken off the screen has to be NAMED as gone or it walks back in
   on the next reload. Ids accumulate here until a save that carries them is
   answered; a save that is refused keeps them, so nothing is lost to a retry. */
const GONE = {};
const goneAdd = (k, id) => {
  if (id === undefined || id === null || id === '') return;
  (GONE[k] = GONE[k] || []).push(String(id));
};
const goneTake = () => {
  const out = {};
  let n = 0;
  for (const k of Object.keys(GONE)) {
    const v = [...new Set((GONE[k] || []).filter(Boolean))];
    if (v.length){ out[k] = v; n += v.length; }
  }
  return n ? out : null;
};
const goneClear = () => { for (const k of Object.keys(GONE)) delete GONE[k]; };

const slugOf = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/, '');

/* The merge decides row by row on `id`. `team` was keyed by the person's name,
   so it gets a stable id derived from that name — stable, or every save would
   look like a delete followed by an insert. */
function ensureIds(){
  for (const k of SYNC_LISTS){
    const list = D[k];
    if (!Array.isArray(list)) continue;
    for (const r of list){
      if (!r || typeof r !== 'object') continue;
      if (r.id === undefined || r.id === null || r.id === '')
        r.id = k.slice(0, 2) + '_' + slugOf(r.n || r.t || r.h || r.d);
    }
  }
  for (const k of SYNC_MAPS){
    const map = D[k];
    if (!map || typeof map !== 'object') continue;
    for (const [key, r] of Object.entries(map)){
      if (!r || typeof r !== 'object') continue;
      if (r.id === undefined || r.id === null || r.id === '') r.id = key;
    }
  }
}

/* What counts as "this row changed". `updatedAt` is the RESULT of a change,
   never part of it, and the keys are sorted because a row that means the same
   thing must compare the same whether it came from this page, from the server,
   or from a merge that rebuilt it. */
const rowBody = (r) => JSON.stringify(
  Object.keys(r).filter((k) => k !== 'updatedAt').sort().map((k) => [k, r[k]])
);

function rememberSent(){
  SY.sent = {};
  for (const k of SYNC_LISTS){
    const list = D[k];
    if (!Array.isArray(list)) continue;
    for (const r of list) if (r && r.id != null) SY.sent[k + ':' + r.id] = rowBody(r);
  }
  for (const k of SYNC_MAPS){
    const map = D[k];
    if (!map || typeof map !== 'object') continue;
    for (const r of Object.values(map)) if (r && r.id != null) SY.sent[k + ':' + r.id] = rowBody(r);
  }
}

function stampChanged(){
  const next = {};
  let changed = false;
  const each = (k, r) => {
    if (!r || typeof r !== 'object') return;
    const kk = k + ':' + r.id;
    /* `updatedAt` is left out of the comparison on purpose. It used to be part
       of it, and then the stamp itself became the next change: this page wrote
       a fresh timestamp, the server — which owns `team` and rebuilds it from
       the accounts — answered with its own, and the two never met. Every open
       page then rewrote the whole book about once a second for as long as it
       was left open, and each copy it wrote carried every row its own state
       still held. Two people with the product open were enough: the row one of
       them removed came back on the other's next save, and no removal was ever
       final. A change is what the business fields say. */
    const body = rowBody(r);
    if (SY.sent[kk] !== body){ r.updatedAt = new Date().toISOString(); changed = true; }
    next[kk] = body;
  };
  for (const k of SYNC_LISTS){
    const list = D[k];
    if (!Array.isArray(list)) continue;
    for (const r of list) each(k, r);
  }
  for (const k of SYNC_MAPS){
    const map = D[k];
    if (!map || typeof map !== 'object') continue;
    for (const r of Object.values(map)) each(k, r);
  }
  /* A row that stopped existing is the one kind of change the comparison above
     cannot see: it reads the rows that are here, not the ones that are not. */
  if (Object.keys(next).length !== Object.keys(SY.sent).length) changed = true;
  SY.sent = next;
  SY.changed = changed;
  return changed;
}

/* ------------------------------------------------------------------ demo data
   There is none, and this comment is the fence that keeps it that way.
   A sample customer used to ship inside this file; it survived an empty
   server state (see adopt) and wrote itself into real workspaces on the
   first save. If a sample is ever wanted again, put it in a separate
   throwaway workspace — never in the file real people load. */

function adopt(state){
  if (!state || typeof state !== 'object') return;
  /* The server is the single truth for every business list. A key the server
     does not answer with used to leave whatever this file happened to hold —
     which is how a baked-in sample customer survived an empty workspace and
     wrote itself into the real one on the first save. Missing now means
     empty, with one exception: the product catalogue is reference data the
     app ships with, so a brand-new workspace keeps it until the server has
     its own copy (the first save gives it one). */
  for (const k of SYNC_LISTS){
    D[k] = Array.isArray(state[k]) ? state[k]
      : (k === 'products' ? (D.products || []) : []);
  }
  /* §17 legacy read: a workspace written before the rename still holds its
     rows under `meetings`. Prefer the new key whenever both are present, the
     same rule the `watch` fallback below follows — and copy the old rows into
     the new key so the very next save migrates the workspace by itself. The
     alternative is an empty Interactions screen on a workspace that has rows
     in it, which reads as data loss to the person looking at it. */
  if (!Array.isArray(state.interactions) && Array.isArray(state.meetings)){
    D.interactions = state.meetings;
  }
  for (const k of SYNC_MAPS){
    D[k] = (state[k] && typeof state[k] === 'object' && !Array.isArray(state[k])) ? state[k] : {};
  }
  const cfg = state.config;
  if (cfg && typeof cfg === 'object'){
    /* Who "me" is comes from the session, never from the shared workspace.
       It used to be saved into `config`, so the last person to save became
       "me" for everybody reading it — a BD would sign in and find another
       person's name on their own edits, scoped to another person's book. */
    if (cfg.me && !meFromSession) D.me = cfg.me;
    if (cfg.stages) D.stages = cfg.stages;
    /* Legacy only: workspaces saved before `watch` became a record keep it in
       config. Prefer the real collection whenever both are present. */
    if (cfg.watch && !Array.isArray(state.watch)) D.watch = cfg.watch;
  }
  rememberSent();
}

function buildState(){
  ensureIds();
  stampChanged();
  const s = { schemaVersion: 1 };
  /* `meetings` is deliberately NOT written any more (§17). It stays in
     SYNC_LISTS so `adopt()` still reads it off an un-migrated workspace, but
     sending it back would keep the dead key alive on disk forever — two
     collections holding the same rows, and the next reader has to guess which
     one is real. A save here is also the migration: the rows arrive under
     `interactions` and the old key stops being sent. */
  for (const k of SYNC_LISTS) if (Array.isArray(D[k]) && k !== 'meetings') s[k] = D[k];
  for (const k of SYNC_MAPS) if (D[k] && typeof D[k] === 'object' && !Array.isArray(D[k])) s[k] = D[k];
  s.config = { stages: D.stages };
  if (!meFromSession && D.me) s.config.me = D.me;   /* see adopt(): identity is not shared */
  return s;
}

async function syncLoad(){
  try {
    const r = await fetch('/api/data', { credentials: 'same-origin' });
    if (r.status === 401) return 'signin';
    if (!r.ok) return 'offline';
    const b = await r.json();
    if (!b || !b.state) return 'offline';
    adopt(b.state);
    SY.rev = b.rev || 0;
    SY.live = true;
    return 'live';
  } catch { return 'offline'; }
}

/* Every mutation in this app ends in render(), so scheduling from render()
   catches all of them without touching a single handler. */
function scheduleSync(){
  if (!SY.live) return;
  /* A new edit is a new attempt. The refusal that stopped the loop was about
     the LAST payload, and the person has since changed something — so the
     reason to hold back no longer applies. Kept in step with the `retry` flag,
     which a queued save also survives: the difference is that a queue is
     somebody's work and a refusal is nobody's. */
  SY.refused = false;
  clearTimeout(SY.timer);
  SY.timer = setTimeout(syncSave, 700);
}

async function syncSave(){
  if (!SY.live) return;
  /* A save asked for while another is in flight used to be dropped on the
     floor — the work sat on screen, the user believed it, and nothing reached
     the server until the next keystroke. Flag it and run it the moment the
     in-flight save lands. */
  if (SY.sending) { SY.retry = true; return; }
  SY.sending = true;
  try {
    const state = buildState();
    const gone = goneTake();
    /* A save with nothing to say stays silent.
       `render()` schedules one on every redraw, and a merge answers with the
       server's state, which is adopted and redrawn — and that redraw schedules
       another. So every open page wrote the whole book about once a second for
       as long as it was left open, and each copy it wrote carried every row its
       own state still held. Two people with the product open were enough: the
       row one of them removed came back on the other's next save, and no
       removal was ever final.
       Nothing here is guessed: the comparison is the one `stampChanged` already
       makes per row, plus the removal envelope, plus the small config block. */
    const cfgSig = JSON.stringify(state.config || {});
    if (!SY.changed && !gone && cfgSig === SY.cfgSig) return;
    SY.cfgSig = cfgSig;
    const res = await fetch('/api/data', {
      method: 'PUT',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-Base-Rev': String(SY.rev) },
      body: JSON.stringify(gone ? { state, baseRev: SY.rev, deleted: gone } : { state, baseRev: SY.rev })
    });
    if (res.ok){
      const b = await res.json();
      SY.rev = b.rev || SY.rev;
      /* Answered, so stop repeating the removals. A save that was REFUSED keeps
         them: a row taken off somebody's screen is still owed to the server. */
      goneClear();
      /* Only a merge hands the state back: the server has combined our copy
         with somebody else's, so take the truth now, not at the next poll.
         But not when another save is already queued: this answer was built
         from a payload that did not contain the work done since it was sent —
         an audit row written, a field corrected — and adopting it would take
         that work off the screen before it was ever sent. The queued save
         carries it, and the merge after that is the truth both can agree on. */
      if (b.state && !SY.retry){ adopt(b.state); render(); }
      SY.note = '';
    } else if (res.status === 401){
      SY.live = false;
      SY.note = 'Signed out — the last change was not saved.';
    } else {
      /* A refusal is not a delay, and this branch used to treat it as one.
         Two separate things were wrong and they compounded.
         First, the reader was told a NUMBER. The server had already written
         the sentence — "Next step \"…\" is tracked by \"…\", who is not a
         Primary BD or Primary SA of … (BD: …, SA: …)" — and it was thrown
         away in favour of "Not saved (400)". The person was left holding a
         status code for a rule they were breaking and a fix they could not
         see. So read the body and say what the server said.
         Second, `SY.retry` survived a 400, and the `finally` below re-sent
         anything flagged. That flag means "a save was asked for WHILE this one
         was in flight" — a NEWER save, which is legitimate to re-send. It does
         not mean "this payload was refused", and the two were never
         distinguished: the same refused body went out on a 60 ms timer for as
         long as the page stayed open, each trip scheduling nothing and
         achieving nothing. A 4xx is the server saying no to THIS payload, so
         a retry cannot change the answer — only a new edit can, and a new edit
         schedules its own save. So the flag is cleared here.
         A 5xx is the opposite: the server failed to answer, the body is
         unknown, and trying again is exactly right. That is left alone. */
      let why = '';
      try {
        const b = await res.clone().json();
        why = String((b && (b.error || b.message)) || '').trim();
      } catch { /* not JSON — fall back to the status line */ }
      SY.note = why
        ? 'Not saved. ' + why + ' Nothing was changed on the server.'
        : 'Not saved (' + res.status + '). The server refused this change; nothing was changed.';
      /* Permanently refused: stop owing a re-send of a payload that will be
         refused again.
         `SY.retry` is doing two jobs and this is where they part. It means
         "a save was asked for while this one was in flight", which is a NEWER
         payload and must still go — clearing it outright would throw that
         person's work away to stop a loop they had nothing to do with. So the
         flag becomes a note that the thing just refused is not to be repeated:
         the queued save is re-sent, and it either carries the fix or is
         refused on its own merits. */
      if (res.status >= 400 && res.status < 500 && res.status !== 408 && res.status !== 429){
        SY.refused = true;
      }
    }
  } catch {
    SY.note = 'Offline — changes are held here until the server answers.';
  } finally {
    SY.sending = false;
    /* A queued save runs; a refused payload does not. The difference is the
       whole of the loop: before this, a 400 left the flag set and the same
       body went out every 60 ms forever, each trip refused in exactly the same
       way. The payload is rebuilt from the live state on every attempt, so a
       queued save carries whatever the person did next, while the refused one
       carried the same rejected row for as long as the page stayed open. */
    if (SY.retry){
      SY.retry = false;
      if (!SY.refused) setTimeout(syncSave, 60);
    }
    paintSync();
  }
}

/* Repaint only the banner. A full render() here would rebuild the page under
   somebody who is mid-sentence and steal the caret, and because render()
   schedules the next save it would also start a loop that never stops while
   the server is down. */
function paintSync(){
  const el = document.getElementById('syncNote');
  if (el) el.innerHTML = syncBanner();
}

/* Sign in against the real directory. The form collects an email; the server
   authenticates by user id, so the address is matched to a person first. With
   no directory yet — a fresh workspace — there is nobody to be, and the app
   opens as itself. */
async function signIn(email, password){
  try {
    const d = await (await fetch('/api/directory', { credentials: 'same-origin' })).json();
    const users = Array.isArray(d.users) ? d.users : [];
    if (!users.length){ SY.live = true; return { ok: true, open: true }; }
    const local = String(email || '').split('@')[0].replace(/[._-]+/g, ' ').trim();
    const u = users.find(x => slugOf(x.name) === slugOf(local))
           || users.find(x => slugOf(x.name).replace(/-/g, '') === slugOf(local).replace(/-/g, ''));
    /* Guessing "somebody in the directory" instead of failing would send the
       attempt against another person's account — and after enough attempts,
       lock them out. An unknown address has to stop here. */
    if (!u) return { ok: false, error: 'No account matches that address.' };
    const res = await fetch('/api/login', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId: u.id, password })
    });
    const b = await res.json();
    if (!res.ok) return { ok: false, error: b.error || 'Incorrect password.' };
    /* "Remember this device": the server hands back a token, this browser
       keeps it, and the next visit exchanges it for a fresh session. It dies
       with the server's memory - a restart clears every remembered device at
       once, which is this product's honest version of "remembered". */
    const keep = document.getElementById('lgKeep');
    try {
      if (keep && keep.checked && b.token) localStorage.setItem('cwb-device', b.token);
      else localStorage.removeItem('cwb-device');
    } catch (e) { /* file:// and private modes throw - sign-in still works, the device is just not remembered */ }
    const st = await syncLoad();
    if (st === 'signin') return { ok: false, error: 'Signed in, but the workspace refused the session.' };
    /* The boot pass asked whether a model is reachable before anybody was
       signed in, so it read a refusal and every AI control stayed hidden for
       the rest of the session. Now that a real session exists, ask again. */
    await refreshAi();
    /* The directory is the roster the server signs people in with, so its
       word on who you are is the one the UI must use. */
    if (u.name) {
      D.me = { ...(D.me || {}), name: u.name, role: u.role };
      drawMe();
      meFromSession = true; sessionRole = ''; adoptRole();
    }
    return { ok: true, name: u.name, mustChange: b.mustChange === true };
  } catch {
    return { ok: false, error: 'Cannot reach the server.' };
  }
}

/* ------------------------------------------------------------------ add a row
   Four tabs needed the same thing: a small form that appears where the work
   is, saves into the record, and writes to the audit. One mechanism instead
   of four copies - four copies is four places for the same bug to live. */
let addFor = null;
/* Completed actions are folded away by default — the open ones are what the
   screen is for — but they are always one click from being read (§6). */
let doneOpen = false;

/* The customer the add form belongs to, resolved at draw time and read by the
   pickers that offer people (`EXEC`, `TRACK`). It is deliberately a `let`
   pointed at a closure rather than stored state: it must reflect the form
   that is on screen right now, and a remembered value would go on answering
   for the last customer somebody opened. */
let addFormCustomer = () => null;

const ADD_SPEC = {
  people:    { btn:'Add a person',     act:'contact',
               f:[{k:'ad1', ph:'Name - e.g. Farah Idris', w:2},
                  {k:'ad2', ph:'Title - e.g. Head of Billing', w:2},
                  {k:'ad3', ph:'Classification', sel:'BANDS', w:1},
                  {k:'ad4', ph:'Email', w:2},
                  {k:'ad5', ph:'Phone', w:1}] },
  gpeople:   { btn:'Add a person',     act:'contact',
               f:[{k:'ad0', ph:'Customer', sel:'CUSTOMERS', w:2},
                  {k:'ad1', ph:'Name - e.g. Farah Idris', w:2},
                  {k:'ad2', ph:'Title - e.g. Head of Billing', w:2},
                  {k:'ad3', ph:'Classification', sel:'BANDS', w:1},
                  {k:'ad4', ph:'Email', w:2},
                  {k:'ad5', ph:'Phone', w:1}] },
  run:       { btn:'Add a system',     act:'system',
               f:[{k:'ad1', ph:'System - e.g. Billing (BSCS)', wide:true},
                  {k:'ad2', ph:'What it runs on today', wide:true},
                  {k:'ad3', ph:'Our position', sel:'STANCE', w:1}] },
  /* A new opportunity used to be born with no close date and no description
     — the edit form could set them, the add form could not, so a pipeline
     built through this form read as N/A dates until somebody went back in. */
  opportunities: { btn:'Add opportunity', act:'opp',
               f:[{k:'ad1', ph:'What is it - e.g. Billing migration', wide:true},
                  {k:'ad2', ph:'Value in RM - e.g. 1800000', w:1},
                  {k:'ad3', ph:'Stage', sel:'STAGES', w:1},
                  {k:'ad4', ph:'Close date - e.g. 2027-03-31, or empty', w:1},
                  {k:'ad5', ph:'What we would do - one line (optional)', ta:true}] },
  timeline:  { btn:'Add a note',       act:'note',
               f:[{k:'ad1', ph:'What happened - e.g. CFO re-opened the review', ta:true},
                  {k:'ad2', ph:'Detail (optional)', ta:true}] },
  products:  { btn:'Add product',      act:'product',
               f:[{k:'ad1', ph:'Product name - e.g. TencentDB for MySQL', wide:true},
                  {k:'ad2', ph:'Category', sel:'CATS', w:1},
                  {k:'ad3', ph:'One line on what it does', ta:true}] },
  interactions: { btn:'Log an interaction', act:'interaction',
               f:[{k:'ad0', ph:'Customer', sel:'CUSTOMERS', w:2},
                  {k:'ad1', ph:'What it was about - e.g. Billing migration workshop', wide:true},
                  {k:'ad2', ph:'Who was there - their side', wide:true},
                  {k:'ad3', ph:'Outcome - what changed', ta:true},
                  {k:'ad4', ph:'Type', sel:'MTYPES', w:1}] },
  /* The action a person promises in the meeting room. It used to be reachable
     only by typing a magic sentence into Capture — a form nobody could find is
     a missing action, no matter what the parser can do.

     Two people, because doing the work and answering for it are different
     jobs (§5). `Execution owner` is open — it offers the account team plus any
     supporting person recorded on the customer, because a Product SA is a
     normal person to do the work. `Tracked by` is narrow on purpose: it
     offers only this customer's Primary BD and Primary SA, and the server
     refuses anything else. */
  steps:    { btn:'Add action',       act:'step',
               f:[{k:'ad1', ph:'What was promised - e.g. Send the proposal draft', wide:true},
                  {k:'ad2', ph:'Execution owner - who does it', sel:'EXEC', w:1},
                  {k:'ad5', ph:'Tracked by - this account’s BD or SA', sel:'TRACK', w:1},
                  {k:'ad3', ph:'Due - e.g. 2026-10-05', w:1},
                  {k:'ad4', ph:'Waiting on', sel:'COURT', w:1}] }
};

const SELS = { BANDS: () => BANDS, STANCE: () => ['Replace','Both','Integrate','Keep'],
               STAGES: () => (D.stages || ['Interested']),
               CUSTOMERS: () => D.customers.map(c => c.name),
               CATS: () => [...prodCats(), 'Other'],
               STANCEP: () => ['With us', 'Undecided', 'Against us'],
               HEALTH: () => ['Healthy', 'Watch', 'At risk'],
               /* An action's owner is one of us. The person typing is offered
                  even on an empty roster, because the first action on the first
                  customer is usually theirs — a picker with nothing in it is a
                  dead end on day one. */
               TEAM: () => [...new Set([((D.me && D.me.name) || '').trim(),
                 ...(D.team || []).map(t => t.n)].filter(Boolean))],
               /* Who does the work. Wider than the account team on purpose: a
                  Product SA, a specialist, or any supporting person recorded
                  on the customer is a normal execution owner, and none of them
                  needs a WorkBuddy account to be named here (§3). */
               EXEC: () => [...new Set([((D.me && D.me.name) || '').trim(),
                 ...(D.team || []).map(t => t.n),
                 ...(addFormCustomer()?.support || [])].filter(Boolean))],
               /* Who follows up. Narrow on purpose — §5 requires it to be this
                  customer's Primary BD or Primary SA, and the server enforces
                  the same rule, so offering anybody else here would be a
                  picker that lies. */
               TRACK: () => {
                 const c = addFormCustomer();
                 return [...new Set([c?.owner, c?.sa].filter(Boolean))];
               },
               COURT: () => ['us', 'customer'],
               MTYPES: () => ['Meeting', 'Call', 'Email', 'Video call'] };

const FLD = 'flex:1;min-width:180px;border:1px solid var(--line-2);border-radius:var(--r-ctl);padding:8px 11px;font-size:13.5px;background:var(--surface)';

/* opt: { label, pri, only:'btn'|'form', pickCustomer }.
   `only` splits the button from the form so a screen can put the button in its
   header and the form underneath — one open form, one place it is drawn.
   `pickCustomer` adds the customer picker for screens that are not already
   inside one customer; without it a save there would have nowhere to go. */
/* Which capability opens which form. Reading the other half of a record is
   allowed — a solution without a budget is a science project — but writing
   it is not: an opportunity carries a value and a stage, which is the
   commercial half, so an SA reads it and a BD creates it. */
const ADD_CAP = { opportunities:'commercial', people:'people', gpeople:'people',
                  run:'technical', interactions:'log', timeline:'log', products:'users',
                  steps:'log' };

function addBarFor(tab, opt){
  const o = opt || {};
  const spec = ADD_SPEC[tab];
  if (!spec) return '';
  if (ADD_CAP[tab] && !can(ADD_CAP[tab])) return '';
  const on = addFor === tab;
  const fields = spec.f.slice();
  if (o.pickCustomer && !fields.some(f => f.k === 'ad0'))
    fields.unshift({ k:'ad0', ph:'Customer', sel:'CUSTOMERS', w:2 });
  /* The customer the open form belongs to, so a picker can offer the right
     people: an action's Tracker must be this account's BD or SA, and its
     Execution Owner may also be one of the supporting people recorded here.
     On a screen with its own customer picker the answer is whatever that
     picker says; inside a customer it is the customer being read. */
  const formCustomer = () => {
    if (o.pickCustomer){
      const el = document.getElementById('ad0');
      const nm = el ? el.value : '';
      return nm ? custByName(nm) : null;
    }
    return view.id ? cust(view.id) : null;
  };
  /* `SELS` is a top-level table with no access to the form's own options, so
     the two customer-dependent ones are pointed at it here, for the length of
     the draw. Set before `field()` runs and cleared by the caller's next
     draw — this is a render-time lookup, not stored state. */
  addFormCustomer = formCustomer;
  /* Every field carries a real label — a placeholder disappears the moment
     you type, and guessing what a box wants was the complaint. Wide fields
     and textareas take the whole row, so long text stays readable. */
  const field = (f) => {
    const cls = 'afield' + ((f.wide || f.ta) ? ' afield-wide' : '');
    const ctrl = f.sel
      ? '<select id="' + f.k + '">'
        + SELS[f.sel]().map(x => {
            /* Inside a customer, the customer picker opens on THAT customer.
               Defaulting to the first name in the list would quietly attach
               the record to somebody else. */
            let on = false;
            if (f.sel === 'CUSTOMERS' && !o.pickCustomer && view.id){
              const cur = cust(view.id);
              on = !!(cur && x === cur.name);
            }
            return '<option' + (on ? ' selected' : '') + '>' + x + '</option>';
          }).join('') + '</select>'
      : f.ta
        ? '<textarea id="' + f.k + '" rows="3" placeholder="' + f.ph + '"></textarea>'
        : '<input id="' + f.k + '" placeholder="' + f.ph + '" />';
    return '<label class="' + cls + '"><span>' + f.ph + '</span>' + ctrl + '</label>';
  };
  const btn = '<button class="btn ' + (o.pri ? 'pri' : 'sm ' + (on ? '' : 'pri'))
    + '" data-act="addtoggle" data-add="' + tab + '">'
    + (on ? 'Cancel' : (o.label || spec.btn)) + '</button>';
  const form = on
      ? '<div class="card" style="margin-bottom:var(--s4)"><div class="row" style="gap:10px;flex-wrap:wrap;align-items:flex-end">'
        + fields.map(field).join('')
        + '<button class="btn sm pri" data-act="addsave">Save</button>'
        + '</div></div>'
      : '';
  if (o.only === 'btn') return btn;
  if (o.only === 'form') return form;
  return '<div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:var(--s3)">' + btn + '</div>' + form;
}

function saveAdd(){
  const v = (k) => ((document.getElementById(k) || {}).value || '').trim();
  const picked = v('ad0');
  const c = (picked && D.customers.find(x => x.name === picked)) || (view.id ? cust(view.id) : null);
  if (!addFor) return;
  /* The same gate the form was drawn behind. A click can be forged from the
     console; the server is still the rule, but the client must not help. */
  if (ADD_CAP[addFor] && !can(ADD_CAP[addFor])) return;
  const me = (D.me && D.me.name) || 'Teh Bin Shun';
  const kind = ADD_SPEC[addFor].act;
  /* A product does not belong to a customer. Everything else does, and it used
     to return silently when none was picked — the form stayed open, the button
     read "Cancel", and the save looked like it had worked. Say what is wrong. */
  if (!c && kind !== 'product'){ toast('Pick the customer this belongs to.'); return; }
  const one = v('ad1');
  if (!one){ toast(kind === 'note' ? 'Say what happened.' : 'A name, at least.'); return; }

  if (kind === 'contact'){
    if ((c.contacts || []).some(p => p.n === one)){ toast(one + ' is already on this customer.'); return; }
    (c.contacts = c.contacts || []).push({ n:one, t:v('ad2') || '-', s:'Undecided', o:me,
      b:v('ad3') || 'Influencer', em:v('ad4') || '', ph:v('ad5') || '', note:'' });
    audit('data', 'Person added', one + ' - ' + c.name, '-', v('ad3') || 'Influencer');
  } else if (kind === 'system'){
    (c.apps = c.apps || []).push({ n:one, v:v('ad2') || '-', stance:v('ad3') || 'Integrate' });
    audit('data', 'System added', one + ' - ' + c.name, '-', v('ad3') || 'Integrate');
  } else if (kind === 'opp'){
    /* The same rule as the edit form: a close date that is not a date is
       worse than none. Until now the field did not exist here at all and the
       row was created empty of both date and description. */
    const close = v('ad4');
    if (close && !/^\d{4}-\d{2}-\d{2}$/.test(close)){
      toast('The close date needs to look like 2027-03-31 — or leave it empty.'); return;
    }
    const id = 'o' + Date.now();
    const val = Number(String(v('ad2')).replace(/[^0-9.]/g, '')) || 0;
    (D.opps = D.opps || {})[id] = { id, c:c.id, t:one, stage:v('ad3') || 'Interested', v:val, p:10,
      stageAt: todayISO(), owner:me, comp:'-', close, cust:'', desc:v('ad5') || '', soln:'' };
    (c.opps = c.opps || []).push(id);
    audit('data', 'Opportunity created', one + ' - ' + c.name, '-', v('ad3') || 'Interested');
  } else if (kind === 'step'){
    /* A due date that is not a date is worse than none: it will be compared,
       sorted and nagged about forever. Take a real ISO date or take nothing. */
    const due = v('ad3');
    if (due && !/^\d{4}-\d{2}-\d{2}$/.test(due)){
      toast('The date needs to look like 2026-10-05 — or leave it empty.'); return;
    }
    /* §5: two roles. The Execution Owner may be anyone relevant; the Tracker
       must be this customer's Primary BD or Primary SA. The server refuses a
       Tracker that is not, so refusing it here too means the person is told
       why instead of watching a save fail. */
    const exec = v('ad2') || me;
    const track = v('ad5') || c.owner || c.sa || me;
    if (!trackOnCustomer(c, track)){
      toast('The Tracker must be this account\u2019s Primary BD (' + (c.owner || 'unset')
        + ') or Primary SA (' + (c.sa || 'unset') + ').');
      return;
    }
    (D.steps = D.steps || []).unshift({ id:'s' + Date.now(), c:c.id, t:one,
      exec, track, due, w:'', from:v('ad4') === 'customer' ? 'customer' : 'us', p:'p1',
      done:'', doneBy:'', doneNote:'' });
    /* The promise itself belongs in the account's memory, not only in the
       list of what is still open. A step was the one fact that reached the
       timeline only when it was FINISHED — `stepdone` writes "Done: …" — so
       the account's history said an action was completed and never said it
       was made. Read by the other person on the account (which is the whole
       point of Scenario 3), the record showed the outcome with no cause.
       Written the same way an interaction and a note are written, so the
       timeline has one shape and the reader needs one rule. */
    (c.timeline = c.timeline || []).unshift({ d: todayISO(), k:'step', t:one,
      x: exec + (track && track !== exec ? ' · tracked by ' + track : '')
         + (due ? ' · due ' + due : '') });
    audit('data', 'Action added', one + ' - ' + c.name, '-', exec + ' (tracked by ' + track + ')');
  } else if (kind === 'interaction'){
    /* One entry, two places: the Meetings screen and the customer's own
       timeline. They are the same fact seen from two directions, so it is
       written once here rather than left for somebody to reconcile later. */
    (D.interactions = D.interactions || []).unshift({ id:'m' + Date.now(), c:c.id, t:one, d:todayISO(), w:'Today',
      loc:'', att:v('ad2') || '-', ours:me, sum:'', out:v('ad3') || '', k:v('ad4') || 'Meeting' });
    (c.timeline = c.timeline || []).unshift({ d:todayISO(), k:'interaction', t:one, x:v('ad3') || '' });
    audit('data', 'Interaction logged', one + ' - ' + c.name, '-', v('ad3') || '-');
  } else if (kind === 'product'){
    if ((D.products || []).some(p => p.n.toLowerCase() === one.toLowerCase())){
      toast(one + ' is already in the catalogue.'); return;
    }
    const cat = v('ad2') || 'Other';
    /* The abbreviation is derived, not asked for: three fields is already more
       than anybody types when they are adding one product. */
    const ab = (one.replace(/[^A-Za-z0-9 ]/g, ' ').trim().split(/\s+/).slice(0, 3)
      .map(w => w[0]).join('') || one.slice(0, 3)).toUpperCase();
    (D.products = D.products || []).push({ id:'p' + Date.now(), n:one, ab, cat, one:v('ad3') || '', by:[] });
    audit('data', 'Product added', one, '-', cat);
  } else {
    (c.timeline = c.timeline || []).unshift({ d:todayISO(), k:'note', t:one, x:v('ad2') || '' });
    audit('data', 'Note added', one + ' - ' + c.name, '-', '-');
  }
  addFor = null;
  render(); toast('Added - ' + one);
}

/* ------------------------------------------------------------------ remove
   Add and remove belong together. A product where you can create a row but not
   take one back makes people leave wrong data in it, and wrong data in a system
   of record is worse than missing data: missing data gets chased, wrong data
   gets believed. The confirm happens on the row itself, never in a browser
   dialog - a dialog cannot tell you which row you are about to lose. */
let rmAsk = null;

const rmKey = {
  person: (c, p) => 'person|' + c.id + '|' + p.n,
  system: (c, a) => 'system|' + c.id + '|' + a.n,
  opp:    (c, o) => 'opp|' + c.id + '|' + o.id,
  step:   (c, s) => 'step|' + c.id + '|' + s.id,
  /* The key prefix is the record KIND, and §17 renamed it. It is internal —
     the form, the remove bar and the save handler all read it through this
     one table — so a stale prefix cannot survive in a corner. */
  interaction: (m) => 'interaction|' + m.c + '|' + m.id,
  file:   (f)    => 'file|' + f.c + '|' + f.id,
  note:   (c, t) => 'note|' + c.id + '|' + t.d + '|' + t.t
};

function rmBar(key, what){
  /* Removing something is changing the record, so it answers to the same
     half-of-the-record rule as editing it — and deletion is the one act the
     matrix reserves to the administrator (`del`), which the server enforces
     on every path. A Remove drawn for anybody else was a button that looked
     like it worked and was quietly undone on the next reload — the worst
     kind of promise this product can make. */
  if (!can('del') || !can('edit') || !canEditKind(key)) return '';
  if (rmAsk !== key)
    return '<button class="btn sm" data-act="rm" data-rm="' + esc(key) + '"'
         + ' title="Remove ' + esc(what) + ' — administrator only">Remove</button>';
  return '<span class="tiny">Remove ' + esc(what) + '?</span>'
       + '<button class="btn sm pri" data-act="rmyes" data-rm="' + esc(key) + '">Yes, remove</button>'
       + '<button class="btn sm" data-act="rmno">Cancel</button>';
}

function doRemove(key){
  const p = String(key).split('|');
  const kind = p[0];
  const c = cust(p[1]);
  if (!c) return;
  /* The same gates the button was drawn behind. A click can be forged from a
     console; the server would refuse it anyway, but the client must not help
     a person believe a removal happened when the next reload undoes it. */
  if (!can('del') || !can('edit') || !canEditKind(key)) return;
  const who = kind === 'note' ? p.slice(3).join('|') : p[2];
  if (kind === 'person'){
    c.contacts = (c.contacts || []).filter(x => x.n !== who);
    if (pickedPerson === who) pickedPerson = null;
  } else if (kind === 'system'){
    c.apps = (c.apps || []).filter(x => x.n !== who);
  } else if (kind === 'opp'){
    delete D.opps[who];
    c.opps = (c.opps || []).filter(x => x !== who);
    goneAdd('opps', who);
  } else if (kind === 'step'){
    D.steps = (D.steps || []).filter(x => x.id !== who);
    goneAdd('steps', who);
  } else if (kind === 'interaction'){
    /* A meeting is one fact in two places: the Meetings screen and the
       customer's timeline. Taking one back has to take both, or the timeline
       goes on claiming a conversation that nobody can open. */
    const m = (D.interactions || []).find(x => x.id === who);
    D.interactions = (D.interactions || []).filter(x => x.id !== who);
    goneAdd('interactions', who);
    if (m){
      const tl = c.timeline || [];
      const at = tl.findIndex(t => TL_IS_INTERACTION(t.k) && t.t === m.t);
      if (at >= 0) tl.splice(at, 1);
    }
  } else if (kind === 'note'){
    c.timeline = (c.timeline || []).filter(x => !(x.d === p[2] && x.t === who));
  } else if (kind === 'file'){
    D.files = (D.files || []).filter(x => x.id !== who);
    goneAdd('files', who);
  }
  audit('data', 'Removed', (who || 'a row') + ' - ' + c.name, '-', '-');
  rmAsk = null;
  render();
  toast('Removed - ' + (who || 'the row'));
}

/* --------------------------------------------------------------------- edit
   Create and delete are not enough on their own. A name gets misspelled, a
   person changes role, a system moves platform. A record you can only destroy
   and rebuild is a record people stop correcting — and an uncorrected record
   is worse than a missing one, because it still looks authoritative.
   The key is the same one Remove uses, so a row is identified in exactly one
   way no matter which action is taken on it. */
let edFor = null;

/* Which half of the record each kind of edit belongs to.
   Reading across is allowed — a solution without a budget is a science
   project, and a price without an architecture is a rumour — but WRITING
   across is not. So an SA can open an opportunity and see the value, and the
   Edit button is simply not there: BD owns the money, SA owns the machines,
   and neither can quietly overwrite the other. */
const EDIT_CAP = { opp:'commercial', system:'technical', person:'people', cust:'edit', note:'log',
                   brief:'edit', pains:'edit', step:'log', interaction:'log' };
const canEditKind = (key) => {
  const kind = String(key).split('|')[0];
  const cap = EDIT_CAP[kind];
  return !cap || can(cap);
};

/* ------------------------------------------------- the customer, split in two
 *
 * `EDIT_CAP.cust` used to be `'edit'`, and `edit` is what an SA holds. So the
 * one screen where §5 becomes a decision — the customer form — was open to
 * both roles alike, and the field where it matters most, `owner`, was open
 * with it. An SA could take an account.
 *
 * The reason it was never noticed is that the split was drawn around KINDS of
 * record instead of around the FIELDS people actually type. "Customer" is not
 * one half of §5's bargain. WHO the company is — its name, its industry, where
 * it is, its website, its headcount, how long they have been ours — is a set of
 * FACTS about the account, and both people on it maintain them: a BD corrects
 * the website the day it changes, and an SA does the same. They belong to
 * neither half of the bargain, so they answer to `edit`, which both roles hold.
 * WHOSE account it is, how the relationship stands, and how healthy it is is
 * the money, and that is the only part §5 splits.
 *
 * It is worth saying plainly, because it is the mistake this table was first
 * written with: the fact fields are NOT `technical`. `technical` is the SA's
 * own capability and a BD does not hold it, so classifying the industry under
 * it silently took the customer form away from every BD in the workspace —
 * caught by `verify:journey` and `verify:scenarios`, both of which edit the
 * industry and the website as a BD. The test is not "which role owns this
 * kind of record" but "is this the money", and only three fields pass it.
 *
 * So the cap is per field, not per form. One form, one Save, and each field
 * asks for the capability it belongs to. An SA opens the same Edit they always
 * did and finds every fact, with the commercial three fields not drawn for
 * them and — the part that matters — not written from their save either,
 * because a hidden input is a suggestion and a skipped assignment is a rule.
 *
 * The client is not the boundary. The server does not know these capabilities,
 * so it does not enforce them; see `saCommercialGuard` in server.mjs, which
 * holds the same three fields by role. What the split guarantees here is that
 * the client never OFFERS a field the role cannot write, and never writes one
 * it did not offer. */
const CUST_FIELD_CAP = {
  ed1: 'edit',        /* Customer — the name. A fact, not a half of §5. */
  ed2: 'edit',        /* Industry */
  ed3: 'edit',        /* Headquarters */
  ed4: 'edit',        /* Website */
  ed5: 'commercial',  /* Owner — whose account it is. This is the money. */
  ed6: 'commercial',  /* Their stance */
  ed7: 'commercial',  /* Health */
  ed8: 'edit',        /* People — approximate headcount */
  ed9: 'edit'         /* Customer since */
};
/* May this session write this field of the customer form? A field with no
   declared capability is the form's own business and is allowed; a declared
   one is asked for. The default is deliberately permissive so a field added
   to `cust` tomorrow does not vanish from every role's form until somebody
   remembers to classify it — silent disappearance is a worse bug than a
   field briefly too open, because a missing field is never reported. */
const canWriteCustField = (k) => { const cap = CUST_FIELD_CAP[k]; return !cap || can(cap); };

/* One opportunity, as its edit form wants it.
 *
 * This exists because the same ten values were built by hand in two places —
 * the customer's Opportunities tab and the board card — as positional arrays.
 * Two copies of a list that must stay in step is a silent divergence waiting
 * for the next field: add one to the spec and the copy nobody edited shifts
 * every value one place to the left, and Save writes a competitor into the
 * close date with no error anywhere. Naming the fields removes the ordering
 * entirely, so a new field has one obvious home and nothing can drift.
 *
 * A missing numeric field stays a string: the form compares values as strings,
 * and `String(0)` in a box a person then clears is a 0 nobody typed.
 */
function oppFormValues(o){
  return {
    ed1:  o.t ?? '',
    ed2:  o.v != null ? String(o.v) : '',
    ed3:  o.stage ?? '',
    ed4:  o.p != null ? String(o.p) : '',
    ed5:  o.close || '',
    /* The seeded competitor is an em dash meaning "nobody", not a competitor
       actually called "—". Writing that back would invent a rival. */
    ed6:  o.comp && o.comp !== '—' ? o.comp : '',
    ed7:  o.cust || '',
    ed8:  o.desc || '',
    ed9:  o.owner || '',
    ed10: o.lost || '',
  };
}

const EDIT_SPEC = {

    /* Close date, competitor, their owner and the description used to exist

    { k:'ed10', ph:'Why we lost — required when the stage is Lost', ta:true }

  cust: [
    { k:'ed1', ph:'Customer', wide:true },

    { k:'ed3', ph:'Headquarters' },
    { k:'ed4', ph:'Website — the domain, without https://', wide:true },
    { k:'ed5', ph:'Owner' },
    { k:'ed6', ph:'Their stance', sel:'STANCEP' },
    { k:'ed7', ph:'Health', sel:'HEALTH' },
    /* Headcount and customer-since are printed on the customer header; they

    { k:'ed8', ph:'People - approximate headcount, digits only' },
    { k:'ed9', ph:'Customer since - e.g. Mar 2026' }
  ],
  brief: [
    { k:'ed1', ph:'Where this stands' }
  ],

  ],

    { k:'ed3', ph:'Due - 2026-10-05, or empty' },
