let tour = { id:null, i:0, timer:null, playing:false };

function seenTour(){
  try { return localStorage.getItem('cwb-tour-seen') === '1'; } catch (e) { return false; }
}
function markTourSeen(){
  try { localStorage.setItem('cwb-tour-seen', '1'); } catch (e) { /* file:// — no storage */ }
}

/* The menu belongs to the button that opens it. Parked at `right:var(--s6)`
   it sat three hundred pixels away from the thing you just clicked on a wide
   window, and nowhere near the middle of the screen either — a panel that
   answers a click should appear where the click was. Narrow screens keep the
   stylesheet's edge-to-edge layout: there, "under the button" is the screen. */
function anchorTourMenu(){
  const m = document.getElementById('tMenu'), b = document.getElementById('tourOpen');
  if (!m || !b) return;
  if ((window.innerWidth || 0) <= 880){
    m.style.left = m.style.top = m.style.right = m.style.width = '';
    return;
  }
  const r = b.getBoundingClientRect(), w = 308, pad = 12;
  const vw = window.innerWidth || document.documentElement.clientWidth || 0;
  let left = Math.round(r.right - w);
  left = Math.max(pad, Math.min(left, Math.max(pad, vw - w - pad)));
  let top = Math.round(r.bottom + 8);
  const h = m.offsetHeight || 0;
  if (h && top + h > (window.innerHeight || 0) - pad) top = Math.max(pad, r.top - h - 8);
  m.style.right = 'auto';
  m.style.width = w + 'px';
  m.style.left = left + 'px';
  m.style.top = top + 'px';
}

function tourMenu(){
  const m = document.getElementById('tMenu');
  m.innerHTML = `<div class="tm-f" style="padding-bottom:8px">Six walkthroughs. Each one plays over the
    real screens — same data, same words.</div>` +
    TOURS.map(t => `<button class="tm-i" data-tour-start="${t.id}">
      <span class="n">${t.name}<div class="d">${t.blurb}</div></span>
      <span class="m">${t.steps.length}</span></button>`).join('');
  m.classList.toggle('on');
  if (m.classList.contains('on')) anchorTourMenu();
}
window.addEventListener('resize', () => {
  const m = document.getElementById('tMenu');
  if (m && m.classList.contains('on')) anchorTourMenu();
});

function startTour(id){
  if (!TOURS.some(t => t.id === id)) return;
  document.getElementById('tMenu').classList.remove('on');
  markTourSeen();
  /* The tour drives the app through a dozen screens in ninety seconds. Those
     are the tour's movements, not the user's, so the address bar is left where
     the user was and restored when the tour ends — otherwise "watch the tour"
     would also mean "lose the account you were reading". */
  routeSilent = true;
  tour = { id, i:0, timer:null, playing:true };
  document.getElementById('tour').classList.add('on');
  document.getElementById('tName').textContent = TOURS.find(t => t.id === id).name;
  document.getElementById('tPlay').textContent = 'Pause';
  tourGoto(0);
}

function tourGoto(i){
  const t = TOURS.find(x => x.id === tour.id);
  if (!t) return;
  if (i >= t.steps.length){ tourStop(); return; }
  tour.i = Math.max(0, i);
  const s = t.steps[tour.i], steps = t.steps;
  clearTimeout(tour.timer);

  /* every step begins from a known state */
  closePal(); closeCapture();
  /* A tour step names a record; if that record has been deleted the step falls
     back to whatever exists, rather than walking into an empty screen. */
  const tourOpp = () => (Object.values(D.opps).sort((a, b) => oppAge(b) - oppAge(a))[0] || {}).id || 'o1';
  const tourId = () => {
    if (s.id && cust(s.id)) return s.id;
    return (D.customers[0] || {}).id || null;
  };
  if (s.go){ view = { s:s.go, id:tourId(), tab:s.tab || 'brief', cview:s.cview || 'board' }; render(); }
  if (s.before) s.before();

  document.getElementById('tStep').textContent = (tour.i + 1) + ' / ' + steps.length;
  document.getElementById('tDots').innerHTML = steps.map((_, k) => `<b class="${k === tour.i ? 'on' : ''}"></b>`).join('');
  const tx = document.getElementById('tText');
  tx.classList.add('out');
  tx.innerHTML = s.t;

  const dwell = s.d || 3800;
  setTimeout(() => {
    const el = s.sel ? document.querySelector(s.sel) : null;
    const spot = document.getElementById('tSpot'), cur = document.getElementById('tCur');
    if (!el){
      console.warn('walkthrough: no target for ' + s.sel);
      spot.style.opacity = 0;
      cur.classList.remove('on');
    } else {
      if (el.scrollIntoView) el.scrollIntoView({ block:'center' });
      const r = el.getBoundingClientRect(), pad = 7;
      spot.style.opacity = 1;
      spot.style.left = (r.left - pad) + 'px';
      spot.style.top = (r.top - pad) + 'px';
      spot.style.width = (r.width + pad * 2) + 'px';
      spot.style.height = (r.height + pad * 2) + 'px';
      if (s.click !== false){
        cur.style.left = (r.left + Math.min(r.width - 16, 28)) + 'px';
        cur.style.top = (r.top + r.height / 2) + 'px';
        cur.classList.add('on');
      } else cur.classList.remove('on');
    }
    requestAnimationFrame(() => tx.classList.remove('out'));
  }, s.before ? 340 : 110);

  const bar = document.getElementById('tBar');
  bar.style.transition = 'none'; bar.style.width = '0%';
  requestAnimationFrame(() => { bar.style.transition = 'width ' + dwell + 'ms linear'; bar.style.width = '100%'; });

  if (tour.playing) tour.timer = setTimeout(() => tourGoto(tour.i + 1), dwell + 420);
}

function tourStop(){
  clearTimeout(tour.timer);
  tour = { id:null, i:0, timer:null, playing:false };
  document.getElementById('tour').classList.remove('on');
  document.getElementById('tCur').classList.remove('on');
  closePal(); closeCapture();
  /* The tour has finished moving the app. Give the address bar back, and put
     it at whatever the tour left on screen — which is now the user's own
     position again, so it is theirs to keep. */
  routeSilent = false;
  syncRoute();
}

document.getElementById('tourOpen').onclick = tourMenu;
document.getElementById('tClose').onclick = tourStop;
document.getElementById('tNext').onclick = () => { clearTimeout(tour.timer); tourGoto(tour.i + 1); };
document.getElementById('tBack').onclick = () => { clearTimeout(tour.timer); tourGoto(tour.i - 1); };
document.getElementById('tPlay').onclick = (e) => {
  tour.playing = !tour.playing;
  e.target.textContent = tour.playing ? 'Pause' : 'Play';
  if (tour.playing) tourGoto(tour.i); else clearTimeout(tour.timer);
};

/* Back, Forward, a pasted link and a reload all arrive here — one path in, so
   a hash the user typed travels through exactly the checks a hash the app
   wrote does. Signed out there is no workspace to move around in, so the
   listener does nothing and the sign-in screen stays put. */
window.addEventListener('hashchange', () => {
  if (view.s === 'login') return;
  if (!navigateFromHash()){
    /* The hash named somewhere this user may not go — a record outside their
       scope, or a screen their role cannot open. Coming back via Back is the
       usual way this happens, and returning quietly here would leave the
       refused address sitting in the bar while the screen showed something
       else. Render, so `syncRoute` puts the address back on the screen the
       user is actually looking at. */
    render();
    return;
  }
  render();
});

/* Open into the shared book when the server already knows who we are;
   otherwise start at the sign-in screen. Either way the app renders — a
   server that never answers must not mean a blank page. */
(async () => {
  let authed = false;
  try {
    let s = await (await fetch('/api/session', { credentials: 'same-origin' })).json();
    authed = !!(s && s.authed) || !!(s && s.setup);
    /* The cookie session may have expired while this device is remembered.
       Exchange the remembered token for a fresh cookie before deciding this
       is a stranger. A dead token is cleared, never retried forever. */
    if (!authed && s && s.requiresAuth) {
      let token = '';
      try { token = localStorage.getItem('cwb-device') || ''; } catch (e) { token = ''; }
      if (token) {
        try {
          const r = await fetch('/api/login/token', { method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) });
          if (r.ok) {
            s = await (await fetch('/api/session', { credentials: 'same-origin' })).json();
            authed = !!(s && s.authed);
          } else {
            try { localStorage.removeItem('cwb-device'); } catch (e) { /* nothing stored */ }
          }
        } catch (e) { /* the server is not answering; the login screen says so */ }
      }
    }
    /* A session that outlived the page still knows who you are — take it, so
       a reload does not quietly promote anybody back to Admin. */
    if (s && s.user && s.user.name) {
      D.me = { ...(D.me || {}), name: s.user.name, role: s.user.role };
      drawMe();
      meFromSession = true;
    }
  } catch { /* no server — run from the copy in this file */ }
  /* Ask the server once whether a model is really reachable, so no screen has
     to guess. A failure here is not an error state — it is the honest answer. */
  await refreshAi();
  if (authed){ await syncLoad(); enterApp(); fetchAiTasks(); }
  else render();
})();
</script>
